<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Content Pipeline — an assisted production line for business content</title>
<meta name="description" content="An interactive demo of a staged content production line: ideation, research, drafting, editing, design and publishing, with a human approval at every station." />
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --page:#EDF0F4; --surface:#FFFFFF; --raise:#F6F8FA;
  --ink:#12202E; --muted:#5B6977; --line:#D5DCE3;
  --accent:#17557C; --accent-soft:#E6EEF5;
  --amber:#A9711A; --amber-soft:#F8EFDD;
  --green:#1C6B4B; --green-soft:#E3EFE9;
  --red:#9E2B20; --red-soft:#F7E7E4;
  --serif:'Newsreader', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.wrap{max-width:1120px;margin:0 auto;padding:0 24px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0 16px;border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap}
.mark{display:flex;flex-direction:column;line-height:1.2}
.mark b{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:-.01em}
.mark span{font-size:12.5px;color:var(--muted)}
.nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.navbtn{background:transparent;border:1px solid transparent;padding:7px 12px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:500}
.navbtn[aria-current="page"]{color:var(--ink);background:var(--surface);border-color:var(--line)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 15px;border-radius:5px;cursor:pointer;font-weight:500;line-height:1.6}
.btn:hover:not(:disabled){background:var(--raise);border-color:#B9C3CE}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover:not(:disabled){background:#1E3348;border-color:#1E3348}
.btn-quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn-quiet:hover:not(:disabled){background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.25;margin:0 0 6px;letter-spacing:-.015em}
h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 4px;line-height:1.35}
.sub{color:var(--muted);margin:0;max-width:68ch}
.hint{font-size:13px;color:var(--muted);line-height:1.6}
.label{font-weight:600;font-size:13.5px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.back{padding:2px 0;margin-bottom:6px;background:none;border:0;color:var(--muted);cursor:pointer}
.back:hover{color:var(--ink)}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:5px;background:var(--raise);padding:8px 11px;line-height:1.65}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);background:var(--surface);outline:none}
.textarea{resize:vertical}
.block{padding:20px 0;border-bottom:1px solid var(--line)}
.block:first-child{padding-top:0}
.block:last-of-type{border-bottom:0}
.block-head{display:flex;flex-direction:column;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 13px;border-radius:4px;cursor:pointer;line-height:1.5}
.chip:hover{border-color:#B9C3CE}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.chip-locked{cursor:default}
.frow{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;padding:6px 0}
.fgroup{font-size:13.5px;color:var(--muted);font-weight:500}
.opt{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;display:flex;flex-direction:column;gap:3px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--accent)}
.mode b{font-weight:600}
.check{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.submit{display:flex;align-items:center;gap:14px;padding-top:20px;flex-wrap:wrap}
.grow{display:flex;gap:8px;flex:1 1 340px}
.grow .input,.grow .select{flex:1;min-width:0}

.notice{background:var(--amber-soft);border-left:3px solid var(--amber);padding:9px 13px;border-radius:4px;font-size:14px;margin:0 0 14px}
.failure{background:var(--red-soft);border-left:3px solid var(--red);padding:11px 14px;border-radius:4px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.failure p{margin:0;color:var(--red)}
.failure-text{color:var(--red);font-size:14px;margin:8px 0 0}
.notes{margin-top:16px;padding:13px 15px;background:var(--raise);border:1px solid var(--line);border-radius:5px}
.notes p{margin:5px 0 8px;white-space:pre-wrap;font-size:14px}
.out{margin-top:14px;white-space:pre-wrap}
.banner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--amber-soft);border:1px solid var(--amber);padding:15px 17px;border-radius:6px}
.stage-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
.running{color:var(--muted);margin:0}
.coord{display:flex;gap:10px;align-items:baseline;margin:0 0 12px;font-size:14px;flex-wrap:wrap;color:var(--muted)}
.coord b{font-weight:600;color:var(--ink)}

.line{display:flex;overflow-x:auto;padding:4px 2px 14px;margin-bottom:12px}
.station{position:relative;flex:1 0 130px;display:flex;flex-direction:column;align-items:flex-start;padding:11px 14px 13px;background:var(--surface);border:1px solid var(--line);border-radius:6px;cursor:pointer;text-align:left}
.station + .station{margin-left:22px}
.station + .station::before{content:"";position:absolute;left:-23px;top:50%;width:22px;border-top:1px dashed #B9C3CE}
.station[data-state="done"]{border-color:var(--amber)}
.station[data-state="done"] .st-status{color:var(--amber)}
.station[data-state="approved"]{border-color:var(--green)}
.station[data-state="approved"] .st-status{color:var(--green)}
.station[data-state="error"]{border-color:var(--red)}
.station[data-state="error"] .st-status{color:var(--red)}
.station[aria-current="step"]{box-shadow:0 0 0 2px var(--accent)}
.station[data-state="running"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:0 0 5px 5px;
  background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,#9FB6C8 8px 16px);background-size:22.63px 22.63px;animation:belt .9s linear infinite}
@keyframes belt{from{background-position:0 0}to{background-position:22.63px 0}}
@media (prefers-reduced-motion:reduce){.station[data-state="running"]::after{animation:none}}
.st-num{font-size:11.5px;color:var(--muted)}
.st-label{font-weight:600}
.st-status{font-size:12.5px;color:var(--muted)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}

.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0 0 18px;font-size:13.5px}
.dl dt{color:var(--muted)}

.badge{display:inline-block;padding:2px 9px;border-radius:3px;font-size:12.5px;font-weight:500;background:#E7EBF0;color:var(--muted);white-space:nowrap}
.badge-go{background:var(--green-soft);color:var(--green)}
.badge-wait{background:var(--amber-soft);color:var(--amber)}
.badge-stop{background:var(--red-soft);color:var(--red)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:2px;flex-wrap:wrap;align-items:flex-end}
.tab{background:transparent;border:0;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.filter{margin-left:auto;padding-bottom:7px}
.filter .select{width:auto;padding:5px 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;padding:15px 6px;background:transparent;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;flex-wrap:wrap}
.row:hover{background:rgba(255,255,255,.6)}

.dots{display:flex;gap:3px}
.dots span{width:9px;height:9px;border-radius:2px;background:var(--line)}

.empty{padding:40px 6px;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:flex-start}

.ideas{display:grid;gap:10px}
.idea{text-align:left;border:1px solid var(--line);border-radius:6px;padding:11px 14px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column}
.idea[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.slides{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px}
.slide{flex:0 0 auto;border-radius:4px;padding:18px 16px 32px;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(18,32,46,.14);line-height:1.55;display:flex;flex-direction:column;justify-content:center}
.s-cover{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.3}

.s-body{font-size:12.5px;margin-top:8px}

.s-foot{position:absolute;bottom:9px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:10.5px;opacity:.7}
details{margin-top:10px}
summary{cursor:pointer;font-weight:500;padding:6px 0}
.slide-edit{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}

.repurpose{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0 14px;margin-top:16px}
.wide{grid-column:1 / -1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{text-align:left;display:flex;flex-direction:column;gap:5px;padding:17px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card b{font-family:var(--serif);font-weight:600;font-size:18px}
.swatches{display:flex;gap:4px;margin-bottom:4px}
.swatches i{width:17px;height:17px;border-radius:3px;border:1px solid rgba(0,0,0,.12);display:inline-block}
.colors{display:flex;gap:16px;flex-wrap:wrap}
.color{display:flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer}
.color input{width:38px;height:30px;border:1px solid var(--line);border-radius:4px;padding:0;background:none}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:34px 32px;margin-bottom:24px}
.hero h1{font-size:34px;max-width:19ch}
.hero p{max-width:62ch}
.hero-line{display:flex;gap:0;margin:26px 0 0;flex-wrap:wrap}
.hero-step{flex:1 1 130px;padding:12px 14px;border-left:2px solid var(--line)}

.hero-step span{font-size:12.5px;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:5px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:20}

@media (max-width:900px){.grid{grid-template-columns:1fr}.aside{position:static}}

</style>

<div class="wrap">
  <header class="top">
    <div class="mark"><b>Content Pipeline</b><span>An assisted production line for business content</span></div>
    <nav class="nav" id="nav"></nav>
  </header>

  <footer style="margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px">

<script>
/* ============================================================
   Content Pipeline — single-file interactive demo
   Vanilla JS. No build step, no server. Works from any static host.
   ============================================================ */

/* ---------- storage ---------- */
const LS_KEY = "content-pipeline-v1";
const state = {
  businesses: [],
  projects: [],
  settings: { mode: "demo", apiKey: "", model: "claude-sonnet-4-6" },
  view: { name: "home" },
  ui: {},
};

function persist() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      businesses: state.businesses, projects: state.projects,
      settings: { ...state.settings, apiKey: state.settings.apiKey },
    }));
  } catch (e) { /* private mode — session still works */ }
}
function restore() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    state.businesses = d.businesses || [];
    state.projects = (d.projects || []).map((p) => {
      const ss = { ...p.stageStatus };
      const er = { ...(p.errors || {}) };
      Object.keys(ss).forEach((k) => {
        if (ss[k] === "running") { ss[k] = "error"; er[k] = "The run was interrupted. Run this station again."; }
      });
      return { ...p, stageStatus: ss, errors: er };
    });
    state.settings = { ...state.settings, ...(d.settings || {}) };
    return true;
  } catch (e) { return false; }
}

/* ---------- configuration ---------- */
const STAGE_ORDER = ["idea", "research", "write", "edit", "design", "publish"];

const STAGES = {
  idea:     { label: "Ideas",       desc: "Proposes five distinct angles. You pick one.", optional: true },
  research: { label: "Research",    desc: "Collects facts, figures and examples, and flags claims that need checking.", optional: true },
  write:    { label: "Draft",       desc: "Writes the piece to the rules of the chosen format.", optional: false },
  edit:     { label: "Edit",        desc: "Tests the draft against the brand profile, rewrites it and lists what changed.", optional: false },
  design:   { label: "Design",      desc: "Lays out slides or writes a visual brief for your designer.", optional: true },
  publish:  { label: "Publish kit", desc: "Caption, tags, suggested timing and a pre-flight checklist.", optional: true },
};

const STATUS_LABEL = { pending: "Queued", running: "Working", done: "Needs your review", approved: "Approved", error: "Stopped" };

const FORMATS = {
  ig_carousel: {
    group: "Instagram", label: "Carousel", visual: "slides", ratio: "1/1", countKey: "slides",
    options: [
      { key: "slides", label: "Slides", choices: ["5", "7", "10"], def: "7" },
      { key: "style", label: "Style", choices: ["Teaching", "Story", "Listicle", "Myth-busting"] },
    ],
    stages: ["idea", "research", "write", "edit", "design", "publish"],
    write: (o) => `Write the copy for a ${o.slides}-slide carousel in a ${o.style.toLowerCase()} style. Start each slide with "Slide 1:", give it a short headline and no more than 30 words of body copy. Slide one is the hook; the last slide is the call to action.`,
  },
  ig_post: {
    group: "Instagram", label: "Single post", visual: "slides", ratio: "1/1", fixedCount: 1,
    options: [{ key: "type", label: "Type", choices: ["Tip", "Quote", "Simple infographic"] }],
    stages: ["idea", "write", "edit", "design", "publish"],
    write: (o) => `Write a single-image post of the "${o.type}" type in two labelled parts: "On-image text:" of at most 20 words, and "Caption:" of at most 120 words.`,
  },
  ig_reel: {
    group: "Instagram", label: "Reel", visual: "brief",
    options: [
      { key: "duration", label: "Length", choices: ["15 seconds", "30 seconds", "60 seconds", "90 seconds"], def: "30 seconds" },
      { key: "style", label: "Delivery", choices: ["To camera", "Voiceover", "On-screen text"] },
    ],
    stages: ["idea", "research", "write", "edit", "design", "publish"],
    write: (o) => `Write a ${o.duration} reel script delivered ${o.style.toLowerCase()}: a three-second hook, a timed body, and a closing call to action. Label "Spoken" and "On-screen" separately for every beat.`,
  },
  ig_story: {
    group: "Instagram", label: "Story", visual: "slides", ratio: "9/16", countKey: "frames",
    options: [
      { key: "frames", label: "Frames", choices: ["3", "5", "7"], def: "5" },
      { key: "interactive", label: "Sticker", choices: ["Poll", "Quiz", "Question box", "None"] },
    ],
    stages: ["idea", "write", "edit", "design", "publish"],
    write: (o) => `Write a ${o.frames}-frame story sequence. Start each frame with "Frame 1:" and keep it under 20 words. Interactive sticker: ${o.interactive}. If there is one, write the exact question and options on the right frame.`,
  },
  li_post: {
    group: "LinkedIn", label: "Text post", visual: null,
    options: [
      { key: "length", label: "Length", choices: ["Short", "Medium", "Long"], def: "Medium" },
      { key: "approach", label: "Approach", choices: ["First-person story", "How-to", "Analysis"] },
    ],
    stages: ["idea", "research", "write", "edit", "publish"],
    write: (o) => `Write a ${o.length.toLowerCase()} LinkedIn post using a ${o.approach.toLowerCase()} approach. Open with a hook line, keep paragraphs to two lines, and close with a question that invites replies.`,
  },
  li_slides: {
    group: "LinkedIn", label: "Document post", visual: "slides", ratio: "4/5", countKey: "slides",
    options: [{ key: "slides", label: "Slides", choices: ["6", "8", "12"], def: "8" }],
    stages: ["idea", "research", "write", "edit", "design", "publish"],
    write: (o) => `Write the copy for a ${o.slides}-slide LinkedIn document post. Start each slide with "Slide 1:", give it a headline and at most 35 words of body copy. Keep the register professional and practical.`,
  },
  x_post: {
    group: "X", label: "Single post", visual: null,
    options: [{ key: "tone", label: "Tone", choices: ["Direct", "Wry", "Analytical"] }],
    stages: ["idea", "write", "edit", "publish"],
    write: (o) => `Write one post of at most 280 characters in a ${o.tone.toLowerCase()} tone, then two alternative versions that take a different angle.`,

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e2) { return false; }
  }
}

function projectStatus(p) {

function coordinatorLine(p) {
  if (p.published) return "Published. When the numbers come in, hand them to the analyst below.";
  if (p.finalApproved) return "Every station is approved. This is ready to go out.";
  const run = p.stages.find((s) => p.stageStatus[s] === "running");
  if (run) return STAGES[run].label + " is working.";
  const err = p.stages.find((s) => p.stageStatus[s] === "error");
  if (err) return STAGES[err].label + " stopped. Open that station and run it again.";
  if (p.stages.every((s) => ["done", "approved"].includes(p.stageStatus[s]))) return "The line is finished. Review it and give final approval.";

function outputAsText(p, stage) {
  const o = p.outputs[stage];
  if (!o) return "";
  if (o.ideas) return o.ideas.map((i, k) => (k + 1) + ". " + i.title + " — " + i.angle + " — " + i.hook).join("\n");
  if (o.slides) return o.slides.map((s, k) => (k + 1) + ". " + s.title + ": " + s.body).join("\n");

function buildPrompt(p, stage, profile, feedback) {
  const parts = [BASE, profileBlock(profile), formatBlock(p)];
  if (p.sourceContent) parts.push("Source content to rework for this format:\n" + p.sourceContent);
  if (stage !== "idea") { const ib = ideaBlock(p); if (ib) parts.push(ib); }
  if (stage === "write" && p.outputs.research && p.outputs.research.text) parts.push("Research findings:\n" + p.outputs.research.text);
  if (stage === "edit") parts.push("The draft:\n" + ((p.outputs.write && p.outputs.write.text) || ""));
  if (stage === "design" || stage === "publish") parts.push("Final copy:\n" + finalText(p));
  parts.push(stagePrompt(p, stage));

    const prev = outputAsText(p, stage);
    parts.push((prev ? "Previous version from this station:\n" + prev + "\n\n" : "") + "Editor feedback that must be applied:\n" + feedback.trim());
  }
  return parts.join("\n\n");
}

/* ---------- live model call ---------- */
async function callModel(prompt, useWeb) {
  const key = state.settings.apiKey.trim();
  if (!key) throw new Error("Live mode needs an API key. Add one in Settings, or switch back to demo mode.");
  const body = { model: state.settings.model, max_tokens: 1400, messages: [{ role: "user", content: prompt }] };
  if (useWeb) body.tools = [{ type: "web_search_20250305", name: "web_search" }];
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify(body),
    });
  } catch (e) { throw new Error("Could not reach the model. Check the connection and run the station again."); }
  if (!res.ok) throw new Error("The model returned an error (" + res.status + "). Try the station again in a moment.");
  const data = await res.json();
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("").trim();
  if (!text) throw new Error("The response came back empty. Run the station again.");
  return { text: text, truncated: data.stop_reason === "max_tokens" };
}
function extractJSON(text, truncated) {
  const clean = text.replace(/```json|```/g, "");
  const s = clean.indexOf("{"), e = clean.lastIndexOf("}");
  try {
    if (s < 0 || e <= s) throw new Error("no json");
    return JSON.parse(clean.slice(s, e + 1));
  } catch (err) {
    throw new Error(truncated ? "The output hit the length ceiling and came back incomplete. Run it again." : "The output was not in the expected shape. Run it again.");
  }
}
function splitMarker(text, re) {
  const m = text.match(re);
  if (!m) return [text.trim(), ""];
  return [text.slice(0, m.index).trim(), text.slice(m.index + m[0].length).trim()];
}
const NOTES_RE = /-{2,}\s*NOTES\s*-{2,}/i;
const LEARN_RE = /-{2,}\s*LESSONS\s*-{2,}/i;

function firstClause(s, n) {
  const max = n || 60;
  let t = String(s || "").split(/[.,;\n]/)[0].trim();
  if (t.length <= max) return t;
  t = t.slice(0, max);
  const cut = t.lastIndexOf(" ");
  return (cut > 12 ? t.slice(0, cut) : t).trim();
}
function cap(s) { return String(s || "").charAt(0).toUpperCase() + String(s || "").slice(1); }
function subjectOf(p, profile) {
  const id = p.outputs.idea;
  if (id && id.ideas && id.chosen != null && id.ideas[id.chosen]) return id.ideas[id.chosen].title;
  if (p.topic) return p.topic;
  if (profile.pillars) return firstClause(profile.pillars, 50);
  return "how " + profile.name + " actually works";
}
function audienceOf(profile) {
  const raw = String(profile.audience || "").trim();
  if (!raw) return "the people you sell to";
  const head = raw.split(/\s+(?:who|that|which)\b|[,.;]/)[0].trim();
  let words = head.split(/\s+/).slice(0, 3).join(" ").replace(/\s+(and|or|&|of|for|in)$/i, "");
  return words.charAt(0).toLowerCase() + words.slice(1);
}

/* ---------- execution ---------- */
async function executeStage(p, stage, profile, feedback) {
  if (state.settings.mode === "demo") {
    await sleep(700 + Math.random() * 700);
    const out = demoStage(p, stage, profile);
    if (feedback && feedback.trim() && out.text) out.text = out.text + "\n\n[Demo mode: your feedback \u201c" + feedback.trim() + "\u201d would be applied to the rewrite in live mode.]";
    return out;
  }
  const f = FORMATS[p.format];
  const useWeb = p.webSearch && (stage === "idea" || stage === "research");
  const r = await callModel(buildPrompt(p, stage, profile, feedback), useWeb);
  if (stage === "idea") {
    const j = extractJSON(r.text, r.truncated);
    if (!Array.isArray(j.ideas) || !j.ideas.length) throw new Error("The ideas station did not return a usable list. Run it again.");
    return { ideas: j.ideas.slice(0, 5) };
  }
  if (stage === "design" && f.visual === "slides") {
    const j = extractJSON(r.text, r.truncated);
    if (!Array.isArray(j.slides) || !j.slides.length) throw new Error("The design station did not return usable slides. Run it again.");
    return { slides: j.slides };
  }
  if (stage === "edit") {
    const parts = splitMarker(r.text, NOTES_RE);
    return { text: parts[0], notes: parts[1], truncated: r.truncated };
  }
  return { text: r.text, truncated: r.truncated };
}

function touch(p) { p.updatedAt = Date.now(); persist(); }

function resetAfter(p, stage) {
  const i = p.stages.indexOf(stage);
  p.stages.slice(i + 1).forEach((s) => {
    p.stageStatus[s] = "pending";
    delete p.outputs[s];
    if (p.errors) p.errors[s] = null;
  });
  p.finalApproved = false;
}

async function runStage(id, stage, feedback) {
  const p = getP(id);
  if (!p) return false;
  const profile = getB(p.businessId);
  if (!profile) {
    p.stageStatus[stage] = "error";
    p.errors[stage] = "This project has no brand profile. Create one under Profiles first.";
    touch(p); render();
    return false;
  }
  p.stageStatus[stage] = "running";
  p.errors[stage] = null;
  touch(p); render();
  try {
    const out = await executeStage(p, stage, profile, feedback);
    const cur = getP(id);
    if (!cur) return false;
    if (stage === "idea") {
      const chosen = cur.mode === "auto" ? 0 : null;
      cur.outputs.idea = Object.assign({}, out, { chosen: chosen });
      if (chosen != null && out.ideas[chosen] && out.ideas[chosen].title) cur.title = out.ideas[chosen].title;
    } else {
      cur.outputs[stage] = out;
    }
    cur.stageStatus[stage] = "done";
    touch(cur); render();
    return true;
  } catch (e) {
    const cur = getP(id);
    if (cur) {
      cur.stageStatus[stage] = "error";
      cur.errors[stage] = e.message || "Something went wrong. Run the station again.";
      touch(cur); render();
    }
    return false;
  }
}

async function runAuto(id, fromIdx) {
  const p = getP(id);
  if (!p) return;
  for (let i = fromIdx; i < p.stages.length; i++) {
    const ok = await runStage(id, p.stages[i]);
    if (!ok) return;
  }
}

function chip(label, pressed, act, extraClass) {
  return '<button class="chip ' + (extraClass || "") + '" aria-pressed="' + (pressed ? "true" : "false") + '" data-act="' + act + '">' + esc(label) + "</button>";
}
function badge(label, cls) { return '<span class="badge ' + (cls || "") + '">' + esc(label) + "</span>"; }
function field(label, hint, control) {
  return '<label class="field"><span class="label">' + esc(label) + "</span>" + (hint ? '<span class="hint">' + esc(hint) + "</span>" : "") + control + "</label>";
}
function slideHTML(slide, i, total, profile, ratio) {
  const c = Object.assign({}, DEFAULT_COLORS, (profile && profile.colors) || {});
  const layout = slide.layout || "point";
  const cta = layout === "cta";
  const bg = cta ? c.accent : c.bg;
  const ink = cta ? c.bg : c.ink;
  const accent = cta ? c.bg : c.accent;
  const tall = ratio === "9/16";
  const w = tall ? 188 : ratio === "4/5" ? 220 : 238;
  const lines = String(slide.body || "").split(/\n|\\n/).map((s) => s.trim()).filter(Boolean);
  let inner = "";
  if (layout === "cover") {
    inner = '<div><div style="width:34px;height:4px;background:' + accent + ';margin-bottom:12px"></div><div class="s-cover">' + esc(slide.title) + "</div>" + (slide.body ? '<div class="s-body">' + esc(slide.body) + "</div>" : "") + "</div>";
  } else if (layout === "quote") {
    inner = '<div><div class="s-quote-mark" style="color:' + accent + '">&ldquo;</div><div class="s-quote">' + esc(slide.body || slide.title) + "</div>" + (slide.body && slide.title ? '<div class="s-body" style="opacity:.75">' + esc(slide.title) + "</div>" : "") + "</div>";
  } else if (layout === "list") {
    inner = '<div><div class="s-title">' + esc(slide.title) + '</div><ul class="s-list">' +
      lines.map((l) => '<li><i style="background:' + accent + '"></i>' + esc(l.replace(/^([-•*]|\d+[.)])\s*/, "")) + "</li>").join("") + "</ul></div>";
  } else {
    inner = "<div>" + (cta
      ? '<div class="s-cover">' + esc(slide.title) + "</div>"
      : '<div class="s-title" style="border-left:3px solid ' + accent + ';padding-left:9px">' + esc(slide.title) + "</div>") +
      '<div class="s-body">' + esc(slide.body) + "</div></div>";
  }
  return '<div class="slide" style="background:' + bg + ";color:" + ink + ";aspect-ratio:" + ratio + ";width:" + w + 'px">' + inner +
    '<div class="s-foot"><span>' + esc(profile ? profile.name : "") + "</span><span>" + (i + 1) + " / " + total + "</span></div></div>";
}

        o.choices.map((c) => chip(c, nf.options[o.key] === c, "nf-opt:" + o.key + ":" + c)).join("") + "</div></div>").join("") + "</div>";
  }

  html += '<div class="block"><div class="block-head"><span class="label">Stations</span><span class="hint">Draft and Edit always run. Turn the rest on or off for this piece.</span></div><div class="chips">' +
    availableStages(nf.format).map((s) => {
      const on = nf.stages.indexOf(s) >= 0;
      const locked = !STAGES[s].optional;
      return chip((on ? (nf.stages.indexOf(s) + 1) + ". " : "") + STAGES[s].label, on, "nf-stage:" + s, locked ? "chip-locked" : "");
    }).join("") + "</div></div>";

  html += '<div class="block"><div class="block-head"><span class="label">' + (needsTopic ? "Topic" : "Topic or starting point (optional)") + '</span><span class="hint">' +
    (pre && pre.sourceContent ? "Add a new angle for this version, or leave it blank." : nf.stages.indexOf("idea") >= 0 ? "Leave it blank and the ideas station starts from your content pillars." : "The writer starts from exactly this.") +
    '</span></div><textarea class="textarea" rows="3" data-bind="ui.nf.topic" placeholder="For example: why the cheapest quote usually costs more over a year">' + esc(nf.topic) + "</textarea>";
  if (webRelevant) {
    html += '<label class="check"><input type="checkbox" data-bind="ui.nf.webSearch"' + (nf.webSearch ? " checked" : "") + "><span>Let the ideas and research stations search the web</span></label>";
  }
  html += "</div>";

  html += '<div class="block"><div class="block-head"><span class="label">Supervision</span></div><div class="modes">' +
    [["step", "Approve at every station", "You see each output, edit or approve it, and only then does the next station start."],
     ["auto", "Run the whole line", "Stations run back to back. You review everything once at the end."]]
      .map((m) => '<button class="mode" aria-pressed="' + (nf.mode === m[0]) + '" data-act="nf-mode:' + m[0] + '"><b>' + m[1] + '</b><span class="hint">' + m[2] + "</span></button>").join("") +
    "</div></div>";

  html += '<div class="submit"><button class="btn btn-primary" data-act="nf-create">Start production</button>' +
    (nf.error ? '<span class="failure-text" role="alert" style="margin:0">' + esc(nf.error) + "</span>" : "") + "</div></section>";
  return html;
}

/* ---------- project ---------- */
function stageOutputHTML(p, stage, profile, anyRunning) {
  const o = p.outputs[stage] || {};
  const st = p.stageStatus[stage];
  const idx = p.stages.indexOf(stage);
  const isLast = idx === p.stages.length - 1;
  const readOnly = !!p.published;
  const laterHasOutput = p.stages.slice(idx + 1).some((s) => p.outputs[s]);
  const ideaPending = stage === "idea" && o.chosen == null;
  const canApprove = p.mode === "step" && st === "done" && !ideaPending;
  let html = "";

  if (o.truncated) html += '<p class="notice">This output hit the length ceiling and may be cut short. Regenerate it with feedback such as &ldquo;keep it shorter&rdquo;.</p>';

  if (stage === "idea" && o.ideas) {
    html += '<div class="ideas">' + o.ideas.map((i, k) =>
      '<button class="idea" aria-pressed="' + (o.chosen === k) + '"' + (readOnly || anyRunning ? " disabled" : "") + ' data-act="choose:' + k + '"><b>' + esc(i.title) + "</b>" +
      (i.angle ? "<span>Angle: " + esc(i.angle) + "</span>" : "") + (i.hook ? "<span>Hook: " + esc(i.hook) + "</span>" : "") + "</button>").join("") + "</div>";
  }
  if (o.slides) {
    const f = FORMATS[p.format];
    html += '<div class="slides">' + o.slides.map((s, i) => slideHTML(s, i, o.slides.length, profile, f.ratio)).join("") + "</div>" +
      '<p class="hint" style="margin:0">Previewed in the profile\'s colours. Screenshot each frame, or hand the copy to your designer.</p>';
    if (!readOnly) {
      html += "<details><summary>Edit slide copy and layout</summary>" + o.slides.map((s, i) =>
        '<div class="slide-edit"><div class="slide-edit-head"><span class="label">' + (i + 1) + '</span><select class="select" data-slide="' + i + '" data-slide-field="layout">' +
        LAYOUTS.map((l) => '<option value="' + l.key + '"' + ((s.layout || "point") === l.key ? " selected" : "") + ">" + l.label + "</option>").join("") + "</select></div>" +
        '<input class="input" value="' + esc(s.title) + '" data-slide="' + i + '" data-slide-field="title" aria-label="Slide headline">' +
        '<textarea class="textarea" rows="2" data-slide="' + i + '" data-slide-field="body" aria-label="Slide body">' + esc(s.body) + "</textarea></div>").join("") + "</details>";
    }
  }
  if (typeof o.text === "string") {
    const rows = Math.min(26, Math.max(8, (o.text.match(/\n/g) || []).length + 3));
    html += '<textarea class="textarea" rows="' + rows + '" data-stage-text="' + stage + '"' + (readOnly ? " readonly" : "") + ">" + esc(o.text) + "</textarea>";
  }
  if (stage === "edit" && o.notes) {
    html += '<div class="notes"><span class="label">What the editor changed</span><p>' + esc(o.notes) + "</p></div>";
  }

  html += '<div class="actions">';
  if (canApprove) html += '<button class="btn btn-primary"' + (anyRunning ? " disabled" : "") + ' data-act="approve:' + stage + '">' + (isLast ? "Approve and finish" : "Approve and continue") + "</button>";
  if (p.mode === "step" && st === "done" && ideaPending) html += '<span class="hint">Pick an angle to keep the line moving.</span>';
  if (!o.ideas) html += '<button class="btn btn-quiet" data-act="copy-stage:' + stage + '">Copy</button>';
  html += "</div>";

  if (!readOnly) {
    html += '<div class="actions"><div class="grow"><input class="input" id="fb-' + stage + '" placeholder="Feedback for the next version — sharper hook, fewer words, different example" aria-label="Feedback">' +
      '<button class="btn"' + (anyRunning ? " disabled" : "") + ' data-act="regen:' + stage + '">Regenerate</button></div></div>';
    if (laterHasOutput) html += '<p class="hint" style="margin:6px 0 0">Regenerating clears every station after this one.</p>';
    if (!isLast && (st === "approved" || p.mode === "auto") && laterHasOutput) {
      html += '<div class="actions" style="margin-top:8px"><button class="btn btn-quiet"' + (anyRunning || ideaPending ? " disabled" : "") + ' data-act="rerun:' + stage + '">Rebuild the stations after this one</button></div>';
    }
  }
  return html;
}

function analystHTML(p) {
  const m = p.metrics || {};

  let html = '<section class="panel"><h2>Analyst</h2><p class="sub">A few days after publishing, put the numbers in. The lessons get added to the brand profile, and the next piece starts from them.</p><div class="metrics">' +
    METRICS.map((x) => '<label class="field' + (x.wide ? " wide" : "") + '"><span class="label">' + esc(x.label) + "</span>" +
      (x.wide ? '<textarea class="textarea" rows="2" data-metric="' + x.key + '" placeholder="For example: most comments were about the third slide">' + esc(m[x.key] || "") + "</textarea>"
              : '<input class="input" inputmode="numeric" data-metric="' + x.key + '" value="' + esc(m[x.key] || "") + '">') + "</label>").join("") + "</div>" +

function viewProject() {
  const p = getP(state.view.id);
  if (!p) return '<div class="empty"><span>That piece is gone.</span><button class="btn" data-act="go:home">Back to the line</button></div>';
  const f = FORMATS[p.format];
  const profile = getB(p.businessId);
  const runningStage = p.stages.find((s) => p.stageStatus[s] === "running");
  let sel = state.ui.sel;
  if (runningStage) sel = runningStage;
  if (!sel || p.stages.indexOf(sel) < 0) sel = p.stages.find((s) => p.stageStatus[s] !== "approved") || p.stages[p.stages.length - 1];
  state.ui.sel = sel;

  const st = p.stageStatus[sel] || "pending";
  const idx = p.stages.indexOf(sel);
  const prevStatus = idx > 0 ? p.stageStatus[p.stages[idx - 1]] : "approved";
  const prevOk = prevStatus === "approved" || (p.mode === "auto" && prevStatus === "done");
  const anyRunning = !!runningStage;
  const allDone = p.stages.every((s) => ["done", "approved"].indexOf(p.stageStatus[s]) >= 0);
  const showFinalBanner = allDone && !p.finalApproved && !anyRunning && (p.mode === "auto" || p.stages.every((s) => p.stageStatus[s] === "approved"));
  const ps = projectStatus(p);

  let html = '<div class="head"><div><button class="back" data-act="go:home">Back to the line</button><h1>' + esc(p.title) + "</h1>" +
    '<p class="sub">' + esc((profile ? profile.name : "Deleted profile") + " · " + f.group + " " + f.label) + "</p></div>" + badge(ps.label, ps.cls) + "</div>";
  html += '<p class="coord"><b>Line manager</b><span>' + esc(coordinatorLine(p)) + "</span></p>";
  html += '<div class="line">' + p.stages.map((s, i) => {
    const stt = p.stageStatus[s] || "pending";
    return '<button class="station" data-state="' + stt + '"' + (sel === s ? ' aria-current="step"' : "") + ' data-act="sel:' + s + '">' +
      '<span class="st-num">' + (i + 1) + '</span><span class="st-label">' + esc(STAGES[s].label) + '</span><span class="st-status">' + STATUS_LABEL[stt] + "</span></button>";
  }).join("") + "</div>";

  html += '<div class="grid"><div class="main">';
  if (showFinalBanner) {
    html += '<div class="banner"><div><b>Every station has run.</b><div class="hint">Open each one from the line above, read it, then sign it off.</div></div>' +
      '<button class="btn btn-primary" data-act="final">Approve the piece</button></div>';
  }
  html += '<section class="panel"><div class="stage-head"><div><h2>' + esc(STAGES[sel].label) + '</h2><p class="hint" style="margin:0">' + esc(STAGES[sel].desc) + "</p></div>" +
    badge(STATUS_LABEL[st], st === "approved" ? "badge-go" : st === "error" ? "badge-stop" : (st === "done" || st === "running") ? "badge-wait" : "") + "</div>";

  if (st === "pending") {
    html += prevOk && !anyRunning
      ? '<div class="actions" style="margin-top:0"><span class="sub">This station has not run yet.</span><button class="btn btn-primary" data-act="run:' + sel + '">Run this station</button></div>'
      : '<p class="running">' + (anyRunning ? "Another station is working; this one is queued." : "This station runs once the one before it is approved.") + "</p>";
  } else if (st === "running") {
    html += '<p class="running">' + esc(STAGES[sel].label) + " is working. This usually takes under a minute.</p>";
  } else if (st === "error") {
    html += '<div class="failure"><p>' + esc((p.errors && p.errors[sel]) || "The run failed.") + '</p><button class="btn"' + (anyRunning ? " disabled" : "") + ' data-act="run:' + sel + '">Run it again</button></div>';
  } else {
    html += stageOutputHTML(p, sel, profile, anyRunning);
  }
  html += "</section>";
  if (p.finalApproved) html += finalBoxHTML(p);
  if (p.published) html += analystHTML(p);
  html += "</div>";

  html += '<aside class="panel aside"><dl class="dl"><dt>Business</dt><dd>' + esc(profile ? profile.name : "Deleted") + "</dd>" +
    "<dt>Format</dt><dd>" + esc(f.group + " " + f.label) + "</dd>" +
    f.options.map((o) => "<dt>" + esc(o.label) + "</dt><dd>" + esc(p.options[o.key]) + "</dd>").join("") +
    "<dt>Supervision</dt><dd>" + (p.mode === "auto" ? "Whole line, one review" : "Approve every station") + "</dd>" +
    "<dt>Web search</dt><dd>" + (p.webSearch ? "On" : "Off") + "</dd>" +
    (p.topic ? "<dt>Topic</dt><dd>" + esc(p.topic) + "</dd>" : "") +
    (p.sourceTitle ? "<dt>Reworked from</dt><dd>" + esc(p.sourceTitle) + "</dd>" : "") +
    "<dt>Started</dt><dd>" + fmtDate(p.createdAt) + "</dd></dl>" +
    (state.ui.confirmDel
      ? '<div class="actions" style="margin-top:0"><button class="btn btn-danger" data-act="delete">Delete for good</button><button class="btn btn-quiet" data-act="cancel-del">Keep it</button></div>'
      : '<button class="btn btn-quiet" style="padding-left:0" data-act="confirm-del">Delete this piece</button>') + "</aside></div>";
  return html;
}

async function draftProfile() {
  const desc = (state.ui.peDesc || "").trim();
  if (!desc) { state.ui.peError = "Write a couple of sentences about the business first."; render(); return; }
  state.ui.peError = ""; state.ui.peDrafting = true; render();
  try {
    let j;
    if (state.settings.mode === "demo") {
      await sleep(900);
      const name = state.ui.pe.name || firstClause(desc, 32) || "The business";
      j = {
        industry: firstClause(desc, 70),
        audience: "Decision-makers who are judged on budget and on complaints, and who buy this reluctantly rather than enthusiastically.",
        offering: "The core service described above, sold on contract rather than per job, with a clear entry price.",
        pillars: "Cost of ownership; how the work is actually done; seasonal or cyclical planning; proof from real jobs.",
        voice: "Plain and specific. Short sentences. Numbers rather than adjectives. Never breathless.",
        dos: "Use real jobs and real figures. Answer the awkward question before it is asked.",
        donts: "Never name a competitor. Never quote an industry statistic without a source and a date. No stock-photo language.",
        goals: "Turn quiet readers into a conversation: a site visit, a quote review, a reply.",
      };
      j.name = name;
    } else {
      const prompt = BASE + "\n\nYour station: brand strategy.\nTurn the description below into a precise, usable brand profile" +
        (state.ui.pe.name ? ' for "' + state.ui.pe.name + '"' : "") + ".\nDescription:\n" + desc +
        '\n\nReturn only a valid JSON object, nothing else:\n{"name":"","industry":"","audience":"","offering":"","pillars":"","voice":"","dos":"","donts":"","goals":""}\nEach field 40 words maximum.';
      const r = await callModel(prompt, false);
      j = extractJSON(r.text, r.truncated);
    }
    ["name", "industry", "audience", "offering", "pillars", "voice", "dos", "donts", "goals"].forEach((k) => {
      if (k === "name" && (state.ui.pe.name || "").trim()) return;
      if (typeof j[k] === "string" && j[k].trim()) state.ui.pe[k] = j[k].trim();
    });
  } catch (e) {
    state.ui.peError = e.message;
  }
  state.ui.peDrafting = false; render();
}

function go(name, opts) {
  const keep = opts && opts.keepPrefill;
  state.view = { name: name, id: opts && opts.id };
  state.ui.confirmDel = false;
  state.ui.confirmDelB = false;
  if (!keep) { state.ui.nf = null; state.ui.prefill = null; }
  if (name !== "profiles") { state.ui.editing = null; state.ui.peError = ""; }
  window.scrollTo(0, 0);
  render();
}

function setPath(path, value) {
  const parts = path.split(".");
  let o = state;
  for (let i = 0; i < parts.length - 1; i++) { if (!o[parts[i]]) o[parts[i]] = {}; o = o[parts[i]]; }
  o[parts[parts.length - 1]] = value;
}

let flashTimer = null;
function flash(msg) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => t.classList.remove("on"), 2200);
}

/* ---------- actions ---------- */
async function handle(act, el) {
  const parts = act.split(":");
  const cmd = parts[0], arg = parts[1], arg2 = parts.slice(2).join(":");
  const p = state.view.name === "project" ? getP(state.view.id) : null;

  if (cmd === "go") { go(arg); return; }
  if (cmd === "open") { state.ui.sel = null; go("project", { id: arg }); return; }
  if (["sel","run","approve","choose","regen","rerun","copy-stage","copy-final","copy-kit","final","reopen","published","confirm-del","cancel-del","delete","repurpose","analyze","add-learning"].indexOf(cmd) >= 0 && !p) return;
  if (cmd === "tab") { state.ui.homeTab = arg; render(); return; }

  /* new piece */
  if (cmd === "nf-business") { newForm().businessId = arg; render(); return; }
  if (cmd === "nf-format") {
    const nf = newForm();
    nf.format = arg; nf.options = defaultOptions(arg);
    nf.stages = defaultStages(arg, !!(state.ui.prefill && state.ui.prefill.sourceContent));
    render(); return;
  }
  if (cmd === "nf-opt") { newForm().options[arg] = arg2; render(); return; }
  if (cmd === "nf-stage") {
    const nf = newForm();
    if (!STAGES[arg].optional) return;
    nf.stages = nf.stages.indexOf(arg) >= 0 ? nf.stages.filter((s) => s !== arg) : STAGE_ORDER.filter((s) => s === arg || nf.stages.indexOf(s) >= 0);
    render(); return;
  }
  if (cmd === "nf-mode") { newForm().mode = arg; render(); return; }
  if (cmd === "nf-create") {
    const nf = newForm();
    const pre = state.ui.prefill;
    const hasSource = !!(pre && pre.sourceContent);
    if (!nf.businessId) { nf.error = "Pick a business first."; render(); return; }
    if (nf.stages.indexOf("idea") < 0 && !hasSource && !nf.topic.trim()) {
      nf.error = "The ideas station is off, so the writer needs a topic to start from."; render(); return;
    }
    const now = Date.now();
    const proj = {
      id: uid(), createdAt: now, updatedAt: now,
      businessId: nf.businessId, format: nf.format, options: Object.assign({}, nf.options),
      stages: nf.stages.slice(), mode: nf.mode, topic: nf.topic.trim(),
      webSearch: nf.webSearch && (nf.stages.indexOf("idea") >= 0 || nf.stages.indexOf("research") >= 0),
      sourceContent: hasSource ? pre.sourceContent : "", sourceTitle: hasSource ? pre.sourceTitle : "",
      title: hasSource ? pre.sourceTitle + " — " + FORMATS[nf.format].label : (nf.topic.trim() ? nf.topic.trim().slice(0, 70) : "Untitled " + FORMATS[nf.format].label.toLowerCase()),
      outputs: {}, stageStatus: Object.fromEntries(nf.stages.map((s) => [s, "pending"])), errors: {},
      finalApproved: false, published: false,
    };
    state.projects.unshift(proj);
    persist();
    state.ui.nf = null; state.ui.prefill = null; state.ui.sel = null;
    go("project", { id: proj.id });
    if (proj.mode === "auto") runAuto(proj.id, 0); else runStage(proj.id, proj.stages[0]);
    return;
  }

  /* project */
  if (cmd === "sel") { state.ui.sel = arg; render(); return; }
  if (cmd === "run") { runStage(p.id, arg); return; }
  if (cmd === "approve") {
    p.stageStatus[arg] = "approved";
    if (p.stages.every((s) => p.stageStatus[s] === "approved")) { p.finalApproved = true; touch(p); render(); return; }
    const next = p.stages[p.stages.indexOf(arg) + 1];
    touch(p); render();
    if (next && ["pending", "error"].indexOf(p.stageStatus[next]) >= 0) { state.ui.sel = next; runStage(p.id, next); }
    return;
  }
  if (cmd === "choose") {
    const i = parseInt(arg, 10);
    p.outputs.idea.chosen = i;
    if (p.outputs.idea.ideas[i] && p.outputs.idea.ideas[i].title) p.title = p.outputs.idea.ideas[i].title;
    touch(p); render(); return;
  }
  if (cmd === "regen") {
    const input = document.getElementById("fb-" + arg);
    const fb = input ? input.value : "";
    resetAfter(p, arg);
    touch(p);
    const ok = await runStage(p.id, arg, fb);
    if (ok && p.mode === "auto") runAuto(p.id, p.stages.indexOf(arg) + 1);
    return;
  }
  if (cmd === "rerun") {
    const i = p.stages.indexOf(arg);
    resetAfter(p, arg);
    if (p.mode === "step") p.stageStatus[arg] = "approved";
    touch(p); render();
    if (p.mode === "auto") runAuto(p.id, i + 1);
    else if (p.stages[i + 1]) { state.ui.sel = p.stages[i + 1]; runStage(p.id, p.stages[i + 1]); }
    return;
  }
  if (cmd === "copy-stage") { flash((await copyText(outputAsText(p, arg))) ? "Copied." : "Copy failed — select the text instead."); return; }
  if (cmd === "copy-final") { flash((await copyText(finalText(p))) ? "Copied." : "Copy failed — select the text instead."); return; }
  if (cmd === "copy-kit") { flash((await copyText((p.outputs.publish && p.outputs.publish.text) || "")) ? "Copied." : "Copy failed — select the text instead."); return; }
  if (cmd === "final") { p.stages.forEach((s) => { if (p.stageStatus[s] === "done") p.stageStatus[s] = "approved"; }); p.finalApproved = true; touch(p); render(); return; }
  if (cmd === "reopen") { p.finalApproved = false; touch(p); render(); return; }
  if (cmd === "published") { p.published = true; p.publishedAt = Date.now(); touch(p); render(); return; }
  if (cmd === "confirm-del") { state.ui.confirmDel = true; render(); return; }
  if (cmd === "cancel-del") { state.ui.confirmDel = false; render(); return; }
  if (cmd === "delete") { state.projects = state.projects.filter((x) => x.id !== p.id); persist(); go("home"); return; }
  if (cmd === "repurpose") {
    const target = state.ui.repurpose;
    if (!target) return;
    state.ui.nf = null;
    state.ui.prefill = { businessId: p.businessId, format: target, sourceContent: finalText(p), sourceTitle: p.title };
    go("new", { keepPrefill: true });
    return;
  }
  if (cmd === "analyze") {
    p.analysisStatus = "running"; p.analysisError = null; touch(p); render();
    try {
      let text, lessons;
      if (state.settings.mode === "demo") {
        await sleep(1000);
        const d = demoAnalysis(p, getB(p.businessId) || {}, p.metrics || {});
        text = d.text; lessons = d.learnings;
      } else {
        const profile = getB(p.businessId);
        const m = p.metrics || {};
        const stats = METRICS.filter((x) => m[x.key] && String(m[x.key]).trim()).map((x) => x.label + ": " + m[x.key]).join("\n");
        const prompt = [BASE, profile ? profileBlock(profile) : "", formatBlock(p),
          "What was published:\n" + finalText(p).slice(0, 1500),
          "Results:\n" + (stats || "No numbers entered"),
          'Your station: analyst.\nSay what worked and what did not, given the format, the audience and the numbers. If the data is thin, say so plainly.\n200 words maximum. Then a line containing only "---LESSONS---" and under it at most three short, usable lessons for the next piece.',
        ].filter(Boolean).join("\n\n");
        const r = await callModel(prompt, false);
        const sp = splitMarker(r.text, LEARN_RE);
        text = sp[0]; lessons = sp[1];
      }
      p.analysis = text; p.learnings = lessons; p.learningAdded = false; p.analysisStatus = "done";
    } catch (e) {
      p.analysisStatus = "error"; p.analysisError = e.message;
    }
    touch(p); render(); return;
  }
  if (cmd === "add-learning") {
    const b = getB(p.businessId);
    if (!b || !p.learnings) return;
    const entry = FORMATS[p.format].label + " — " + p.title + ":\n" + p.learnings.trim();
    b.learnings = (b.learnings ? b.learnings + "\n\n" : "") + entry;
    p.learningAdded = true;
    touch(p); render(); return;
  }

  /* profiles */
  if (cmd === "p-new") {
    state.ui.editing = "new";
    state.ui.pe = { id: uid(), name: "", industry: "", audience: "", offering: "", pillars: "", voice: "", dos: "", donts: "", goals: "", learnings: "", colors: Object.assign({}, DEFAULT_COLORS) };
    state.ui.peDesc = ""; state.ui.peError = "";
    render(); return;
  }
  if (cmd === "p-edit") {
    const b = getB(arg);
    if (!b) return;
    state.ui.editing = b.id;
    state.ui.pe = JSON.parse(JSON.stringify(Object.assign({ learnings: "" }, b, { colors: Object.assign({}, DEFAULT_COLORS, b.colors || {}) })));
    state.ui.peDesc = ""; state.ui.peError = ""; state.ui.confirmDelB = false;
    render(); return;
  }
  if (cmd === "p-cancel") { state.ui.editing = null; state.ui.peError = ""; render(); return; }
  if (cmd === "p-save") {
    const pe = state.ui.pe;
    if (!(pe.name || "").trim()) { state.ui.peError = "The profile needs a business name."; render(); return; }
    pe.name = pe.name.trim();
    const existing = getB(pe.id);
    if (existing) Object.assign(existing, pe);
    else state.businesses.push(JSON.parse(JSON.stringify(pe)));
    persist();
    state.ui.editing = null; state.ui.peError = "";
    render(); return;
  }
  if (cmd === "p-confirm-del") { state.ui.confirmDelB = true; render(); return; }
  if (cmd === "p-delete") {
    state.businesses = state.businesses.filter((b) => b.id !== state.ui.pe.id);
    persist();
    state.ui.editing = null; state.ui.confirmDelB = false;
    render(); return;
  }
  if (cmd === "p-draft") { draftProfile(); return; }

  /* settings */
  if (cmd === "s-mode") { state.settings.mode = arg; persist(); render(); return; }
  if (cmd === "s-save") { persist(); state.ui.settingsSaved = true; render(); await sleep(2000); state.ui.settingsSaved = false; render(); return; }
  if (cmd === "s-reset") {
    localStorage.removeItem(LS_KEY);
    state.businesses = []; state.projects = [];
    seed(); persist(); go("home"); return;
  }
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.hasAttribute("disabled") || el.getAttribute("aria-disabled") === "true") return;
  e.preventDefault();
  handle(el.getAttribute("data-act"), el);
});

document.addEventListener("input", (e) => {
  const el = e.target;
  const path = el.getAttribute && el.getAttribute("data-bind");
  if (!path) return;
  setPath(path, el.type === "checkbox" ? el.checked : el.value);
  if (path.indexOf("settings.") === 0) persist();
  if (el.getAttribute("data-rerender")) render();
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.getAttribute && el.getAttribute("data-bind")) {
    setPath(el.getAttribute("data-bind"), el.type === "checkbox" ? el.checked : el.value);
    if (el.getAttribute("data-rerender")) render();
    return;
  }
  const p = state.view.name === "project" ? getP(state.view.id) : null;
  if (!p) return;
  const stage = el.getAttribute && el.getAttribute("data-stage-text");
  if (stage && p.outputs[stage]) { p.outputs[stage].text = el.value; touch(p); return; }
  const si = el.getAttribute && el.getAttribute("data-slide");
  if (si !== null && si !== undefined && si !== "") {
    const stageKey = p.stages.find((s) => p.outputs[s] && p.outputs[s].slides);
    if (stageKey) {
      const fieldName = el.getAttribute("data-slide-field");
      p.outputs[stageKey].slides[parseInt(si, 10)][fieldName] = el.value;
      touch(p);
      if (fieldName === "layout") render();
    }
    return;
  }
  const mk = el.getAttribute && el.getAttribute("data-metric");
  if (mk) { p.metrics = Object.assign({}, p.metrics); p.metrics[mk] = el.value; touch(p); }
});

/* ---------- sample data ---------- */
function seed() {
  const grounds = {
    id: uid(), name: "Harbour & Field", industry: "Commercial grounds maintenance for business parks and schools",
    audience: "Facilities managers who are judged on budget and on complaints, and who inherited the contract from someone else.",
    offering: "Contracted grounds maintenance, seasonal planting and winter gritting, from £2,000 a month.",
    pillars: "What a grounds contract really costs; seasonal planning; safety and compliance; before-and-after from real sites.",
    voice: "Plain and specific. Short sentences, real numbers, no marketing gloss.",
    dos: "Use real jobs and real figures. Answer the awkward question before it is asked.",
    donts: "Never name a competitor. Never quote an industry statistic without a source and a date.",
    goals: "Get facilities managers to ask for a site visit or a second opinion on a quote.",
    learnings: "", colors: { bg: "#FFFFFF", ink: "#1C3327", accent: "#4B7A4E" },
  };
  const payroll = {
    id: uid(), name: "Lumen Payroll", industry: "Payroll and pensions software for companies of 20 to 200 people",
    audience: "Finance leads and office managers who run payroll alongside four other jobs and dread the last three days of the month.",
    offering: "Payroll software with managed pension filing, priced per employee per month.",
    pillars: "Month-end without the panic; compliance changes explained in plain English; switching providers; what payroll errors actually cost.",
    voice: "Calm and precise. Never alarmist about compliance. Explain the rule, then the action.",
    dos: "Show the actual screen or the actual form. Date every rule you mention.",
    donts: "Never scare people into buying. No jargon without a plain-English gloss in the same sentence.",
    goals: "Get finance leads to book a switching call before their next renewal date.",
    learnings: "", colors: { bg: "#FFFFFF", ink: "#111C2E", accent: "#2F5DA8" },
  };
  state.businesses = [grounds, payroll];

  const now = Date.now();
  const demoProject = {
    id: uid(), createdAt: now - 86400000, updatedAt: now - 3600000,
    businessId: grounds.id, format: "li_post", options: { length: "Medium", approach: "First-person story" },
    stages: ["idea", "research", "write", "edit", "publish"], mode: "step",
    topic: "what a grounds contract really costs",
    webSearch: true, sourceContent: "", sourceTitle: "",
    title: "", outputs: {}, stageStatus: {}, errors: {}, finalApproved: false, published: false,
  };
  const ideas = demoIdeas(demoProject, grounds);
  demoProject.outputs.idea = Object.assign({}, ideas, { chosen: 0 });
  demoProject.title = ideas.ideas[0].title;
  demoProject.outputs.research = demoResearch(demoProject, grounds);
  demoProject.outputs.write = demoWrite(demoProject, grounds);
  demoProject.outputs.edit = demoEdit(demoProject, grounds);
  demoProject.stageStatus = { idea: "approved", research: "approved", write: "approved", edit: "done", publish: "pending" };
  state.projects = [demoProject];
}

/* ---------- boot ---------- */
if (!restore() || (!state.businesses.length && !state.projects.length)) { seed(); persist(); }
render();

</script>
