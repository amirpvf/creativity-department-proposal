<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Personal Intelligence — Proposal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap"><style>*{box-sizing:border-box}body{margin:0;background:#0f1218;font-family:Vazirmatn,Tahoma,sans-serif;color:#e8e6e1}
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:8px;padding:10px;background:rgba(15,18,24,.92);backdrop-filter:blur(8px);border-bottom:1px solid #222a36}
.bar button{font:inherit;font-size:14px;font-weight:600;border:1px solid #2f3a4a;background:transparent;color:#c9d2de;border-radius:999px;padding:6px 18px;cursor:pointer}
.bar button.on{background:#e8a33d;border-color:#e8a33d;color:#14110c}
.pages{max-width:880px;margin:0 auto;padding:18px 12px 40px;display:flex;flex-direction:column;gap:14px}
.pages img{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 14px 40px -20px #000}
[hidden]{display:none!important}</style></head><body>
<div class="bar"><button type="button" data-l="en" class="on">English</button><button type="button" data-l="fa">فارسی</button></div>
<div class="pages" id="en"><img src="../docs/pi-en-01.jpg" alt="Page 1" loading="eager"><img src="../docs/pi-en-02.jpg" alt="Page 2" loading="eager"><img src="../docs/pi-en-03.jpg" alt="Page 3" loading="lazy"><img src="../docs/pi-en-04.jpg" alt="Page 4" loading="lazy"><img src="../docs/pi-en-05.jpg" alt="Page 5" loading="lazy"><img src="../docs/pi-en-06.jpg" alt="Page 6" loading="lazy"><img src="../docs/pi-en-07.jpg" alt="Page 7" loading="lazy"><img src="../docs/pi-en-08.jpg" alt="Page 8" loading="lazy"><img src="../docs/pi-en-09.jpg" alt="Page 9" loading="lazy"><img src="../docs/pi-en-10.jpg" alt="Page 10" loading="lazy"><img src="../docs/pi-en-11.jpg" alt="Page 11" loading="lazy"><img src="../docs/pi-en-12.jpg" alt="Page 12" loading="lazy"><img src="../docs/pi-en-13.jpg" alt="Page 13" loading="lazy"></div><div class="pages" id="fa" hidden><img src="../docs/pi-fa-01.jpg" alt="صفحهٔ 1" loading="lazy"><img src="../docs/pi-fa-02.jpg" alt="صفحهٔ 2" loading="lazy"><img src="../docs/pi-fa-03.jpg" alt="صفحهٔ 3" loading="lazy"><img src="../docs/pi-fa-04.jpg" alt="صفحهٔ 4" loading="lazy"><img src="../docs/pi-fa-05.jpg" alt="صفحهٔ 5" loading="lazy"><img src="../docs/pi-fa-06.jpg" alt="صفحهٔ 6" loading="lazy"><img src="../docs/pi-fa-07.jpg" alt="صفحهٔ 7" loading="lazy"><img src="../docs/pi-fa-08.jpg" alt="صفحهٔ 8" loading="lazy"><img src="../docs/pi-fa-09.jpg" alt="صفحهٔ 9" loading="lazy"><img src="../docs/pi-fa-10.jpg" alt="صفحهٔ 10" loading="lazy"><img src="../docs/pi-fa-11.jpg" alt="صفحهٔ 11" loading="lazy"><img src="../docs/pi-fa-12.jpg" alt="صفحهٔ 12" loading="lazy"><img src="../docs/pi-fa-13.jpg" alt="صفحهٔ 13" loading="lazy"></div>
<script>document.querySelector('.bar').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;document.querySelectorAll('.bar button').forEach(function(x){x.classList.toggle('on',x===b)});document.getElementById('en').hidden=b.dataset.l!=='en';document.getElementById('fa').hidden=b.dataset.l!=='fa';window.scrollTo(0,0);});</script></body></html>
