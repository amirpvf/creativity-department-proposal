<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A single-page order and pricing panel for bakeries and cake makers: recipe-based pricing, decoration costing, deposits, customers and a delivery calendar.">
<title>Bakery Order &amp; Pricing Panel — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --icing:#F4F6FA;
  --sugar:#FFFFFF;
  --blush:#E8EEF6;
  --blush-deep:#C9D6E6;
  --raspberry:#1B4B82;
  --raspberry-soft:#3D74AC;
  --plum:#16202E;
  --cocoa:#5E7188;
  --line:#DDE4ED;
  --pistachio:#3C7D5B;
  --caramel:#B98524;
  --lav:#6C7A9C;
  --box:#7590AC;
  --shadow:0 6px 20px rgba(22,32,46,.08);
  --shadow-sm:0 2px 8px rgba(22,32,46,.06);
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  background:var(--icing);
  color:var(--plum);
  font-size:15px;
  line-height:1.75;
  min-height:100vh;
  padding:0 0 104px;
}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2.5px solid var(--raspberry);outline-offset:2px;border-radius:8px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 4px 16px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:44px;height:44px;filter:drop-shadow(0 6px 10px rgba(27,107,201,.22))}
.brand{font-family:'IBM Plex Serif',Georgia,serif;font-weight:700;font-size:24px;letter-spacing:-.2px;line-height:1.1}
.brand{color:var(--raspberry)}
.brand span{color:var(--cocoa);font-weight:600}
.brand small{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:10.5px;font-weight:600;color:var(--cocoa);letter-spacing:1.6px;margin-top:5px}
.demo-badge{align-self:center;background:var(--blush);color:var(--raspberry);border:1px solid var(--blush-deep);border-radius:3px;padding:3px 9px;font-size:10.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;cursor:help}
.today{margin-inline-start:auto;text-align:end;font-size:12.5px;color:var(--cocoa);line-height:1.6}
.today b{display:block;color:var(--plum);font-size:14.5px;font-weight:700}
.saved{display:inline-flex;align-items:center;gap:6px;background:#EAF6E2;color:#41682A;border-radius:4px;padding:4px 12px;font-size:12px;font-weight:600;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--sugar);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow-sm);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 15px;border-radius:4px;font-weight:500;font-size:13.5px;color:var(--cocoa);transition:.15s}
.tab:hover{background:var(--icing);color:var(--raspberry)}
.tab.on{background:var(--raspberry);color:#fff;box-shadow:none}

/* cards */
.card{background:var(--sugar);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);margin-top:16px}
.card h2{margin:0 0 4px;font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;font-weight:600;letter-spacing:-.1px}
.card p.hint{margin:0 0 14px;color:var(--cocoa);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--cocoa);margin-bottom:5px}
input[type=text],input[type=tel],input[type=number],input[type=time],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:#F8FBFF;transition:.15s
}
input:focus,select:focus,textarea:focus{border-color:var(--raspberry-soft);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(90,155,230,.15)}
textarea{resize:vertical;min-height:64px}
.fldhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--cocoa);margin-bottom:5px}
.steps{display:flex;gap:8px;margin-top:16px}
.step{flex:1;display:flex;align-items:center;gap:9px;padding:11px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--sugar);font-weight:700;font-size:13.5px;color:var(--cocoa);transition:.16s;text-align:start}
.step:hover{border-color:var(--blush-deep)}
.step.on{border-color:var(--raspberry);background:#fff;color:var(--plum);box-shadow:inset 0 -2px 0 var(--raspberry)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--blush);color:var(--raspberry);display:grid;place-items:center;font-size:12.5px;flex:none}
.step.on .n{background:var(--raspberry);color:#fff}
.step.done .n{background:#EAF6E2;color:#41682A}
.step small{display:block;font-weight:500;font-size:11px;opacity:.75;margin-top:1px}
@media(max-width:720px){.steps{flex-direction:column;gap:6px}.step small{display:none}}
.mini-summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:5px;background:var(--blush);border:1px solid var(--blush-deep);margin-top:14px;font-size:13px}
.mini-summary b{color:var(--raspberry)}
.optbox{margin-top:14px;border:1.5px dashed var(--line);border-radius:6px;padding:12px}
.optbox.on{border-style:solid;border-color:var(--blush-deep);background:#F8FBFF}
.ihelp{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
 background:var(--blush);color:var(--raspberry);font-size:11px;font-weight:800;margin-inline-start:6px;
 cursor:help;position:relative;flex:none;font-family:inherit;border:none;vertical-align:middle}
.ihelp:hover,.ihelp:focus-visible{background:var(--raspberry);color:#fff}
.ihelp .tip{display:none;position:absolute;z-index:70;bottom:calc(100% + 8px);inset-inline-start:50%;
 transform:translateX(-50%);width:250px;max-width:70vw;background:var(--plum);color:#fff;font-weight:500;
 font-size:12.5px;line-height:1.75;padding:9px 12px;border-radius:6px;box-shadow:0 10px 28px rgba(15,39,66,.3);
 text-align:start;cursor:default;pointer-events:none}
.ihelp .tip:after{content:'';position:absolute;top:100%;inset-inline-start:50%;transform:translateX(-50%);
 border:6px solid transparent;border-top-color:var(--plum)}
.ihelp:hover .tip,.ihelp:focus-visible .tip{display:block}
h2 .ihelp{vertical-align:2px}
.faq{border:1.5px solid var(--line);border-radius:6px;margin-top:10px;overflow:hidden;background:#FAFCFF}
.faq>summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.faq>summary::-webkit-details-marker{display:none}
.faq>summary:before{content:'▾';color:var(--raspberry);font-size:12px;transition:.15s}
.faq[open]>summary:before{transform:rotate(180deg)}
.faq>summary:hover{background:var(--icing)}
.faq .inner{padding:0 16px 14px;font-size:13.5px;line-height:1.95;color:var(--plum)}
.faq .inner p{margin:0 0 8px}
.faq .inner ol,.faq .inner ul{margin:0 0 8px;padding-inline-start:20px}
.faq .inner li{margin-bottom:5px}
.faq .inner b{color:var(--raspberry)}
.kbd{display:inline-block;background:var(--blush);color:var(--raspberry);border-radius:4px;padding:1px 7px;font-size:12px;font-weight:700}
.navrow{display:flex;gap:10px;margin-top:16px}
.locked{border:1px solid var(--blush-deep);background:#FAFCFF}
.locked h2{color:var(--raspberry)}
.lineno{width:24px;height:24px;border-radius:50%;background:var(--raspberry);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.tstar{margin-inline-start:7px;font-size:12px;opacity:.7;cursor:pointer}
.tstar.on{color:var(--caramel);opacity:1}
.tab.on .tstar{color:#fff}
.tab.on .tstar.on{color:#FFE08A}
.dd{position:relative}
.dd-btn{width:100%;text-align:start;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:#F8FBFF;font-weight:600;display:flex;align-items:center;gap:8px}
.dd-btn i{margin-inline-start:auto;font-style:normal;color:var(--cocoa);font-size:11px}
.dd.open .dd-btn{border-color:var(--raspberry-soft);box-shadow:0 0 0 3px rgba(90,155,230,.15)}
.dd-list{display:none;position:absolute;z-index:60;top:calc(100% + 4px);inset-inline:0;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);max-height:280px;overflow:auto;padding:6px}
.dd.open .dd-list{display:block}
.dd-row{display:flex;align-items:center;border-radius:5px}
.dd-row:hover{background:var(--icing)}
.dd-row.on{background:var(--blush)}
.dd-opt{flex:1;text-align:start;padding:8px;font-size:14px}
.dd-star{width:30px;padding:7px 0;font-size:15px;color:#B4C6DC;line-height:1}
.dd-star.on{color:var(--caramel)}
.dd-star.ph{display:inline-block}
.starbtn{background:none;border:none;color:var(--raspberry);font-size:16px;line-height:1;padding:0 4px;cursor:pointer}
.starbtn.off{color:#B4C6DC}
.starbtn:hover{color:var(--caramel)}
.mini-sw{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--raspberry);white-space:nowrap}
.mini-sw input{width:15px;height:15px;accent-color:var(--raspberry);cursor:pointer}
.mini-sw.off{color:var(--cocoa)}
.fld.offbox input{opacity:.5}
.sw{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1.5px solid var(--line);border-radius:6px;background:#F8FBFF;cursor:pointer;font-weight:600;font-size:13.5px}
.sw input{width:18px;height:18px;accent-color:var(--raspberry);cursor:pointer}
.sw.off{color:var(--cocoa);background:#F4F9FF}
.dayhead{display:flex;align-items:center;gap:10px;margin:16px 0 8px;font-weight:800;font-size:13.5px;color:var(--raspberry)}
.dayhead:after{content:'';flex:1;height:1px;background:var(--line)}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.stat{border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;background:#FAFCFF}
.stat b{display:block;font-size:16px;color:var(--raspberry)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.moneyin{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.btn{background:var(--raspberry);color:#fff;padding:10px 18px;border-radius:5px;font-weight:600;box-shadow:none;transition:.15s}
.btn:hover{background:#163F6E}
.btn:active{background:#12355D}
.btn.ghost{background:#fff;color:var(--raspberry);border:1px solid var(--blush-deep);box-shadow:none}
.btn.ghost:hover{background:var(--blush)}
.btn.mini{padding:6px 12px;font-size:12.5px;border-radius:5px;box-shadow:none}
.btn.danger{background:#fff;color:#C0392B;border:1.5px solid var(--line);box-shadow:none}
.btn.danger:hover{background:#EBF3FF}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{margin-inline-start:auto}
.chip{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11.5px;font-weight:700}
.chip.new{background:var(--blush);color:var(--raspberry)}
.chip.baking{background:#FDF0DC;color:#9A6516}
.chip.done{background:#EAF6E2;color:#41682A}
.divider{height:1px;background:var(--line);margin:14px 0}

/* cake-layer cost bar (signature) */
.slice{margin-top:12px}
.slice-bar{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1.5px solid var(--line);background:#fff}
.slice-bar i{display:block;height:100%}
.slice-key{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:12px;color:var(--cocoa)}
.slice-key span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}

/* lists */
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item{border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;background:#FAFCFF}
.item.hi{border-color:var(--blush-deep);background:#F1F7FF}
.item b.name{font-size:15px}
.muted{color:var(--cocoa);font-size:12.5px}
.price{font-weight:800;color:var(--raspberry);font-size:15px}
.empty{text-align:center;color:var(--cocoa);padding:26px 10px;font-size:13.5px}
.empty .cake{font-size:20px;display:block;margin-bottom:6px;color:var(--blush-deep)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px}
.cal-title{font-weight:800;font-size:16px;min-width:170px;text-align:center}
.nav{width:34px;height:34px;border-radius:50%;background:var(--blush);color:var(--raspberry);font-weight:800;display:grid;place-items:center}
.nav:hover{background:var(--blush-deep)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:11.5px;font-weight:700;color:var(--cocoa);padding-bottom:4px}
.day{position:relative;aspect-ratio:1;border-radius:6px;border:1.5px solid transparent;background:#F7FAFF;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;transition:.15s;min-height:42px}
.day:hover{border-color:var(--blush-deep)}
.day.off{color:#B9C8DA;background:transparent}
.day.fri{color:var(--raspberry-soft)}
.day.today{border-color:var(--raspberry);color:var(--raspberry);font-weight:800}
.day.sel{background:var(--raspberry);color:#fff;border-color:var(--raspberry)}
.day .g{font-size:9px;font-weight:500;opacity:.6;line-height:1}
.day .pips{position:absolute;bottom:5px;display:flex;gap:2px}
.day .pips i{width:5px;height:5px;border-radius:50%;background:var(--raspberry-soft)}
.day.sel .pips i{background:#fff}

/* picker popover */
.pick{position:relative}
.pop{position:absolute;z-index:40;top:calc(100% + 6px);inset-inline-start:0;background:var(--sugar);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:14px;width:320px;max-width:92vw;display:none}
.pop.on{display:block}
.date-btn{width:100%;text-align:start;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:#F8FBFF;font-weight:600}
.date-btn .g2{color:var(--cocoa);font-weight:500;font-size:12px}

/* toast */
#toast{position:fixed;bottom:96px;inset-inline-start:50%;transform:translateX(-50%) translateY(20px);background:var(--plum);color:#fff;padding:11px 20px;border-radius:4px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.savebar{position:fixed;bottom:0;inset-inline:0;z-index:80;display:flex;justify-content:center;
 padding:16px 12px 20px;pointer-events:none;
 background:linear-gradient(to top,rgba(242,247,255,.97) 45%,rgba(242,247,255,0))}
.saveall{pointer-events:auto;display:inline-flex;align-items:center;gap:9px;padding:13px 30px;border-radius:4px;
 font-weight:800;font-size:15px;background:#fff;color:var(--cocoa);border:1.5px solid var(--line);
 box-shadow:var(--shadow);transition:.18s}
.saveall.dirty{background:var(--raspberry);color:#fff;border-color:var(--raspberry);box-shadow:var(--shadow)}
.saveall.dirty:hover{background:#163F6E}
.saveall .ic{font-size:17px;line-height:1}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg .fl{position:absolute;bottom:-16vh;opacity:.10;color:var(--raspberry);animation:drift linear infinite}
.bg .fl svg{width:100%;height:100%;display:block}
@keyframes drift{
 0%{transform:translateY(0) rotate(-8deg)}
 50%{transform:translateY(-60vh) translateX(3vw) rotate(6deg)}
 100%{transform:translateY(-125vh) translateX(-2vw) rotate(-10deg)}
}
.bg .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.30;animation:breathe 18s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.bg .sp{position:absolute;width:7px;height:3px;border-radius:2px;background:var(--raspberry-soft);opacity:.22;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(110vh) rotate(320deg)}}
.wrap{position:relative;z-index:1}
.savebar{z-index:80}
@media (prefers-reduced-motion:reduce){.bg{display:none}}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--cocoa);text-align:start;padding:6px 4px;font-weight:600}
td{padding:5px 4px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* ---------- date helpers ---------- */
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var GM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var WDS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function monthLen(y,m){return new Date(y,m,0).getDate()}
function dKey(d){return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0')}
function keyToD(k){var p=String(k).split('-');return{y:+p[0],m:+p[1],d:+p[2]}}
function dToDate(d){return new Date(d.y,d.m-1,d.d)}
function weekday(d){return dToDate(d).getDay()} /* 0 = Sunday */
function serial(d){return Math.floor(Date.UTC(d.y,d.m-1,d.d)/86400000)}
function fromSerial(n){var t=new Date(n*86400000);return{y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()}}
function shiftDays(d,n){return fromSerial(serial(d)+n)}
function nowParts(){
 var n=new Date(), tz=(typeof S!=='undefined'&&S&&S.settings)?S.settings.tz:'';
 if(tz){try{

function migrateSettings(o){
 var x=Object.assign({},o);
 if(x.prodLaborScale==null)x.prodLaborScale=1;
 if(x.time24==null)x.time24=true;
 if(x.tz==null)x.tz='';
 if(!Array.isArray(x.depModes)||!x.depModes.length)x.depModes=[
  {id:'dm0',label:'No deposit',type:'pct',value:0},
  {id:'dm30',label:'30% upfront',type:'pct',value:30},
  {id:'dm50',label:'Half now',type:'pct',value:50},
  {id:'dm100',label:'Paid in full',type:'pct',value:100}];
 if(!x.defSize||typeof x.defSize!=='object')x.defSize={};
 if(!Array.isArray(x.units)||!x.units.length)x.units=['kg','g','piece','pack','litre','tbsp','sheet'];
 if(x.overhead!=null&&x.prodOver==null){x.prodOver=x.overhead;x.decOver=x.overhead}
 if(x.profit!=null&&x.prodProfit==null){x.prodProfit=x.profit;x.decProfit=x.profit}
 delete x.overhead;delete x.profit;
 return x
}

function hasCloud(){return !!(window.storage&&window.storage.set&&window.storage.get)}

var LASTERR='';
async function writeAll(str){
 var ok=[],err=[];
 if(hasCloud()){
  try{
   await window.storage.set(KEY,str,false);
   var chk=await window.storage.get(KEY,false);
   if(chk&&chk.value===str)ok.push('Cloud storage');else err.push('Cloud: written but not verified');
  }catch(e){err.push('Cloud: '+((e&&e.message)||e))}
 }else{err.push('Cloud: not available')}
 if(hasLocal()){try{window.localStorage.setItem(KEY,str);ok.push('Browser storage')}catch(e){err.push('Browser: '+((e&&e.message)||e))}}
 else{err.push('Browser: not available')}
 BACKENDS=ok;LASTERR=err.join(' • ');
 return ok.length>0;
}

 var best=null,bt=-1;
 c.forEach(function(t){try{var d=JSON.parse(t);var at=d.savedAt||0;if(at>=bt){bt=at;best=d}}catch(e){}});

}

/* ---------- price calculation ---------- */
function ingPrice(id){var g=S.ingredients.find(function(x){return x.id===id});return g?g.price:0}
function calc(p,size){
 var mat=0;(p.recipe||[]).forEach(function(r){mat+=ingPrice(r.i)*r.q});
 var f=size?size.f:1, box=size?(size.box||0):0;
 mat=mat*f;
 var st=S.settings;
 var k=st.prodLaborBySize===false?0:(st.prodLaborScale==null?1:+st.prodLaborScale);
 var lf=1+(f-1)*k;
 var labor=st.prodUseLabor===false?0:(p.labor||0)/60*st.laborRate*lf;
 var over=st.prodUseOver?(mat+labor)*(st.prodOver||0)/100:0;
 var cost=mat+labor+box+over;
 var profit=st.prodUseProfit?cost*(st.prodProfit||0)/100:0;
 var raw=cost+profit;
 var step=S.settings.round||1;
 var final=Math.ceil(raw/step)*step;
 return{mat:mat,labor:labor,box:box,over:over,profit:profit,cost:cost,final:final}
}
var MULTS=[{v:1,l:'Simple (×1)'},{v:1.5,l:'Medium (×1.5)'},{v:2,l:'Complex (×2)'},{v:3,l:'Very complex (×3)'}];
function calcDec(dd){
 var mat=0;
 if(dd.mode==='manual')mat=+dd.matCost||0;
 else (dd.mats||[]).forEach(function(r){mat+=ingPrice(r.i)*r.q});
 var m=+dd.mult||1;
 var st=S.settings;
 var labor=st.decUseLabor===false?0:(+dd.hours||0)*(st.decorRate||st.laborRate)*m;
 var over=st.decUseOver?(mat+labor)*(st.decOver||0)/100:0;
 var cost=mat+labor+over, profit=st.decUseProfit?cost*(st.decProfit||0)/100:0;
 var step=S.settings.round||1;
 var fin=Math.ceil((cost+profit)/step)*step;
 if(dd.mode==='manual'&&+dd.priceOverride>0)fin=+dd.priceOverride;
 return{mat:mat,labor:labor,box:0,over:over,profit:profit,cost:cost,final:fin,fixed:dd.mode==='manual'&&+dd.priceOverride>0}
}
function hasDec(dd){
 if(!dd)return false;
 var lb=S.settings.decUseLabor!==false;
 if(dd.mode==='manual')return !!((dd.name&&dd.name.trim())||+dd.matCost>0||(lb&&+dd.hours>0)||+dd.priceOverride>0);
 return !!((dd.mats&&dd.mats.length)||(lb&&+dd.hours>0))}
function multLabel(v){var m=MULTS.find(function(x){return x.v===+v});return m?m.l:'×'+num(v)}
function depAmount(m,total){
 if(!m)return 0;
 var v=+m.value||0, raw=(m.type==='amt')?v:total*v/100, step=S.settings.round||1;
 return Math.max(0,Math.round(raw/step)*step)
}
function depMode(id){return (S.settings.depModes||[]).find(function(x){return x.id===id})}
function currentDep(d,total){
 if(d.depMode&&d.depMode!=='manual'){var m=depMode(d.depMode);if(m)return depAmount(m,total)}
 return +d.deposit||0
}
function lineTotal(it){return (it.price+(it.dec?it.dec.price:0))*it.qty}
function sliceBar(c){
 var t=c.mat+c.labor+c.box+c.over+c.profit||1;
 function w(v){return (v/t*100).toFixed(1)+'%'}
 var seg=function(v,c,l){return v>0?'<span><i class="dot" style="background:'+c+'"></i>'+l+' '+money(v)+'</span>':''};
 return '<div class="slice"><div class="slice-bar">'+
  '<i style="width:'+w(c.mat)+';background:var(--raspberry-soft)"></i>'+
  '<i style="width:'+w(c.labor)+';background:var(--cocoa)"></i>'+
  '<i style="width:'+w(c.box)+';background:var(--box)"></i>'+
  '<i style="width:'+w(c.over)+';background:var(--lav)"></i>'+
  '<i style="width:'+w(c.profit)+';background:var(--pistachio)"></i></div>'+
  '<div class="slice-key">'+
  seg(c.mat,'var(--raspberry-soft)','Materials')+
  seg(c.labor,'var(--cocoa)','Labour')+
  seg(c.box,'var(--box)','Packaging')+
  seg(c.over,'var(--lav)','Overhead')+
  seg(c.profit,'var(--pistachio)','Profit')+
  '</div></div>'
}

async function saveOrder(){
 var d=UI.draft;
 if(!d.name.trim())return toast('Enter the customer name');
 if(!d.date)return toast('Pick a delivery date');
 if(!d.items.length)return toast('Add at least one product');
 var total=d.items.reduce(function(s,it){return s+lineTotal(it)},0);
 var depNow=currentDep(d,total);
 var o={id:d.id||uid(),name:d.name.trim(),phone:d.phone.trim(),items:d.items.slice(),depMode:d.depMode||'manual',
  day:dKey(d.date),
  time:d.time,note:d.note,discount:+d.discount||0,deposit:depNow,total:total,
  status:d.status||'new',createdAt:d.createdAt||new Date().toISOString()};
 var ix=S.orders.findIndex(function(x){return x.id===o.id});
 if(ix>-1)S.orders[ix]=o;else S.orders.push(o);
 pushHist();
 await save();
 resetDraft();goTab('orders')
}

 return '<div class="item'+(dd>=0&&dd<=1&&o.status!=='done'?' hi':'')+'">'+

 '<div class="muted">'+WD[weekday(j)]+', '+dateLong(j)+(o.time?' • '+fmtTime(o.time):'')+' • '+when+'</div>'+
 '<div class="muted">'+o.items.map(function(i){return esc(i.label)+' ×'+num(i.qty)}).join(' | ')+'</div>'+
 o.items.filter(function(i){return i.dec}).map(function(i){

 (o.phone?'<div class="muted">Phone: '+num(o.phone)+'</div>':'')+

 '<div class="row" style="margin-top:8px">'+

function customers(){
 var m={};
 S.orders.forEach(function(o){
  var k=phoneKey(o.phone)||('n:'+(o.name||'').trim());
  var c=m[k]||(m[k]={key:k,name:o.name,phone:o.phone,n:0,total:0,due:0,last:'',first:'',open:0});
  c.n++;c.total+=o.total-o.discount;c.due+=o.total-o.discount-o.deposit;
  if(o.status!=='done')c.open++;
  if(!c.phone&&o.phone)c.phone=o.phone;
  if(!c.last||o.day>c.last)c.last=o.day;
  if(!c.first||o.day<c.first)c.first=o.day;
 });
 return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.total-a.total})
}
function filterOrders(){
 var t=today(),tk=serial(t),mk=dKey(t).slice(0,7);
 var q=toLatin(UI.q||'').trim().toLowerCase(), qd=q.replace(/[^0-9]/g,'');
 return S.orders.filter(function(o){
  var j=keyToD(o.day),k=serial(j),f=UI.filter;
  var pass = f==='all'?true:
   f==='today'?k===tk:
   f==='tomorrow'?k===tk+1:
   f==='week'?(k>=tk&&k<tk+7):
   f==='month'?o.day.slice(0,7)===mk:
   f==='overdue'?(k<tk&&o.status!=='done'):
   f==='done'?o.status==='done':
   /* up */ (k>=tk&&o.status!=='done');
  if(!pass)return false;
  if(!q)return true;
  var hay=toLatin((o.name||'')+' '+(o.note||'')+' '+o.items.map(function(i){return i.label}).join(' ')).toLowerCase();
  if(hay.indexOf(q)>-1)return true;
  return !!(qd&&phoneKey(o.phone).indexOf(qd)>-1)
 })
}
function sortOrders(list){
 var s=UI.sort||'dateAsc';
 var by={
  dateAsc:function(a,b){return a.day<b.day?-1:a.day>b.day?1:0},
  dateDesc:function(a,b){return a.day>b.day?-1:a.day<b.day?1:0},
  amount:function(a,b){return (b.total-b.discount)-(a.total-a.discount)},
  due:function(a,b){return (b.total-b.discount-b.deposit)-(a.total-a.discount-a.deposit)},
  newest:function(a,b){return (b.createdAt||'')<(a.createdAt||'')?-1:1},
  name:function(a,b){return (a.name||'').localeCompare(b.name||'','en')}
 };
 return list.slice().sort(by[s]||by.dateAsc)
}

  '<div class="divider"></div>'+
  '<div class="grid3">'+
   '<div class="stat"><span class="muted">Orders in this view'+ihelp('These three figures describe the current filter and search only, not the whole database.')+'</span><b>'+num(list.length)+'</b></div>'+
   '<div class="stat"><span class="muted">Total value'+ihelp('The total of the orders in this view after discounts, deposits not deducted.')+'</span><b>'+money(sumAll)+'</b></div>'+

 if(UI.cust){

  var cby={total:function(a,b){return b.total-a.total},

function calendarHTML(m,sel,withPips){

  var j={y:m.y,m:m.m,d:d},k=dKey(j),wd=weekday(j);

   (n?'<span class="pips">'+Array(Math.min(n,3)).fill('<i></i>').join('')+'</span>':'')+'</button>'}

function refreshProduct(pid){
 var p=S.products.find(function(x){return x.id===pid});if(!p)return;
 var el=function(i){return document.getElementById(i)};
 var nm=el('nm-'+pid);if(nm)nm.textContent=p.emoji+' '+p.name;

 var sl=el('slice-'+pid);if(sl&&p.sizes[0])sl.innerHTML=sliceBar(calc(p,p.sizes[0]));
 p.recipe.forEach(function(r,ix){var g=S.ingredients.find(function(y){return y.id===r.i})||{price:0};

 p.sizes.forEach(function(s,ix){var c=el('sp-'+pid+'-'+ix);if(c)c.textContent=money(calc(p,s).final)});
}

  '<td><button class="starbtn'+(s.defDepMode===m.id?'':' off')+'" data-depstar="'+m.id+'">'+(s.defDepMode===m.id?'★':'☆')+'</button></td>'+
  '<td><button class="btn danger mini" data-depdel="'+m.id+'">×</button></td></tr>'}).join('')+
 '</table><div class="row" style="margin-top:12px"><button class="btn ghost mini" id="addDep">+ New preset</button>'+
 '<button class="starbtn sp'+(s.defDepMode?' off':'')+'" data-depstar="">'+(s.defDepMode?'☆':'★')+'</button>'+
 '<span class="muted">default: custom amount</span></div></div>'+

 '<div class="card"><h2>This month at a glance'+ihelp('A summary of the current calendar month, based on order delivery dates.')+'</h2><div class="grid3">'+
  '<div class="item"><div class="muted">Orders in '+MONTHS[t.m-1]+ihelp('How many orders are due for delivery in this calendar month, delivered or not.')+'</div><b class="price">'+num(month.length)+'</b></div>'+
  '<div class="item"><div class="muted">Value this month'+ihelp('The total of this month’s orders after discounts. Deposits are not deducted — this is the month’s gross sales.')+'</div><b class="price">'+money(rev)+'</b></div>'+
  '<div class="item"><div class="muted">Upcoming deliveries'+ihelp('Orders dated today or later that are not yet delivered — the work you have queued up.')+'</div><b class="price">'+num(S.orders.filter(function(o){var j=keyToD(o.day);return serial(j)>=tk&&o.status!=='done'}).length)+'</b></div>'+

 var s=S.settings;
 return '<div class="card"><h2>Display'+ihelp('Presentation only. These have no effect on calculations or data.')+'</h2><div class="grid2">'+

   '<option value="Europe/Berlin"'+(s.tz==='Europe/Berlin'?' selected':'')+'>Berlin</option>'+
   '<option value="Asia/Dubai"'+(s.tz==='Asia/Dubai'?' selected':'')+'>Dubai</option>'+
  '</select>'+
  '<div class="muted" style="margin-top:6px">Now: '+WD[weekday(today())]+' '+dateLong(today())+' • '+

 '</div></div>'+
 '<div class="card"><h2>Storage status'+ihelp('Everything saves automatically. This shows where and when it was written.')+'</h2>'+
 '<p class="hint">Active storage: <b>'+(BACKENDS.length?esc(BACKENDS.join(' + ')):'none — this session only')+'</b>'+
 (S.savedAt?' • last saved: '+num(new Date(S.savedAt).toLocaleString()):' • nothing saved yet')+'</p>'+
 (LASTERR?'<p class="hint" style="color:#C0392B">Last save report: '+esc(LASTERR)+'</p>':'')+
 '<div class="row"><span class="muted">'+num(S.orders.length)+' orders \u2022 '+num(S.products.length)+' products \u2022 '+num(S.ingredients.length)+' ingredients</span>'+
 ihelp('Saving is automatic, so you never have to press this. Use it when you want to be sure it was written this second.')+
 '<button class="btn sp" id="saveNow">Save now</button></div></div>'+
 '<div class="card"><h2>Backup file'+ihelp('One file containing everything. If browser storage is cleared or you move to another device, this file brings it all back.')+'</h2><p class="hint">Download a backup once a month and keep it somewhere safe.</p>'+
 '<div class="row">'+ihelp('Creates a JSON file holding every order, product, ingredient and setting. Email it to yourself or store it in the cloud.')+
 '<button class="btn ghost" id="exp">Download backup</button>'+
 ihelp('Restores a backup file. Warning: the current data is replaced by the file’s contents. If that was a mistake, press Undo.')+
 '<label class="btn ghost" style="display:inline-block">Restore from file<input type="file" id="imp" accept="application/json" style="display:none"></label></div></div>'+
 '<div class="card"><h2>Clean-up'+ihelp('Deletes orders only. Products, ingredients and settings are left untouched.')+'</h2><p class="hint">Orders are removed; products, ingredients and pricing settings stay as they are. If it was a mistake, the Undo button at the bottom brings them back.</p>'+
 '<div class="row"><button class="btn danger" id="wipe">Delete all orders</button>'+

function bindSet(){
 V.querySelectorAll('[data-st]').forEach(function(x){x.addEventListener('change',function(){S.settings[x.dataset.st]=unnum(x.value);touch();render()})});
 V.querySelectorAll('[data-stb]').forEach(function(x){x.addEventListener('change',function(){
  S.settings[x.dataset.stb]=x.value==='1';touch();render()})});
 V.querySelectorAll('[data-dm]').forEach(function(x){x.addEventListener('change',function(){
  var a=x.dataset.dm.split('|'),m=depMode(a[0]);if(!m)return;
  if(a[1]==='label')m.label=x.value;
  else if(a[1]==='type'){m.type=x.value;touch();render();return}
  else m.value=unnum(x.value);
  touch()})});
 V.querySelectorAll('[data-depstar]').forEach(function(x){x.addEventListener('click',function(){
  var id=x.dataset.depstar;
  S.settings.defDepMode=(S.settings.defDepMode===id)?'':id;
  touch();render()})});
 V.querySelectorAll('[data-depdel]').forEach(function(x){x.addEventListener('click',function(){
  S.settings.depModes=(S.settings.depModes||[]).filter(function(m){return m.id!==x.dataset.depdel});
  if(S.settings.defDepMode===x.dataset.depdel)S.settings.defDepMode='';
  touch();render()})});
 var ad=document.getElementById('addDep');
 if(ad)ad.addEventListener('click',function(){
  S.settings.depModes.push({id:uid(),label:'New preset',type:'pct',value:20});touch();render()});
 V.querySelectorAll('[data-stx]').forEach(function(x){x.addEventListener('change',function(){
  var k=x.dataset.stx;S.settings[k]=(k==='currency'?(x.value||'USD'):x.value);touch();render()})});
 V.querySelectorAll('[data-sw]').forEach(function(x){x.addEventListener('change',function(){S.settings[x.dataset.sw]=x.checked;touch();render()})});
}
function bindBackup(){
 V.querySelectorAll('[data-stb]').forEach(function(x){x.addEventListener('change',function(){
  S.settings[x.dataset.stb]=x.value==='1';touch();render()})});
 var sn=document.getElementById('saveNow');
 if(sn)sn.addEventListener('click',async function(){await save();render()});
 var e=document.getElementById('exp');
 if(e)e.addEventListener('click',function(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='bakery-panel-backup-'+dKey(today())+'.json';a.click();toast('Backup file created')});
 var i=document.getElementById('imp');
 if(i)i.addEventListener('change',function(){
  var f=i.files[0];if(!f)return;var r=new FileReader();
  r.onload=async function(){try{var d=JSON.parse(r.result);
    S={ingredients:d.ingredients||[],products:d.products||[],orders:d.orders||[],settings:Object.assign(seed().settings,d.settings||{})};
    pushHist();await save(true);render();toast('Data restored')}catch(err){toast('That file is not valid')}};
  r.readAsText(f)});
 var rd=document.getElementById('resetDemo');
 if(rd)rd.addEventListener('click',async function(){
  if(!confirm('Replace everything with the original sample products, ingredients and orders?'))return;
  S=seed();if(localStorage.getItem("demo-off:bakery.html")!=="1"){S.orders=demoOrders();}touch();render();toast('Demo data restored')});
 var w=document.getElementById('wipe');
 if(w)w.addEventListener('click',async function(){if(!confirm('Delete every order? Products and ingredients stay.'))return;
  S.orders=[];touch();render()});
}

/* ---------- boot ---------- */
function render(){paint();
 var rb=document.getElementById('resetBar');
 if(rb)rb.style.display=(UI.tab==='new')?'inline-flex':'none';
 if(UI.tab==='new')bindNew();else if(UI.tab==='orders')bindOrders();
 else if(UI.tab==='cal')bindCal();else if(UI.tab==='products')bindProducts();
else if(UI.tab==='ing')bindIng();else if(UI.tab==='bk')bindBackup();else if(UI.tab==='help')bindHelp();else bindSet()}
V.addEventListener('click',function(e){
 var t=e.target.closest?e.target.closest('[data-ddtoggle]'):null;
 if(t){e.stopPropagation();UI.ddOpen=(UI.ddOpen===t.dataset.ddtoggle)?null:t.dataset.ddtoggle;render();return}
 var pk=e.target.closest?e.target.closest('[data-ddpick]'):null;
 if(pk){e.stopPropagation();var a=pk.dataset.ddpick.split('|');UI.ddOpen=null;ddPick(a[0],a.slice(1).join('|'));return}
 var st=e.target.closest?e.target.closest('[data-ddstar]'):null;
 if(st){e.stopPropagation();var b=st.dataset.ddstar.split('|');ddStar(b[0],b.slice(1).join('|'));return}
});
document.addEventListener('click',function(){if(UI.ddOpen){UI.ddOpen=null;render()}});
V.addEventListener('input',function(e){
 var t=e.target;
 if(t&&t.classList&&t.classList.contains('moneyin'))reformatMoney(t)});
document.getElementById('resetBar').addEventListener('click',function(){
 if(UI.tab!=='new')return;
 if(!confirm('Clear the whole order form and start over? Undo can bring it back.'))return;
 resetDraft();act();render();window.scrollTo({top:0,behavior:'smooth'});toast('Form cleared')});
document.getElementById('undoBtn').addEventListener('click',function(){undo()});
document.getElementById('saveAll').addEventListener('click',async function(){
 var a=document.activeElement;
 if(a&&a.blur&&a!==document.body)a.blur();
 await save();
 render()
});
(async function(){
 await load();
(function(){})();
 UI.selP=S.settings.defProduct||'';UI.selS=(S.settings.defSize||{})[UI.selP]||null;
 UI.decDraft.mult=+S.settings.defMult||1;UI.decIng=S.settings.defDecIng||'';

 applyDefaults();paintTabs();
 BASE=snapshot();
 render();
 paintSaveBtn();paintUndo();

 document.addEventListener('visibilitychange',function(){if(!document.hidden)paintToday()});
 window.addEventListener('focus',paintToday)
})();
