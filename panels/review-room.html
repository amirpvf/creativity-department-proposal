:root{
  --ground:#0E1B21; --surface:#152730; --surface2:#1D343E; --line:#2A4753;
  --ink:#EAF0EE; --muted:#8CA5AC;
  --brass:#D9B166; --aqua:#79C9B4; --clay:#E2897C;
  --fa:'Vazirmatn','Vazir','IRANSans','Segoe UI',Tahoma,Arial,sans-serif;
  --se:Georgia,'Times New Roman',serif;
  --mo:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(217,177,102,.10), transparent 60%),
    var(--ground);
  color:var(--ink); font-family:var(--fa); font-size:16px; line-height:1.85;
  -webkit-font-smoothing:antialiased; min-height:100%; padding:12px 12px 28px;
  overflow-wrap:break-word; word-wrap:break-word;
}
.wrap{max-width:660px;margin:0 auto}

/* ── masthead ── */
.mast{padding:6px 2px 12px;border-bottom:1px solid var(--line)}
.mast .row{display:flex;align-items:baseline;justify-content:space-between}
.mast h1{margin:0;font-size:17px;font-weight:500}
.mast .ver{font-family:var(--mo);font-size:10px;color:var(--muted);letter-spacing:.16em}
.tabs{display:flex;margin-top:10px}
.tabs .tab+.tab{margin-right:18px}
.tab{background:none;border:none;padding:4px 0 8px;font-family:var(--fa);font-size:14px;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tab:focus-visible{outline:2px solid var(--aqua);outline-offset:3px}

/* ── spine ── */
.spine{display:flex;margin:16px 0 6px}
.spine .box+.box{margin-right:4px}
.box{flex:1;min-width:0;text-align:center}
.box .bar{height:34px;background:var(--surface);border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.box .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--brass),#b8904d);
  transition:height .5s cubic-bezier(.2,.7,.3,1)}
.box.due .bar{border-color:var(--brass)}
.box .lab{font-family:var(--fa);font-size:10.5px;color:var(--muted);margin-top:4px}
.box .cnt{font-family:var(--mo);font-size:11px;margin-top:1px}
.spine-note{font-size:11.5px;color:var(--muted);text-align:center;margin:2px 0 14px}
.spine-note b{color:var(--brass);font-weight:500;font-family:var(--mo);font-size:11px}

/* ── filters ── */
.filters{display:flex;overflow-x:auto;padding:0 0 10px;margin:0 0 12px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--fa);font-size:12.5px;padding:6px 13px;border-radius:2px;
  background:transparent;color:var(--muted);border:1px solid var(--line);cursor:pointer;
  transition:color .15s,border-color .15s,background .15s}
.filters .chip+.chip{margin-right:6px}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#0E1B21;font-weight:500}
.chip:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.frow{display:flex;align-items:center;margin-bottom:8px}
.frow .flab{font-family:var(--fa);font-size:11.5px;color:var(--muted);flex:0 0 auto;min-width:34px;margin-left:8px}

/* ── card: the dialogue rail ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:18px 16px 16px;animation:enter .32s ease both}
@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.chead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.chead>div+div{margin-right:12px}
.idx{font-family:var(--mo);font-size:27px;font-weight:600;color:var(--brass);line-height:1;direction:ltr}
.idx.ask{font-family:var(--fa);color:var(--line);font-size:30px}
.meta{text-align:left;direction:ltr;font-family:var(--mo);font-size:9.5px;color:var(--muted);
  letter-spacing:.1em;line-height:1.7}
.tl{font-size:12px;color:var(--muted);margin-top:5px}
.badge{display:inline-block;font-family:var(--mo);font-size:9.5px;letter-spacing:.16em;
  color:var(--brass);border:1px solid var(--brass);border-radius:2px;padding:1px 6px;margin-right:7px;
  vertical-align:2px}

/* rail */
.rail{position:relative;padding-right:20px}
.rail::before{content:'';position:absolute;top:6px;right:4px;
  width:1px;height:var(--railq,100%);background:var(--line)}
.node{position:absolute;right:0;width:9px;height:9px;border-radius:50%;
  border:1px solid var(--brass);background:var(--ground)}
.node.q{top:8px;background:var(--brass)}
.node.a{border-color:var(--aqua);background:var(--aqua)}
.prompt{font-size:19px;line-height:1.9;white-space:pre-wrap}
.prompt.ltr{direction:ltr;text-align:left;font-family:var(--se);font-size:19.5px;line-height:1.75}

/* the pause */
.pause{display:flex;align-items:center;margin:18px 0 4px;padding-right:20px}
.pause .dash{flex:1;height:1px;margin:0 9px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.pause .word{font-family:var(--fa);font-size:11.5px;color:var(--muted)}

.ablock{position:relative;padding-right:20px;margin-top:14px;animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ablock .node{top:8px}
.alab{font-family:var(--fa);font-size:11.5px;color:var(--aqua);margin-bottom:7px}
.atext{font-size:18px;line-height:1.9;white-space:pre-wrap}
.atext.ltr{direction:ltr;text-align:left;font-family:var(--se);font-size:19px;line-height:1.7}
.why{margin-top:12px;font-size:14.5px;line-height:1.85;color:#C8D6D4;
  background:var(--surface2);border-radius:3px;padding:11px 13px}
.src{margin-top:12px;font-size:12.5px;color:var(--muted);
  border-right:2px solid var(--brass);padding-right:10px}
.nextdue{margin-top:10px;font-family:var(--mo);font-size:11px;color:var(--aqua);direction:rtl}

/* ── options ── */
.opts{display:flex;flex-direction:column;margin-top:16px}
.opts .opt+.opt{margin-top:7px}
.opt{text-align:right;font-family:var(--fa);font-size:15.5px;line-height:1.7;
  background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:3px;
  padding:11px 13px;cursor:pointer;transition:border-color .15s,background .15s}
.opt.en{font-family:var(--se);direction:ltr;text-align:left;font-size:16.5px}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.opt.right{border-color:var(--aqua);background:rgba(121,201,180,.15)}
.opt.wrong{border-color:var(--clay);background:rgba(226,137,124,.13)}
.opt[disabled]{cursor:default}

/* ── buttons ── */
.acts{display:flex;margin-top:16px}
.acts .btn+.btn{margin-right:7px}
.btn{flex:1;font-family:var(--fa);font-size:15px;font-weight:500;padding:13px 8px;border-radius:3px;
  cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--ink);
  transition:background .15s,border-color .15s}
.btn:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.btn.go{background:var(--brass);border-color:var(--brass);color:#0E1B21}
.btn.again{border-color:var(--clay);color:var(--clay);background:transparent}
.btn.again:hover{background:rgba(226,137,124,.12)}
.btn.known{border-color:var(--aqua);color:var(--aqua);background:transparent}
.btn.known:hover{background:rgba(121,201,180,.12)}
.btn kbd{font-family:var(--mo);font-size:10px;opacity:.55;margin-right:6px}

/* ── footer ── */
.bar{display:flex;align-items:center;margin-top:14px;flex-wrap:wrap}
.bar .mini{margin-right:8px}
.bar .stat{font-size:12px;color:var(--muted);margin-left:auto}
.bar .stat b{font-family:var(--mo);color:var(--ink);font-weight:500}
.mini{font-family:var(--fa);font-size:12.5px;padding:7px 12px;border-radius:3px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--muted);transition:color .15s,border-color .15s}
.mini:hover{color:var(--ink);border-color:var(--muted)}
.mini.save:hover{color:var(--aqua);border-color:var(--aqua)}
.mini.danger:hover{color:var(--clay);border-color:var(--clay)}
.mini:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.bk{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:12px;margin-top:10px}
.bk p{margin:0 0 8px;font-size:12.5px;color:var(--muted);line-height:1.8}
.bk textarea{width:100%;background:var(--ground);color:var(--ink);border:1px solid var(--line);
  border-radius:3px;padding:8px;font-family:var(--mo);font-size:11px;direction:ltr;resize:vertical}
.bkrow{display:flex;margin-top:8px}
.bkrow .mini{flex:1}
.bkrow .mini+.mini{margin-right:8px}
#fatal:not([hidden]),.fatalbox{display:block;margin:12px auto;max-width:660px;
  background:#2A1A1C;border:1px solid #E2897C;border-radius:4px;padding:14px 16px;
  color:#F3DEDC;font-size:14px;line-height:1.9}
#fatal b,.fatalbox b{color:#E2897C;display:block;margin-bottom:6px;font-size:13px}
#fatal pre{white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;
  font-family:var(--mo);font-size:11px;color:#C9A9A6;margin:8px 0 0;background:#1C1214;
  padding:8px;border-radius:3px}
.toast{font-size:12px;color:var(--aqua);min-height:18px;margin-top:8px;text-align:center;
  opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
.empty{text-align:center;padding:34px 14px}
.empty .big{font-family:var(--mo);font-size:32px;color:var(--brass)}
.empty p{color:var(--muted);font-size:14.5px}

/* ── help ── */
.help{padding:6px 0 0}
.help h2{font-size:16px;font-weight:500;margin:26px 0 8px;color:var(--brass)}
.help h2:first-child{margin-top:12px}
.help h3{font-size:14px;font-weight:500;margin:16px 0 6px;color:var(--ink)}
.help p,.help li{font-size:15px;line-height:1.95;color:#D3DEDC}
.help ul,.help ol{padding-right:20px;padding-left:0;margin:6px 0}
.help li{margin-bottom:5px}
.help code{font-family:var(--mo);font-size:12.5px;background:var(--surface2);
  padding:1px 5px;border-radius:2px;color:var(--brass);direction:ltr;display:inline-block}
.help table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
.help th,.help td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:right}
.help th{font-family:var(--fa);font-size:12px;color:var(--muted);font-weight:400}
.help td:first-child{color:var(--brass)}
.callout{border:1px solid var(--line);border-right:2px solid var(--clay);
  background:var(--surface);border-radius:3px;padding:12px 14px;margin:14px 0}
.callout .ct{font-size:12.5px;color:var(--clay);font-family:var(--fa);margin-bottom:6px}
.callout p{margin:0 0 6px;font-size:14.5px}
.callout p:last-child{margin-bottom:0}
.help a{color:var(--aqua);word-break:break-all}
.hr{height:1px;background:var(--line);margin:22px 0}

@media (max-width:520px){
  .btn kbd{display:none}
  .prompt{font-size:18px}
  .box .lab{font-size:8.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

\":\"Engages in ongoing personal and professional learning and development as a coach. Works with coaching supervisors or mentor coaches as needed. Develops and maintains a mindset that is open, curious, flexible and client-centered.\",\"source\":\"Competency 2 — definition\",\"id\":\"q0027\"},{\"idx\":\"؟\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C2\",\"group\":\"competency\",\"tl\":\"ترجمهٔ تعریف\",\"prompt\":\"این تعریف را به فارسی برگردان:\\nEngages in ongoing personal and professional learning and development as a coach. Works with coaching supervisors or mentor coaches as needed. Develops and maintains a mindset that is open, curious, flexible and client-centered.\",\"answer\":\"به عنوان یک کوچ، به طور مداوم در مسیر یادگیری و توسعه شخصی و حرفه‌ای خود قرار می‌گیرد. در صورت نیاز، از کوچ سوپروایزر یا منتورکوچ کمک می‌گیرد. ذهنیتی را پرورش داده و حفظ می‌کند که پذیرا، کنجکاو، انعطاف‌پذیر و مراجع‌محور است.\",\"source\":\"صلاحیت ۲ — تعریف\",\"id\":\"q0028\"},{\"idx\":\"C2\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C2\",\"group\":\"competency\",\"tl\":\"تعداد بندها\",\"prompt\":\"صلاحیت ۲ چند زیرصلاحیت دارد؟\",\"answer\":\"۱۰ بند (۲.۱ تا ۲.۱۰)\",\"source\":\"صلاحیت ۲\",\"id\":\"q0029\"},{\"idx\":\"C2\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C2\",\"group\":\"competency\",\"tl\":\"فهرست بندها\",\"prompt\":\"بندهای صلاحیت ۲ («تجسم طرز فکر کوچینگ») را فهرست کن.\",\"answer\":\"۲.۱ — تصدیق می‌کند که مراجعین مسئول انتخاب‌های خود هستند.\\n۲.۲ — به عنوان کوچ، درگیر یادگیری و توسعهٔ مداوم خود است، مانند آگاهی از بهترین شیوه‌های فعلی کوچینگ و استفاده از فناوری به‌روز.\\n۲.۳ — بازتاب را به طور مستمر برای تقویت کوچینگ خود ایجاد می‌کند.\\n۲.۴ — از تأثیر سوگیری‌ها، زمینه و فرهنگ بر خود و دیگران آگاه است و در برابر آن گشوده است.\\n۲.۵ — از آگاهی از خود و شهود خود برای سود رساندن به مراجعین استفاده می‌کند.\\n۲.۶ — توانایی مدیریت احساسات خود را توسعه داده و حفظ می‌کند.\\n۲.۷ — قبل، حین و بعد از هر جلسه، وضعیت بهزیستی عاطفی، جسمی و ذهنی خود را در شرایط خوبی نگه می‌دارد.\\n۲.۸ — در صورت لزوم از منابع خارجی کمک می‌گیرد.\\n۲.۹ — گشودگی و کنجکاوی را در خود، مراجع و فرایند کوچینگ پرورش می‌دهد.\\n۲.۱۰ — همواره از تأثیر افکار و رفتارهای خود بر مراجع و دیگران آگاه می‌ماند.\",\"source\":\"صلاحیت ۲\",\"id\":\"q0030\"},{\"idx\":\"C2\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"C2\",\"group\":\"competency\",\"tl\":\"بخش‌بندی\",\"prompt\":\"صلاحیت ۲ («تجسم طرز فکر کوچینگ») در کدام بخش سند است؟\",\"options\":[\"الف. پایه و اساس\",\"ب. ایجاد رابطه مشترک\",\"ج. برقراری ارتباط مؤثر\",\"د. کاشتن یادگیری و رشد\"],\"answer\":\"الف. پایه و اساس\",\"source\":\"صلاحیت ۲\",\"id\":\"q0031\"},{\"idx\":\"C2\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"C2\",\"group\":\"competency\",\"tl\":\"کدام در این صلاحیت نیست\",\"prompt\":\"کدام بند به صلاحیت ۲ («تجسم طرز فکر کوچینگ») تعلق ندارد؟\",\"options\":[\"از آگاهی از خود و شهود خود برای سود رساندن به مراجعین استفاده می‌کند.\",\"در صورت لزوم از منابع خارجی کمک می‌گیرد.\",\"تصدیق می‌کند که مراجعین مسئول انتخاب‌های خود هستند.\",\"از به چالش کشیدن مراجع به عنوان راهی برای برانگیختن آگاهی یا بینش استفاده می‌کند.\"],\"answer\":\"از به چالش کشیدن مراجع به عنوان راهی برای برانگیختن آگاهی یا بینش استفاده می‌کند.\",\"source\":\"بند ۷.۲ متعلق به صلاحیت ۷ است\",\"id\":\"q0032\"},{\"idx\":\"C3\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C3\",\"group\":\"competency\",\"tl\":\"شماره ← نام\",\"prompt\":\"صلاحیت شمارهٔ ۳ چه نام دارد؟\",\"answer\":\"قراردادها را ایجاد و حفظ می‌کند\\nEstablishes and Maintains Agreements\",\"source\":\"صلاحیت ۳\",\"id\":\"q0033\"},{\"idx\":\"؟\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C3\",\"group\":\"competency\",\"tl\":\"نام ← شماره و بخش\",\"prompt\":\"«قراردادها را ایجاد و حفظ می‌کند» صلاحیت شمارهٔ چند است و در کدام بخش قرار دارد؟\",\"answer\":\"صلاحیت شمارهٔ ۳ — بخش ب. ایجاد رابطه مشترک\",\"source\":\"صلاحیت ۳\",\"id\":\"q0034\"},{\"idx\":\"C3\",\"kind\":\"recall\",\"lang\":\"en\",\"topic\":\"C3\",\"group\":\"competency\",\"tl\":\"Number → name\",\"prompt\":\"Name ICF Core Competency 3.\",\"answer\":\"Establishes and Maintains Agreements\",\"source\":\"Competency 3\",\"id\":\"q0035\"},{\"idx\":\"C3\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C3\",\"group\":\"competency\",\"tl\":\"تعریف (فارسی)\",\"prompt\":\"تعریف صلاحیت ۳ («قراردادها را ایجاد و حفظ می‌کند») را بگو.\",\"answer\":\"با مراجع و ذی‌نفعان مربوطه همراهی می‌کند تا توافقات واضحی در مورد رابطه کوچینگ، فرآیند، برنامه‌ها و اهداف ایجاد کنند. توافق‌نامه‌هایی را برای تعاملات کلی کوچینگ و همچنین برای هر جلسه کوچینگ ایجاد می‌کند.\",\"source\":\"صلاحیت ۳ — تعریف\",\"id\":\"q0036\"},{\"idx\":\"C3\",\"kind\":\"recall\",\"lang\":\"en\",\"topic\":\"C3\",\"group\":\"competency\",\"tl\":\"Definition (English)\",\"prompt\":\"State the ICF definition of Competency 3 (Establishes and Maintains Agreements).\",\"answer\":\"Partners with the client and relevant stakeholders to create clear agreements about the coaching relationship, process, plans and goals. Establishes agreements for the overall coaching engagement as well as those for each coaching session.\",\"source\":\"Competency 3 — definition\",\"id\":\"q0037\"},{\"idx\":\"؟\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C3\",\"group\":\"competency\",\"tl\":\"ترجمهٔ تعریف\",\"prompt\":\"این تعریف را به فارسی برگردان:\\nPartners with the client and relevant stakeholders to create clear agreements about the coaching relationship, process, plans and goals. Establishes agreements for the overall coaching engagement as well as those for each coaching session.\",\"answer\":\"با مراجع و ذی‌نفعان مربوطه همراهی می‌کند تا توافقات واضحی در مورد رابطه کوچینگ، فرآیند، برنامه‌ها و اهداف ایجاد کنند. توافق‌نامه‌هایی را برای تعاملات کلی کوچینگ و همچنین برای هر جلسه کوچینگ ایجاد می‌کند.\",\"source\":\"صلاحیت ۳ — تعریف\",\"id\":\"q0038\"},{\"idx\":\"C3\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C3\",\"group\":\"competency\",\"tl\":\"تعداد بندها\",\"prompt\":\"صلاحیت ۳ چند زیرصلاحیت دارد؟\",\"answer\":\"۱۲ بند (۳.۱ تا ۳.۱۲)\",\"source\":\"صلاحیت ۳\",\"id\":\"q0039\"},{\"idx\":\"C3\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C3\",\"group\":\"competency\",\"tl\":\"فهرست بندها\",\"prompt\":\"بندهای صلاحیت ۳ («قراردادها را ایجاد و حفظ می‌کند») را فهرست کن.\",\"answer\":\"۳.۱ — فلسفه کوچینگ خود را شرح می‌دهد و به وضوح تعریف می‌کند که کوچینگ چه چیزی هست و چه چیزی نیست، تا برای مراجعین بالقوه و ذی‌نفعان شفاف باشد.\\n۳.۲ — در مورد اینکه چه چیزی در رابطهٔ کوچینگ مناسب است و چه چیزی نیست، چه خدماتی ارائه می‌شود و چه خدماتی ارائه نمی‌شود، و نیز مسئولیت‌های مراجع و ذی‌نفعان مربوطه — از جمله تعهد به کار در راستای اهداف کوچینگ — به توافق می‌رسد.\\n۳.۳ — در مورد دستورالعمل‌ها و پارامترهای خاص رابطه کوچینگ مانند تدارکات، هزینه‌ها، برنامه‌ریزی، مدت زمان، خاتمه، محرمانگی و درج سایرین به توافق می‌رسد.\\n۳.۴ — با مراجع و ذی‌نفعان مربوطه برای ایجاد یک برنامه و اهداف کلی کوچینگ همراهی می‌کند.\\n۳.۵ — برای تعیین سازگاری بین مراجع و کوچ با مراجع همراه می‌شود.\\n۳.۶ — با مراجع همراهی می‌کند تا آنچه را که مراجع می‌خواهد در جلسه به دست آورد، شناسایی یا تأیید مجدد کند.\\n۳.۷ — با مراجع همراهی می‌کند تا تعریف کند مراجع باور دارد چه چیزی را باید بررسی یا حل کند تا به آنچه می‌خواهد در جلسه برسد.\\n۳.۸ — با مراجع همراه می‌شود تا معیارهای موفقیت را برای آنچه مراجع می‌خواهد در تعامل کوچینگ یا هر جلسه به دست آورد، تعریف یا تأیید مجدد کند.\\n۳.۹ — برای مدیریت زمان و تمرکز جلسه با مراجع همراهی می‌کند.\\n۳.۱۰ — جهت کوچینگ را همسو با نتیجهٔ مطلوب مراجع ادامه می‌دهد، تا زمانی که مراجع خلاف آن را نشان دهد.\\n۳.۱۱ — با مراجع همراهی می‌کند تا رابطه کوچینگ را به شکلی به سرانجام برساند که به مراجع و تجربه کوچینگ احترام گذاشته شود.\\n۳.۱۲ — در صورت لزوم توافق‌نامه کوچینگ را بازبینی می‌کند تا مطمئن شود رویکرد کوچینگ نیازهای مراجع را برآورده می‌سازد.\",\"source\":\"صلاحیت ۳\",\"id\":\"q0040\"},{\"idx\":\"C3\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"C3\",\"group\":\"competency\",\"tl\":\"بخش‌بندی\",\"prompt\":\"صلاحیت ۳ («قراردادها را ایجاد و حفظ می‌کند») در کدام بخش سند است؟\",\"options\":[\"الف. پایه و اساس\",\"ب. ایجاد رابطه مشترک\",\ ll\",\"lang\":\"en\",\"topic\":\"C6\",\"group\":\"competency\",\"tl\":\"Number → name\",\"prompt\":\"Name ICF Core Competency 6.\",\"answer\":\"Listens Actively\",\"source\":\"Competency 6\",\"id\":\"q0065\"},{\"idx\":\"C6\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C6\",\"group\":\"competency\",\"tl\":\"تعریف (فارسی)\",\"prompt\":\"تعریف صلاحیت ۶ («به طور فعال گوش می‌دهد») را بگو.\",\"answer\":\"بر هر چیزی که مراجع می‌گوید و نیز ناگفته‌های او متمرکز است تا آنچه مراجع در بستر سیستم‌های خود منتقل می‌کند را به طور کامل درک کند و از خودابرازگری مراجع حمایت کند.\",\"source\":\"صلاحیت ۶ — تعریف\",\"id\":\"q0066\"},{\"idx\":\"C6\",\"kind\":\"recall\",\"lang\":\"en\",\"topic\":\"C6\",\"group\":\"competency\",\"tl\":\"Definition (English)\",\"prompt\":\"State the ICF definition of Competency 6 (Listens Actively).\",\"answer\":\"Focuses on what the client is and is not saying to fully understand what is being communicated in the context of the client systems and to support client self-expression.\",\"source\":\"Competency 6 — definition\",\"id\":\"q0067\"},{\"idx\":\"؟\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C6\",\"group\":\"competency\",\"tl\":\"ترجمهٔ تعریف\",\"prompt\":\"این تعریف را به فارسی برگردان:\\nFocuses on what the client is and is not saying to fully understand what is being communicated in the context of the client systems and to support client self-expression.\",\"answer\":\"بر هر چیزی که مراجع می‌گوید و نیز ناگفته‌های او متمرکز است تا آنچه مراجع در بستر سیستم‌های خود منتقل می‌کند را به طور کامل درک کند و از خودابرازگری مراجع حمایت کند.\",\"source\":\"صلاحیت ۶ — تعریف\",\"id\":\"q0068\"},{\"idx\":\"C6\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C6\",\"group\":\"competency\",\"tl\":\"تعداد بندها\",\"prompt\":\"صلاحیت ۶ چند زیرصلاحیت دارد؟\",\"answer\":\"۶ بند (۶.۱ تا ۶.۶)\",\"source\":\"صلاحیت ۶\",\"id\":\"q0069\"},{\"idx\":\"C6\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C6\",\"group\":\"competency\",\"tl\":\"فهرست بندها\",\"prompt\":\"بندهای صلاحیت ۶ («به طور فعال گوش می‌دهد») را فهرست کن.\",\"answer\":\"۶.۱ — زمینه، هویت، محیط، تجربیات، ارزش‌ها و باورهای مراجع را در نظر می‌گیرد تا درک خود را از آنچه مراجع منتقل می‌کند افزایش دهد.\\n۶.۲ — برای اطمینان از وضوح و درک، گفته‌های مراجع را بازتاب می‌دهد یا خلاصه می‌کند.\\n۶.۳ — تشخیص می‌دهد چه زمانی چیزی بیشتر از آنچه مراجع می‌گوید وجود دارد و در آن پرس‌وجو می‌کند.\\n۶.۴ — به عواطف، تغییرات انرژی، نشانه‌های غیرکلامی و سایر رفتارهای مراجع توجه می‌کند، آن‌ها را تصدیق می‌کند و درباره‌شان کاوشگری می‌کند.\\n۶.۵ — کلمات، لحن صدا و زبان بدن مراجع را یکپارچه می‌کند تا معنای کامل آنچه منتقل می‌شود را تعیین کند.\\n۶.۶ — به روند رفتارها و احساسات مراجع در طول جلسات توجه می‌کند تا تم‌ها و الگوها را تشخیص دهد.\",\"source\":\"صلاحیت ۶\",\"id\":\"q0070\"},{\"idx\":\"C6\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"C6\",\"group\":\"competency\",\"tl\":\"بخش‌بندی\",\"prompt\":\"صلاحیت ۶ («به طور فعال گوش می‌دهد») در کدام بخش سند است؟\",\"options\":[\"الف. پایه و اساس\",\"ب. ایجاد رابطه مشترک\",\"ج. برقراری ارتباط مؤثر\",\"د. کاشتن یادگیری و رشد\"],\"answer\":\"ج. برقراری ارتباط مؤثر\",\"source\":\"صلاحیت ۶\",\"id\":\"q0071\"},{\"idx\":\"C6\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"C6\",\"group\":\"competency\",\"tl\":\"کدام در این صلاحیت نیست\",\"prompt\":\"کدام بند به صلاحیت ۶ («به طور فعال گوش می‌دهد») تعلق ندارد؟\",\"options\":[\"به روند رفتارها و احساسات مراجع در طول جلسات توجه می‌کند تا تم‌ها و الگوها را تشخیص دهد.\",\"محرمانگی اطلاعات مراجعین را بر اساس توافقات ذی‌نفعان و قوانین مربوطه حفظ می‌کند.\",\"کلمات، لحن صدا و زبان بدن مراجع را یکپارچه می‌کند تا معنای کامل آنچه منتقل می‌شود را تعیین کند.\",\"به عواطف، تغییرات انرژی، نشانه‌های غیرکلامی و سایر رفتارهای مراجع توجه می‌کند، آن‌ها را تصدیق می‌کند و درباره‌شان کاوشگری می‌کند.\"],\"answer\":\"محرمانگی اطلاعات مراجعین را بر اساس توافقات ذی‌نفعان و قوانین مربوطه حفظ می‌کند.\",\"source\":\"بند ۱.۵ متعلق به صلاحیت ۱ است\",\"id\":\"q0072\"},{\"idx\":\"C7\",\"kind\":\"recall\",\"lang\":\"fa\",\"topic\":\"C7\", ارد که در توافق سه‌جانبه بر آن توافق شده\",\"موضوع را به مراجع نگوید تا اعتماد خراب نشود\"],\"answer\":\"فقط چیزی را به اشتراک بگذارد که در توافق سه‌جانبه بر آن توافق شده\",\"source\":\"بند ۱.۵ و بند ۳.۳\",\"why\":\"بند ۱.۵ محرمانگی را «بر اساس توافقات ذی‌نفعان» تعریف می‌کند؛ مرز از پیش در توافق روشن می‌شود، نه در لحظه.\",\"badge\":null,\"id\":\"q0961\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — ethics\",\"prompt\":\"An organizational sponsor wants to know what the client said in sessions. What is the coach's best action?\",\"options\":[\"Give a summary of the session content\",\"Refuse and end the relationship\",\"Share only what the three-way agreement permits\",\"Keep it from the client so trust is not damaged\"],\"answer\":\"Share only what the three-way agreement permits\",\"source\":\"بند ۱.۵ و بند ۳.۳\",\"why\":\"بند ۱.۵ محرمانگی را «بر اساس توافقات ذی‌نفعان» تعریف می‌کند؛ مرز از پیش در توافق روشن می‌شود، نه در لحظه.\",\"badge\":null,\"id\":\"q0962\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — تعریف و مرزهای کوچینگ\",\"prompt\":\"مراجع از کوچ می‌خواهد برای انجام یک پروژهٔ دشوار به او توصیه بدهد. بهترین اقدام کوچ چیست؟\",\"options\":[\"توصیهٔ خواسته‌شده را ارائه دهد\",\"به مراجع بگوید از مدیر خود راهنمایی بگیرد\",\"بعد از جلسه چند راهکار برایش ایمیل کند\",\"تمایز کوچینگ و مشاوره را توضیح دهد و مراجع را به یافتن راهکارهای خودش دعوت کند\"],\"answer\":\"تمایز کوچینگ و مشاوره را توضیح دهد و مراجع را به یافتن راهکارهای خودش دعوت کند\",\"source\":\"بند ۱.۶ و بند ۷.۹\",\"why\":\"دادن توصیه، کوچ را به نقش مشاور می‌برد. بند ۱.۶ حفظ تمایز را الزامی می‌کند و بند ۷.۹ دعوت به ایده‌پردازی خود مراجع را.\",\"badge\":\"ICF\",\"id\":\"q0963\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — boundaries\",\"prompt\":\"A client asks the coach for advice on carrying out a difficult project. What is the coach's best action?\",\"options\":[\"Give the advice that was asked for\",\"Tell the client to ask their manager\",\"Email the client some strategies after the session\",\"Explain the coaching–consulting distinction and invite the client to find their own strategies\"],\"answer\":\"Explain the coaching–consulting distinction and invite the client to find their own strategies\",\"source\":\"بند ۱.۶ و بند ۷.۹\",\"why\":\"دادن توصیه، کوچ را به نقش مشاور می‌برد. بند ۱.۶ حفظ تمایز را الزامی می‌کند و بند ۷.۹ دعوت به ایده‌پردازی خود مراجع را.\",\"badge\":\"ICF\",\"id\":\"q0964\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — تعریف و مرزهای کوچینگ\",\"prompt\":\"مراجع جدیدی به سابقهٔ صنعتی کوچ ارزش می‌دهد و از او انتظار راهنمایی فنی دارد. بهترین اقدام چیست؟\",\"options\":[\"بر پایهٔ تجربهٔ صنعتی خود توصیه بدهد\",\"تمایز میان کوچینگ و مشاوره را شفاف کند\",\"مدارک و سابقهٔ صنعتی خود را ارائه دهد\",\"بر اساس تجربهٔ خود اهدافی برای مراجع پیشنهاد دهد\"],\"answer\":\"تمایز میان کوچینگ و مشاوره را شفاف کند\",\"source\":\"بند ۱.۶ و بند ۳.۱\",\"why\":\"شفاف‌سازی مرز، پیش‌شرط توافق سالم است؛ در غیر این صورت انتظار مراجع بر مبنای نقش اشتباه شکل می‌گیرد.\",\"badge\":\"ICF\",\"id\":\"q0965\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — boundaries\",\"prompt\":\"A new client values the coach's industry background and expects technical guidance. What is the best action?\",\"options\":[\"Advise based on the coach's industry experience\",\"Clarify the distinction between coaching and consulting\",\"Present the coach's industry credentials\",\"Suggest goals for the client based on the coach's experience\"],\"answer\":\"Clarify the distinction between coaching and consulting\",\"source\":\"بند ۱.۶ و بند ۳.۱\",\"why\":\"شفاف‌سازی مرز، پیش‌شرط توافق سالم است؛ در غیر این صورت انتظار مراجع بر مبنای نقش اشتباه شکل می‌گیرد.\",\"badge\":\"ICF\",\"id\":\"q0966\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — تعریف و مرزهای کوچینگ\",\"prompt\":\"تفاوت کلیدی کوچینگ و تسهیل‌گری چیست؟\",\"options\":[\"کوچینگ توصیهٔ مستقیم می‌دهد و تسهیل‌گری سؤال می‌پرسد\",\"کوچینگ فقط برای رشد فردی است و تسهیل‌گری فقط سازمانی\",\"کوچینگ همراهی با یک مراجع برای رسیدن به ظرفیت کامل اوست و تسهیل‌گری هدایت گفت‌وگوی گروهی\",\"کوچینگ نیاز به مجوز قانونی دارد و تسهیل‌گری ندارد\"],\"answer\":\"کوچینگ همراهی با یک مراجع برای رسیدن به ظرفیت کامل اوست و تسهیل‌گری هدایت گفت‌وگوی گروهی\",\"source\":\"تعریف کوچینگ ICF\",\"why\":\"تفاوت در واحد کار است: کوچینگ رابطهٔ همراهانه با مراجع، تسهیل‌گری هدایت فرایند گروه.\",\"badge\":\"ICF\",\"id\":\"q0967\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — boundaries\",\"prompt\":\"What is the key difference between coaching and facilitation?\",\"options\":[\"Coaching gives direct advice; facilitation asks questions\",\"Coaching is only for personal growth; facilitation only for organizations\",\"Coaching partners with a client to reach their full potential; facilitation guides group discussion\",\"Coaching requires a licence; facilitation does not\"],\"answer\":\"Coaching partners with a client to reach their full potential; facilitation guides group discussion\",\"source\":\"تعریف کوچینگ ICF\",\"why\":\"تفاوت در واحد کار است: کوچینگ رابطهٔ همراهانه با مراجع، تسهیل‌گری هدایت فرایند گروه.\",\"badge\":\"ICF\",\"id\":\"q0968\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — تعریف و مرزهای کوچینگ\",\"prompt\":\"تفاوت کوچینگ و روان‌درمانی در چیست؟\",\"options\":[\"کوچینگ فقط تلفنی انجام می‌شود\",\"روان‌درمانی به اختلالات و اغلب گذشته می‌پردازد و کوچینگ با مراجع کارآمد و رو به آینده کار می‌کند\",\"روان‌درمانی سؤال نمی‌پرسد\",\"کوچینگ نیاز به توافق‌نامه ندارد\"],\"answer\":\"روان‌درمانی به اختلالات و اغلب گذشته می‌پردازد و کوچینگ با مراجع کارآمد و رو به آینده کار می‌کند\",\"source\":\"بند ۱.۶\",\"why\":\"این تمایز، هم در بند ۱.۶ و هم در حیطهٔ «تعریف و مرزهای کوچینگ» آزمون ACC وزن دارد.\",\"badge\":null,\"id\":\"q0969\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — boundaries\",\"prompt\":\"How does coaching differ from psychotherapy?\",\"options\":[\"Coaching happens only by phone\",\"Therapy addresses disorders and often the past; coaching works with functioning clients toward the future\",\"Therapy does not ask questions\",\"Coaching needs no agreement\"],\"answer\":\"Therapy addresses disorders and often the past; coaching works with functioning clients toward the future\",\"source\":\"بند ۱.۶\",\"why\":\"این تمایز، هم در بند ۱.۶ و هم در حیطهٔ «تعریف و مرزهای کوچینگ» آزمون ACC وزن دارد.\",\"badge\":null,\"id\":\"q0970\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — تعریف و مرزهای کوچینگ\",\"prompt\":\"مراجع نشانه‌هایی بروز می‌دهد که ممکن است یک وضعیت سلامت روان مانع پیشرفت کوچینگ باشد. بهترین اقدام کوچ چیست؟\",\"options\":[\"جلسات را عمیق‌تر و طولانی‌تر کند\",\"موضوع را با مراجع مطرح کند و ارجاع به متخصص را در میان بگذارد\",\"بی‌سر‌و‌صدا رابطه را قطع کند\",\"خودش تشخیص بگذارد و برنامهٔ درمانی بدهد\"],\"answer\":\"موضوع را با مراجع مطرح کند و ارجاع به متخصص را در میان بگذارد\",\"source\":\"بند ۱.۷\",\"why\":\"بند ۱.۷ ارجاع «در صورت لزوم» را الزامی می‌کند. تشخیص گذاشتن خارج از صلاحیت کوچ است و قطع بی‌توضیح، ناقض احترام به مراجع.\",\"badge\":null,\"id\":\"q0971\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — boundaries\",\"prompt\":\"A client shows signs that a mental-health condition may be blocking progress in coaching. What is the coach's best action?\",\"options\":[\"Make sessions deeper and longer\",\"Raise it with the client and discuss a referral to a professional\",\"Quietly end the relationship\",\"Diagnose and design a treatment plan\"],\"answer\":\"Raise it with the client and discuss a referral to a professional\",\"source\":\"بند ۱.۷\",\"why\":\"بند ۱.۷ ارجاع «در صورت لزوم» را الزامی می‌کند. تشخیص گذاشتن خارج از صلاحیت کوچ است و قطع بی‌توضیح، ناقض احترام به مراجع.\",\"badge\":null,\"id\":\"q0972\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — صلاحیت‌ها و تکنیک‌ها\",\"prompt\":\"پس از دو ماه از یک تعامل شش‌ماهه، مراجع جلسات را از دست می‌دهد و اقدامات توافق‌شده را انجام نمی‌دهد. بهترین رویکرد کوچ چیست؟\",\"options\":[\"توافق را فوراً پایان دهد\",\"فعلاً موضوع را نادیده بگیرد و امید داشته باشد درست شود\",\"مراجع را به همکار دیگری ارجاع دهد\",\"با مراجع کاوش کند که آیا ادامهٔ کوچینگ درست است یا نه\"],\"answer\":\"با مراجع کاوش کند که آیا ادامهٔ کوچینگ درست است یا نه\",\"source\":\"بند ۳.۱۲\",\"why\":\"بند ۳.۱۲ بازبینی توافق را در صورت لزوم می‌خواهد و این کاوش را با مراجع، نه به‌جای او، انجام می‌دهد.\",\"badge\":\"ICF\",\"id\":\"q0973\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — competency\",\"prompt\":\"Two months into a six-month engagement, a client starts missing sessions and not following through. What is the coach's best approach?\",\"options\":[\"End the agreement immediately\",\"Ignore it for now and hope it corrects itself\",\"Refer the client to a colleague\",\"Explore with the client whether or not to continue the coaching\"],\"answer\":\"Explore with the client whether or not to continue the coaching\",\"source\":\"بند ۳.۱۲\",\"why\":\"بند ۳.۱۲ بازبینی توافق را در صورت لزوم می‌خواهد و این کاوش را با مراجع، نه به‌جای او، انجام می‌دهد.\",\"badge\":\"ICF\",\"id\":\"q0974\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — صلاحیت‌ها و تکنیک‌ها\",\"prompt\":\"مهم‌ترین کارکرد سکوت در کوچینگ چیست؟\",\"options\":[\"فراهم کردن فضا برای پردازش فکر خودِ مراجع\",\"این‌که کوچ و مراجع صدای هم را بهتر بشنوند\",\"فرصت دادن به کوچ برای ساختن سؤال بعدی\",\"فرصت دادن به مراجع برای یافتن پاسخ درست به سؤال کوچ\"],\"answer\":\"فراهم کردن فضا برای پردازش فکر خودِ مراجع\",\"source\":\"بند ۵.۷\",\"why\":\"سکوت به نفع پردازش مراجع است، نه راحتی کوچ. گزینهٔ «پاسخ درست» هم پیش‌فرض غلطی دارد: در کوچینگ پاسخ درستی از پیش وجود ندارد.\",\"badge\":\"ICF\",\"id\":\"q0975\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — competency\",\"prompt\":\"What is the most important function of silence in coaching?\",\"options\":[\"Giving the client space to process their own thinking\",\"Letting coach and client hear each other better\",\"Giving the coach time to form the next question\",\"Giving the client time to find the right answer to the coach's question\"],\"answer\":\"Giving the client space to process their own thinking\",\"source\":\"بند ۵.۷\",\"why\":\"سکوت به نفع پردازش مراجع است، نه راحتی کوچ. گزینهٔ «پاسخ درست» هم پیش‌فرض غلطی دارد: در کوچینگ پاسخ درستی از پیش وجود ندارد.\",\"badge\":\"ICF\",\"id\":\"q0976\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — صلاحیت‌ها و تکنیک‌ها\",\"prompt\":\"احترام گذاشتن به ادراکات مراجع، عنصر کلیدی کدام صلاحیت است؟\",\"options\":[\"اعتماد و امنیت را پرورش می‌دهد\",\"به طور فعال گوش می‌دهد\",\"رشد مراجع را تسهیل می‌کند\",\"قراردادها را ایجاد و حفظ می‌کند\"],\"answer\":\"اعتماد و امنیت را پرورش می‌دهد\",\"source\":\"بند ۴.۲ — صلاحیت ۴\",\"why\":\"بند ۴.۲ به‌صراحت احترام به هویت، ادراکات، سبک و زبان مراجع را در صلاحیت ۴ می‌گذارد.\",\"badge\":\"ICF\",\"id\":\"q0977\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — competency\",\"prompt\":\"Respecting the client's perceptions is a key element of which competency?\",\"options\":[\"Cultivates Trust and Safety\",\"Listens Actively\",\"Facilitates Client Growth\",\"Establishes and Maintains Agreements\"],\"answer\":\"Cultivates Trust and Safety\",\"source\":\"بند ۴.۲ — صلاحیت ۴\",\"why\":\"بند ۴.۲ به‌صراحت احترام به هویت، ادراکات، سبک و زبان مراجع را در صلاحیت ۴ می‌گذارد.\",\"badge\":\"ICF\",\"id\":\"q0978\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — صلاحیت‌ها و تکنیک‌ها\",\"prompt\":\"کوچ پیش از ورود به یک حوزهٔ حساس از مراجع اجازه می‌گیرد. هدف این درخواست چیست؟\",\"options\":[\"تا مراجع راه‌حل‌های احتمالی خود را بسنجد\",\"تا مراجع مضطرب شود و نتیجه سریع‌تر بیاید\",\"تا فضایی برای پذیرش بازخورد منفی کوچ ساخته شود\",\"تا فضای امنی ساخته شود که در آن مراجع حق انتخاب دارد\"],\"answer\":\"تا فضای امنی ساخته شود که در آن مراجع حق انتخاب دارد\",\"source\":\"صلاحیت ۴ و بند ۸.۳\",\"why\":\"اجازه‌گرفتن، هم‌زمان امنیت (صلاحیت ۴) و استقلال مراجع (صلاحیت ۸) را حفظ می‌کند.\",\"badge\":\"ICF\",\"id\":\"q0979\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — competency\",\"prompt\":\"A coach asks the client's permission before coaching in a new, sensitive area. What is the purpose?\",\"options\":[\"So the client can weigh their possible solutions\",\"To make the client anxious and speed up results\",\"To create room for the coach to receive negative feedback\",\"To create a safe space in which the client has a choice\"],\"answer\":\"To create a safe space in which the client has a choice\",\"source\":\"صلاحیت ۴ و بند ۸.۳\",\"why\":\"اجازه‌گرفتن، هم‌زمان امنیت (صلاحیت ۴) و استقلال مراجع (صلاحیت ۸) را حفظ می‌کند.\",\"badge\":\"ICF\",\"id\":\"q0980\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — صلاحیت‌ها و تکنیک‌ها\",\"prompt\":\"استفاده از استعاره در کدام موقعیت بیشترین کاربرد را دارد؟\",\"options\":[\"وقتی کوچ می‌خواهد مفهومی را آموزش دهد\",\"وقتی کوچ می‌خواهد پیامش را ملایم‌تر کند\",\"وقتی مراجع در جست‌وجوی وضوح یا معناست\",\"وقتی مراجع دیدگاه کوچ را نمی‌پذیرد\"],\"answer\":\"وقتی مراجع در جست‌وجوی وضوح یا معناست\",\"source\":\"صلاحیت ۷ — تعریف\",\"why\":\"استعاره ابزار بیداری آگاهی مراجع است (صلاحیت ۷)، نه ابزار آموزش یا متقاعدسازی از سوی کوچ.\",\"badge\":\"ICF\",\"id\":\"q0981\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — competency\",\"prompt\":\"Using metaphor as a coaching tool is most useful when:\",\"options\":[\"The coach wants to teach a concept\",\"The coach wants to soften a message\",\"The client is seeking clarity or meaning\",\"The client does not accept the coach's view\"],\"answer\":\"The client is seeking clarity or meaning\",\"source\":\"صلاحیت ۷ — تعریف\",\"why\":\"استعاره ابزار بیداری آگاهی مراجع است (صلاحیت ۷)، نه ابزار آموزش یا متقاعدسازی از سوی کوچ.\",\"badge\":\"ICF\",\"id\":\"q0982\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — صلاحیت‌ها و تکنیک‌ها\",\"prompt\":\"دستور کار (agenda) هر جلسهٔ کوچینگ را چه کسی تعیین می‌کند؟\",\"options\":[\"کوچ، بر اساس ارزیابی حرفه‌ای خود\",\"مراجع، با همراهی کوچ\",\"حامی مالی\",\"به‌طور مساوی و نصف‌به‌نصف\"],\"answer\":\"مراجع، با همراهی کوچ\",\"source\":\"بند ۳.۶ و بند ۳.۱۰\",\"why\":\"بندهای ۳.۶ و ۳.۱۰: کوچ در جهت نتیجهٔ مطلوب مراجع ادامه می‌دهد، مگر مراجع خلافش را نشان دهد.\",\"badge\":null,\"id\":\"q0983\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — competency\",\"prompt\":\"Who sets the agenda for each coaching session?\",\"options\":[\"The coach, based on professional judgement\",\"The client, in partnership with the coach\",\"The sponsor\",\"Both equally, fifty-fifty\"],\"answer\":\"The client, in partnership with the coach\",\"source\":\"بند ۳.۶ و بند ۳.۱۰\",\"why\":\"بندهای ۳.۶ و ۳.۱۰: کوچ در جهت نتیجهٔ مطلوب مراجع ادامه می‌دهد، مگر مراجع خلافش را نشان دهد.\",\"badge\":null,\"id\":\"q0984\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — صلاحیت‌ها و تکنیک‌ها\",\"prompt\":\"مراجع هدفی انتخاب می‌کند که کوچ آن را نادرست می‌داند. بهترین اقدام چیست؟\",\"options\":[\"هدف را تغییر دهد و هدف بهتری پیشنهاد کند\",\"بدون اظهار نظر ادامه دهد\",\"مشاهدهٔ خود را بدون چسبندگی به اشتراک بگذارد و انتخاب را به مراجع بسپارد\",\"جلسه را متوقف کند\"],\"answer\":\"مشاهدهٔ خود را بدون چسبندگی به اشتراک بگذارد و انتخاب را به مراجع بسپارد\",\"source\":\"بند ۷.۱۱ و بند ۸.۳\",\"why\":\"بند ۷.۱۱ اشتراک مشاهده «بدون چسبندگی» را مجاز می‌کند و بند ۸.۳ استقلال مراجع را حفظ می‌کند. سکوت کامل هم بندی را اجرا نمی‌کند.\",\"badge\":null,\"id\":\"q0985\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"en\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"Exam style — competency\",\"prompt\":\"A client chooses a goal the coach believes is wrong. What is the best action?\",\"options\":[\"Replace it and propose a better goal\",\"Continue without comment\",\"Share the observation without attachment and leave the choice to the client\",\"Stop the session\"],\"answer\":\"Share the observation without attachment and leave the choice to the client\",\"source\":\"بند ۷.۱۱ و بند ۸.۳\",\"why\":\"بند ۷.۱۱ اشتراک مشاهده «بدون چسبندگی» را مجاز می‌کند و بند ۸.۳ استقلال مراجع را حفظ می‌کند. سکوت کامل هم بندی را اجرا نمی‌کند.\",\"badge\":null,\"id\":\"q0986\"},{\"idx\":\"EX\",\"kind\":\"mcq\",\"lang\":\"fa\",\"topic\":\"EXAM\",\"group\":\"exam\",\"tl\":\"سبک آزمون — صلاحیت‌ها و تکنیک‌ها\",\"prompt\":\"کوچ متوجه افت محسوس انرژی مراجع در میانهٔ جلسه می‌شود. مطابق صلاحیت‌ها بهترین کار چیست؟\",\"options\":[\"موضوع را عوض کند تا حال مراجع بهتر شود\",\"آن را نام ببرد، تصدیق کند و از مراجع دعوت به کاوش کند\",\"آن را نادیده بگیرد و به برنامه بچسبد\",\"دلیلش را برای مراجع تحلیل و تفسیر کند\"],\"answer\":\"آن را نام ببرد، تصدیق کند و از مراجع دعوت به کاوش کند\",\"source\":\"بند ۶.۴\",\"why\":\"بند ۶.۴ سه فعل را کنار هم می‌گذارد: توجه، تصدیق، کاوشگری. تفسیر کردن به‌جای مراجع، از این بند فراتر می‌رود.\",\"badge\":null,\"id\":\"q0987\"},{\"idx\":\"EX\",\"kind\":\"mcq\ function quotaLeft() {
  return state.quota ? Math.max(0, state.quota - state.doneToday) : Infinity;
}

function pick() {
  if (quotaLeft() <= 0) return null;
  var d = duePool();if (!d.length) return null;
  d.sort(function (a, b) {
    return peek(a.id).box - peek(b.id).box || Math.random() - .5;
  });
  var head = d.slice(0, Math.max(6, Math.ceil(d.length * .2)));
  return head[Math.floor(Math.random() * head.length)];
}

/* ═══ render ═══ */
function chips(el, list, dim, onPick) {
  el.innerHTML = '';
  list.forEach(function (o) {
    var b = document.createElement('button');
    b.className = 'chip';b.textContent = o.label;
    b.setAttribute('aria-pressed', String(dim === 'quota' ? state.quota === o.k : filters[dim] === o.k));
    b.onclick = function () {
      return onPick(o.k);
    };el.appendChild(b);
  });
}
function renderFilters() {
  chips(document.getElementById('fTopic'), TOPICS, 'topic', function (k) {
    filters.topic = k;next();paint();
  });
  chips(document.getElementById('fKind'), KINDS, 'kind', function (k) {
    filters.kind = k;next();paint();
  });
  chips(document.getElementById('fQuota'), QUOTAS, 'quota', function (k) {
    state.quota = k;save();next();paint();
  });
}
function renderSpine() {
  var p = pool(),
      counts = [0, 0, 0, 0, 0, 0];
  p.forEach(function (q) {
    counts[Math.min(state.cards[q.id] ? state.cards[q.id].box : 0, 5)]++;
  });
  var max = Math.max.apply(Math, [1].concat(counts));
  var labels = ['تازه', '۱ روز', '۳ روز', '۷ روز', '۱۴ روز', '۲۸ روز'];
  document.getElementById('spine').innerHTML = counts.map(function (c, i) {
    return '\n    <div class="box ' + (i === 0 && c ? 'due' : '') + '">\n      <div class="bar"><div class="fill" style="height:' + Math.round(c / max * 100) + '%"></div></div>\n      <div class="lab">' + labels[i] + '</div><div class="cnt">' + fa(c) + '</div>\n    </div>';
  }).join('');
  var dueN = duePool().length;
  var upcoming = pool().map(function (q) {
    return state.cards[q.id];
  }).filter(function (r) {
    return r && r.due > today();
  }).map(function (r) {
    return r.due;
  }).sort(function (a, b) {
    return a - b;
  })[0];
  document.getElementById('spineNote').innerHTML = 'امروز <b>' + fa(dueN) + '</b> کارت موعددار' + (upcoming ? ' · مرحلهٔ بعد <b>' + jalaliFromDayNum(upcoming) + '</b>' : '');
  document.getElementById('doneToday').textContent = fa(state.doneToday);
  document.getElementById('leftToday').textContent = state.quota ? fa(quotaLeft()) : 'بی‌حد';
  document.getElementById('ver').textContent = fa(BANK.length) + ' CARDS';
}
var esc = function esc(s) {
  return String(s).replace(/[&<>]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c];
  });
};

function renderCard() {
  var stage = document.getElementById('stage');
  if (!current) {
    var over = quotaLeft() <= 0;
    stage.innerHTML = '<div class="card empty"><div class="big">' + (over ? fa(state.doneToday) : fa(pool().length)) + '</div>\n      <p>' + (over ? 'سهمیهٔ امروز تمام شد. می‌توانی سهمیه را بالا ببری یا فردا برگردی.' : 'در این بخش کارت موعدداری برای امروز نمانده.<br>فیلتر را عوض کن یا فردا برگرد.') + '</p></div>';
    return;
  }
  var q = current,
      r = peek(q.id);
  var pl = !hasFa(q.prompt),
      al = !hasFa(q.answer);
  var idx = q.idx || '—';
  var ask = idx === '؟';

  var h = '<div class="card"><div class="chead"><div>\n      <div class="idx' + (ask ? ' ask' : '') + '">' + esc(idx) + '</div>\n      <div class="tl">' + esc(q.tl) + (q.badge ? '<span class="badge">' + esc(q.badge) + '</span>' : '') + '</div>\n    </div><div class="meta">BOX ' + fa(r.box) + '<br>SEEN ' + fa(r.seen) + '</div></div>\n    <div class="rail"><span class="node q"></span>\n      <div class="prompt' + (pl ? ' ltr' : '') + '">' + esc(q.prompt) + '</div></div>';

  if (q.kind === 'mcq') {
    h += '<div class="opts">' + q.options.map(function (o, i) {
      return '<button class="opt' + (hasFa(o) ? '' : ' en') + '" data-i="' + i + '">' + esc(o) + '</button>';
    }).join('') + '</div>';
  } else if (!revealed) {
    h += '<div class="pause"><span class="dash"></span><span class="word">مکث</span><span class="dash"></span></div>\n        <div class="acts"><button class="btn go" id="rev">نمایش پاسخ<kbd>space</kbd></button></div>';
  }

  if (revealed) {
    h += '<div class="pause"><span class="dash"></span><span class="word">پاسخ</span><span class="dash"></span></div>\n      <div class="ablock"><span class="node a"></span>\n      <div class="atext' + (al ? ' ltr' : '') + '">' + esc(q.answer) + '</div>\n      ' + (q.why ? '<div class="why">' + esc(q.why) + '</div>' : '') + '\n      <div class="src">' + esc(q.source) + '</div>\n      ' + (lastGrade !== null ? '<div class="nextdue">مرور بعدی: ' + (lastGrade ? jalaliFromDayNum(rec(q.id).due) : 'همین امروز') + '</div>' : '') + '\n      </div>';
    if (q.kind !== 'mcq') {
      h += '<div class="acts">\n        <button class="btn again" data-g="0">بلد نبودم<kbd>1</kbd></button>\n        <button class="btn known" data-g="1">بلد بودم<kbd>2</kbd></button></div>';
    } else if (answered) {
      h += '<div class="acts"><button class="btn go" data-g="next">کارت بعدی<kbd>space</kbd></button></div>';
    }
  }
  h += '</div>';
  stage.innerHTML = h;

  var rev = document.getElementById('rev');
  if (rev) rev.onclick = function () {
    revealed = true;renderCard();
  };
  stage.querySelectorAll('.opt').forEach(function (b) {
    return b.onclick = function () {
      return chooseOpt(+b.dataset.i);
    };
  });
  stage.querySelectorAll('[data-g]').forEach(function (b) {
    return b.onclick = function () {
      return b.dataset.g === 'next' ? next() : grade(+b.dataset.g);
    };
  });
}

function chooseOpt(i) {
  if (answered) return;
  var q = current,
      ok = q.options[i] === q.answer;
  answered = true;revealed = true;
  applyGrade(ok ? 1 : 0);
  renderCard();
  document.querySelectorAll('.opt').forEach(function (b, j) {
    b.disabled = true;
    if (q.options[j] === q.answer) b.classList.add('right');else if (j === i) b.classList.add('wrong');
  });
}
function applyGrade(g) {
  var r = rec(current.id);r.seen++;
  if (g) {
    r.box = Math.min(r.box + 1, 5);r.due = today() + INTERVALS[r.box - 1];
  } else {
    r.box = 0;r.due = today();
  }
  state.doneToday++;lastGrade = g;
  renderSpine();save();
}
function grade(g) {
  applyGrade(g);next();
}
function next() {
  revealed = false;answered = false;lastGrade = null;current = pick();renderCard();
}
function paint() {
  renderFilters();renderSpine();
}

/* ═══ chrome ═══ */
function toast(msg, color) {
  var t = document.getElementById('toast');
  t.textContent = msg;t.style.color = color || 'var(--aqua)';t.classList.add('on');
  clearTimeout(toast._t);toast._t = setTimeout(function () {
    return t.classList.remove('on');
  }, 2600);
}
var STORE_FA = { local: 'حافظهٔ مرورگر', session: 'حافظهٔ موقت این نشست', memory: 'فقط تا بستن صفحه' };
document.getElementById('save').onclick = function () {
  var ok = save(),
      n = fa(Object.keys(state.cards).length);
  toast(ok ? 'ذخیره شد — ' + n + ' کارت در ' + STORE_FA[store] : 'این مرورگر اجازهٔ ذخیره نمی‌دهد — از «پشتیبان» استفاده کن', ok ? 'var(--aqua)' : 'var(--clay)');
};
document.getElementById('reset').onclick = function () {
  if (!window.confirm('همهٔ جعبه‌ها صفر می‌شوند. مطمئنی؟')) return;
  state = { cards: {}, doneToday: 0, day: today(), quota: state.quota };
  save();paint();next();toast('پیشرفت پاک شد', 'var(--clay)');
};

/* ── backup: a text code that survives any browser ── */
function b64enc(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function b64dec(str) {
  return decodeURIComponent(escape(atob(str)));
}
document.getElementById('backup').onclick = function () {
  var box = document.getElementById('backupBox');
  if (!box.hidden) {
    box.hidden = true;return;
  }
  document.getElementById('backupText').value = b64enc(JSON.stringify(state));
  box.hidden = false;
  document.getElementById('backupText').select();
};
document.getElementById('copyBackup').onclick = function () {
  var ta = document.getElementById('backupText');
  ta.select();ta.setSelectionRange(0, 999999);
  var ok = false;
  try {
    ok = document.execCommand('copy');
  } catch (e) {}
  if (!ok && navigator.clipboard) {
    navigator.clipboard.writeText(ta.value);ok = true;
  }
  toast(ok ? 'کد پشتیبان کپی شد — جایی نگهش دار' : 'کپی نشد؛ دستی انتخاب و کپی کن', ok ? 'var(--aqua)' : 'var(--clay)');
};
document.getElementById('restoreBackup').onclick = function () {
  var v = document.getElementById('backupText').value.trim();
  if (!v) return toast('اول کد پشتیبان را اینجا بچسبان', 'var(--clay)');
  try {
    var obj = JSON.parse(b64dec(v));
    if (!obj || typeof obj !== 'object' || !obj.cards) throw 0;
    state = Object.assign({ cards: {}, doneToday: 0, day: today(), quota: 40 }, obj);
    save();paint();next();
    document.getElementById('backupBox').hidden = true;
    toast('بازگردانی شد — ' + fa(Object.keys(state.cards).length) + ' کارت', 'var(--aqua)');
  } catch (e) {
    toast('این کد معتبر نیست', 'var(--clay)');
  }
};
document.addEventListener('keydown', function (e) {
  if (document.getElementById('help').hidden === false) return;
  if (e.key === ' ' || e.code === 'Space') {
    if (!current) return;
    if (!revealed && current.kind !== 'mcq') {
      e.preventDefault();revealed = true;renderCard();
    } else if (revealed && current.kind === 'mcq' && answered) {
      e.preventDefault();next();
    }
  }
  if (revealed && current && current.kind !== 'mcq') {
    if (e.key === '1') grade(0);if (e.key === '2') grade(1);
  }
});
function showTab(which) {
  var d = document.getElementById('drill'),
      h = document.getElementById('help');
  d.hidden = which !== 'drill';h.hidden = which !== 'help';
  document.getElementById('tabDrill').setAttribute('aria-selected', String(which === 'drill'));
  document.getElementById('tabHelp').setAttribute('aria-selected', String(which === 'help'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.getElementById('tabDrill').onclick = function () {
  return showTab('drill');
};
document.getElementById('tabHelp').onclick = function () {
  renderHelp();showTab('help');
};

/* ═══ help ═══ */
function renderHelp() {
  var counts = {};
  BANK.forEach(function (q) {
    return counts[q.group] = (counts[q.group] || 0) + 1;
  });
  var icfN = BANK.filter(function (q) {
    return q.badge;
  }).length;
  var storeName = ({ local: 'حافظهٔ مرورگر — پیشرفت پس از بستن هم می‌ماند',
    session: 'حافظهٔ موقت — فقط تا وقتی این تب باز است',
    memory: 'بدون ذخیره‌سازی — حتماً از «پشتیبان» استفاده کن' })[store] || 'نامشخص';
  document.getElementById('help').innerHTML = '\n<h2>این چیست</h2>\n<p>یک بانک <b>' + fa(BANK.length) + '</b> سؤالی روی سند صلاحیت‌های اصلی ICF، به‌همراه یک زمان‌بند مرور فاصله‌دار.\nهدفش این است که هر صلاحیت، هر بند، شمارهٔ دقیقش و معنای هر اصطلاح واژه‌نامه را از چند مسیر مختلف در حافظه تثبیت کند.</p>\n\n<h2>سه لایهٔ ساختار</h2>\n<h3>۱. لایهٔ داده</h3>\n<p>هر بند سند به یک رکورد شکسته شده: شمارهٔ صلاحیت، شمارهٔ بند، متن انگلیسی، متن فارسی، و واژهٔ کلیدی هر زبان\nبرای ساخت جای خالی. متن فارسی پی‌دی‌اف مشکل حروف چسبان داشت (مثلاً «صالحیت» به‌جای «صلاحیت»)؛ همه تصحیح شده است.</p>\n<h3>۲. لایهٔ تولید</h3>\n<p>سؤال‌ها دستی نوشته نشده‌اند. هر رکورد در چند قالب ریخته می‌شود، پس هیچ بندی از قلم نمی‌افتد.\nنُه قالب روی هر زیرصلاحیت اجرا می‌شود:</p>\n<ol>\n<li>شماره ← متن فارسی</li>\n<li>شماره ← متن انگلیسی</li>\n<li>متن ← شمارهٔ کامل (کدام صلاحیت و کدام بند)</li>\n<li>ترجمه: انگلیسی به فارسی</li>\n<li>ترجمه: فارسی به انگلیسی</li>\n<li>جای خالی انگلیسی</li>\n<li>جای خالی فارسی</li>\n<li>چهارگزینه‌ای: این بند از کدام صلاحیت است؟</li>\n<li>چهارگزینه‌ای: شمارهٔ دقیق این بند کدام است؟</li>\n</ol>\n<p>قالب‌های ۳ و ۹ همان چیزی است که خواستی: از متن به شماره، و از شماره به متن، در هر دو جهت.\nبرای هر صلاحیت هم نُه سؤال دیگر ساخته می‌شود (نام، تعریف، تعداد بندها، بخش، فهرست بندها، و «کدام بند به این صلاحیت تعلق ندارد»).</p>\n<h3>۳. لایهٔ زمان‌بندی</h3>\n<p>هر کارت در یکی از شش جعبه است. «بلد بودم» یک جعبه بالا می‌برد و فاصلهٔ مرور را بیشتر می‌کند؛\n«بلد نبودم» به جعبهٔ صفر برمی‌گرداند و همان روز دوباره می‌آورد.</p>\n<table><thead><tr><th>جعبه</th><th>فاصله تا مرور بعد</th></tr></thead><tbody>\n<tr><td>۰</td><td>همین امروز</td></tr><tr><td>۱</td><td>۱ روز</td></tr><tr><td>۲</td><td>۳ روز</td></tr>\n<tr><td>۳</td><td>۷ روز</td></tr><tr><td>۴</td><td>۱۴ روز</td></tr><tr><td>۵</td><td>۲۸ روز</td></tr>\n</tbody></table>\n<p>«کارت موعددار» یعنی کارتی که تاریخ مرورش رسیده است. تاریخ‌ها شمسی نمایش داده می‌شوند:\nزیر نوارها تاریخ مرحلهٔ بعد، و پس از هر پاسخ، تاریخ مرور بعدی همان کارت.</p>\n\n<h2>ترکیب بانک</h2>\n<table><thead><tr><th>دسته</th><th>تعداد</th></tr></thead><tbody>\n<tr><td>زیرصلاحیت‌ها</td><td>' + fa(counts.sub || 0) + '</td></tr>\n<tr><td>واژه‌نامه</td><td>' + fa(counts.glossary || 0) + '</td></tr>\n<tr><td>صلاحیت‌ها</td><td>' + fa(counts.competency || 0) + '</td></tr>\n<tr><td>سبک آزمون</td><td>' + fa(counts.exam || 0) + '</td></tr>\n<tr><td>بخش‌ها و نقشهٔ سند</td><td>' + fa((counts.section || 0) + (counts.map || 0)) + '</td></tr>\n</tbody></table>\n\n<h2>برچسب ICF روی سؤال‌ها</h2>\n<p><b>' + fa(icfN) + '</b> سؤال برچسب <code>ICF</code> دارند. معنای این برچسب:\n<b>نکتهٔ دانشی</b> آن سؤال از مجموعهٔ نمونه‌سؤال‌های رسمی خود فدراسیون جهانی کوچینگ برداشته شده است.</p>\n<div class="callout"><div class="ct">صادقانه</div>\n<p>متن این سؤال‌ها <b>عیناً</b> متن ICF نیست. متن رسمی، محتوای دارای حق نشر است؛ بنابراین سؤال‌ها را\nبا عبارت‌بندی مستقل و ترجمهٔ فارسی بازنویسی کرده‌ام و فقط موضوع و پاسخ درست را حفظ کرده‌ام.\nبرای دیدن متن اصلی، مستقیم به صفحهٔ نمونه‌سؤال‌های ICF مراجعه کن:</p>\n<p><a href="https://coachingfederation.org/resource/acc-exam-sample-questions/" target="_blank" rel="noopener">coachingfederation.org/resource/acc-exam-sample-questions</a></p></div>\n<p>بقیهٔ سؤال‌های «سبک آزمون» را خودم بر اساس نقشهٔ رسمی محتوای آزمون نوشته‌ام؛ برچسب ICF ندارند.</p>\n\n<h2>آزمون ACC واقعاً چه شکلی است</h2>\n<p>این را در جست‌وجو از سایت خود ICF بیرون کشیدم، چون بر انتخاب استراتژی مطالعه‌ات اثر می‌گذارد:</p>\n<ul>\n<li><b>۶۰ سؤال چهارگزینه‌ای</b> با یک پاسخ درست؛ نمرهٔ منفی ندارد.</li>\n<li>۹۰ دقیقه، دو بخش ۳۰ سؤالی (هر بخش ۳۹ دقیقه) با یک استراحت ۱۰ دقیقه‌ای.</li>\n<li>نمره مقیاس‌شده بین ۲۰۰ تا ۶۰۰؛ حد قبولی <b>۴۶۰</b>.</li>\n<li>وزن محتوا: اخلاق کوچینگ <b>۳۰٪</b> · تعریف و مرزهای کوچینگ <b>۳۰٪</b> · صلاحیت‌ها، استراتژی‌ها و تکنیک‌ها <b>۴۰٪</b>.</li>\n<li>آزمون ACC دانش‌محور است، نه سنجش موقعیتی. آن آزمونِ ۷۸ سؤالیِ «بهترین و بدترین گزینه» مربوط به PCC و MCC است.</li>\n</ul>\n<div class="callout"><div class="ct">دو هشدار مهم</div>\n<p><b>یک — نسخهٔ سند.</b> صفحهٔ رسمی ACC می‌گوید آزمون بر پایهٔ صلاحیت‌های <b>۲۰۱۹</b> و منشور اخلاقی <b>۲۰۲۰</b> است.\nسندی که تو فرستادی نسخهٔ ۲۰۲۵ است (که واژه‌نامه هم دارد). بدنهٔ هشت صلاحیت یکی است، اما عبارت‌بندی بعضی بندها تفاوت دارد.\nاگر هدفت آزمون ACC است، نسخهٔ مرجع را با مؤسسهٔ آموزشی‌ات چک کن.</p>\n<p><b>دو — وزن‌ها.</b> حفظ کردن شمارهٔ بندها در خود آزمون ACC تقریباً پرسیده نمی‌شود؛ ۶۰٪ آزمون اخلاق و مرزهاست.\nحفظ شماره‌ها برای دورهٔ آموزشی و مصاحبهٔ منتورکوچینگ ارزش دارد، اما اگر قبولی در آزمون اولویت اول است،\nسهم بیشتری از وقتت باید روی منشور اخلاقی و تمایز کوچینگ از درمان و مشاوره برود.</p></div>\n\n<h2>پیشنهاد استفاده</h2>\n<ul>\n<li>سهمیهٔ روزانه را روی ۲۰ یا ۴۰ کارت بگذار. بی‌حد گذاشتن باعث می‌شود همه‌چیز یک روز وارد چرخه شود و فردا غیرقابل‌مدیریت.</li>\n<li>هر روز اول کارت‌های موعددار را تمام کن، بعد دستهٔ تازه باز کن.</li>\n<li>با فیلتر «صلاحیت ۱» شروع کن و هر چند روز یک صلاحیت اضافه کن. واژه‌نامه را بعد از صلاحیت‌ها شروع کن.</li>\n<li>جواب پاسخ‌کوتاه را <b>بلند بگو</b> بعد باز کن. خواندن جواب بدون تلاش برای یادآوری، بی‌اثر است.</li>\n<li>در سؤال‌های تستی، منبع و توضیح زیر پاسخ را بخوان؛ بازخورد فوری بخش مهمی از اثر این روش است.</li>\n</ul>\n\n<h2>ذخیره‌سازی و کلیدها</h2>\n<p>وضعیت فعلی: <b>' + storeName + '</b>.</p>\n<p>این فایل در هر مرورگری باز می‌شود — از جمله مرورگر داخلی تلگرام و اینستاگرام، و بدون اینترنت.\nفونت وزیرمتن داخل خود فایل جاسازی شده، پس به هیچ سروری وصل نمی‌شود و فیلترینگ رویش اثر ندارد.</p>\n<p>ذخیره‌سازی سه لایه دارد و خودش بهترین لایهٔ در دسترس را انتخاب می‌کند:</p>\n<ol>\n<li><b>حافظهٔ مرورگر</b> — حالت عادی؛ پیشرفت پس از بستن صفحه هم می‌ماند.</li>\n<li><b>حافظهٔ موقت نشست</b> — وقتی مرورگر حالت اول را سد کرده باشد؛ تا وقتی تب باز است می‌ماند.</li>\n<li><b>بدون ذخیره</b> — در مرورگرهای خیلی محدود یا حالت ناشناس.</li>\n</ol>\n<p>پیشرفت پس از هر پاسخ، و همچنین هنگام بستن یا پنهان شدن صفحه، خودکار ذخیره می‌شود.\nدکمهٔ «ذخیره در مرورگر» همان کار را دستی انجام می‌دهد و می‌گوید در کدام لایه ذخیره شد.</p>\n<h3>دکمهٔ پشتیبان</h3>\n<p>مرورگرهای داخل اپلیکیشن‌ها (مثل تلگرام) گاهی حافظه را بدون اطلاع پاک می‌کنند.\n«پشتیبان» یک کد متنی از کل پیشرفتت می‌سازد که می‌توانی کپی کنی و مثلاً برای خودت در تلگرام بفرستی.\nهر وقت لازم شد، همان کد را در همان کادر بچسبان و «بازگردانی از کد» را بزن.\nاگر لایهٔ ذخیره‌سازی «بدون ذخیره» بود، حتماً آخر هر جلسه یک پشتیبان بگیر.</p>\n<p>«بازنشانی» همهٔ جعبه‌ها را صفر می‌کند، تأیید می‌گیرد، و برگشت‌پذیر نیست — مگر این‌که کد پشتیبان داشته باشی.</p>\n<p>روی صفحه‌کلید: <code>space</code> نمایش پاسخ یا کارت بعدی · <code>1</code> بلد نبودم · <code>2</code> بلد بودم.</p>\n<div class="hr"></div>\n<p style="color:var(--muted);font-size:13px">فایل Anki جداگانه همین بانک را با برچسب‌های\n<code>ICF_2025</code>، شمارهٔ صلاحیت، و <code>ICF_official_topic</code> برای سؤال‌های برچسب‌دار در بر دارد.</p>';
}
