<div class="awakening" aria-live="polite"><h2>از کنجکاوی، به آگاهی</h2><p>در انگلیسی، مراقبت؛ در فارسی، کاویدن.</p><p>بدون کاویدن، سطحی می‌مانیم؛ بدون مراقبت، به بازجویی می‌رسیم.</p></div>

/span></small>"}, {"label": "۴‌ج", "title": "صلاحیت ۵ · حفظ حضور · زیرصلاحیت ۲", "bullets": ["در طول فرایند کوچینگ کنجکاوی خود را نشان می‌دهد", "ذهنیتِ صلاحیت ۲، اینجا دیده می‌شود"], "headerReference": "<small class=\"reference heading-reference\"><span>در طول فرایند کوچینگ کنجکاوی خود را نشان می‌دهد.</span><span lang=\"en\" dir=\"ltr\">Demonstrates curiosity during the coaching process.</span></small>"}, {"label": "۵", "title": "نقشه چهار و پایه اساس کوچینگ، کنجکاوی کجا هست و کجا نیست", "bullets": ["<strong>پایه و اساس:</strong> صلاحیت ۱ (عمل اخلاقی) و صلاحیت ۲ (طرز فکر کوچینگ) ← ۲ بار، هر دو در صلاحیت ۲", "<strong>خلق مشترک رابطه:</strong> صلاحیت ۳ (ایجاد و حفظ توافق‌ها)، صلاحیت ۴ (پرورش اعتماد و امنیت)، صلاحیت ۵ (حفظ حضور) ← ۱ بار، در صلاحیت ۵", "<strong>برقراری ارتباط مؤثر:</strong> صلاحیت ۶ (گوش دادن فعال) و صلاحیت ۷ (بیداری آگاهی) ← ۰ بار", "<strong>کاشتن یادگیری و رشد:</strong> صلاحیت ۸ (تسهیل رشد مراجع) ← ۰ بار", "جمع کل: ۳ بار؛ هر سه در دو بخش نخست"]}, {"label": "میان‌راه", "title": "از شمارش واژه به کاوش سه لایه", "bullets": ["زیرصلاحیت ۲٫۹ کنجکاوی را در سه سطح می‌خواهد: خود، مراجع و فرایند", "این سه سطح در صلاحیت ۲ نمی‌مانند؛ هرکدام در صلاحیت‌های دیگر ادامه پیدا می‌کنند", "واژه‌ی کنجکاوی فقط سه بار آمده، اما رفتارش در زیرصلاحیت‌های بسیاری حاضر است", "برای دیدنش، به جای شمردن کلمه، لایه‌به‌لایه می‌کاویم"]}, {"label": "۶", "title": "لایه‌ی یک · کنجکاوی نسبت به خود", "bullets": ["<strong>۲٫۳ عمل بازتابی:</strong> کوچ مدام کار خودش را بازبینی می‌کند<small class=\"reference\"><span>بازتاب را به‌طور مستمر برای تقویت کوچینگ خود ایجاد می‌کند.</span><span lang=\"en\" dir=\"ltr\">Develops an ongoing reflective practice to enhance one's coaching.</span></small>", "<strong>۲٫۴ سوگیری، زمینه و فرهنگ:</strong> می‌داند نگاهش بی‌طرف نیست و به این تأثیر گشوده است<small class=\"reference\"><span>از تأثیر سوگیری‌ها، زمینه و فرهنگ بر خود و دیگران آگاه است و در برابر آن گشوده است.</span><span lang=\"en\" dir=\"ltr\">Remains aware of and open to the influence of biases, context and culture on self and others.</span></small>", "<strong>۲٫۵ خودآگاهی و شهود:</strong> آنچه در خودش حس می‌کند را به نفع مراجع به کار می‌گیرد<small class=\"reference\"><span>از آگاهی از خود و شهود خود برای سود رساندن به مراجعین استفاده می‌کند.</span><span lang=\"en\" dir=\"ltr\">Uses awareness of self and one's intuition to benefit clients.</span></small>", "بدون این لایه، سوگیری کوچ جای کنجکاوی را می‌گیرد"], "pages": [["<strong>۲٫۳ عمل بازتابی:</strong> کوچ مدام کار خودش را بازبینی می‌کند<small class=\"reference\"><span>بازتاب را به‌طور مستمر برای تقویت کوچینگ خود ایجاد می‌کند.</span><span lang=\"en\" dir=\"ltr\">Develops an ongoing reflective practice to enhance one's coaching.</span></small>"], ["<strong>۲٫۴ سوگیری، زمینه و فرهنگ:</strong> می‌داند نگاهش بی‌طرف نیست و به این تأثیر گشوده است<small class=\"reference\"><span>از تأثیر سوگیری‌ها، زمینه و فرهنگ بر خود و دیگران آگاه است و در برابر آن گشوده است.</span><span lang=\"en\" dir=\"ltr\">Remains aware of and open to the influence of biases, context and culture on self and others.</span></small>"], ["<strong>۲٫۵ خودآگاهی و شهود:</strong> آنچه در خودش حس می‌کند را به نفع مراجع به کار می‌گیرد<small class=\"reference\"><span>از آگاهی از خود و شهود خود برای سود رساندن به مراجعین استفاده می‌کند.</span><span lang=\"en\" dir=\"ltr\">Uses awareness of self and one's intuition to benefit clients.</span></small>", "بدون این لایه، سوگیری کوچ جای کنجکاوی را می‌گیرد"]]}, {"label": "۷", "title": "لایه‌ی دو · کنجکاوی نسبت به مراجع", "bullets": ["<strong>۴٫۱ درک در بستر:</strong> هویت، محیط، تجربه‌ها، ارزش‌ها و باورهای مراجع را کاوش می‌کند تا درک بهتری داشته باشد.<small class=\"reference\"><span>به دنبال درک مراجع در بستر اوست که شامل مواردی مانند هویت، محیط، تجربیات، ارزش‌ها و باورهای اوست.</span><span lang=\"en\" dir=\"ltr\">Seeks to understand the client within their context which may include their identity, environment, experiences, values and beliefs.</span></small>", "<strong>۶٫۳ چیزی بیش از گفته‌ها:</strong> تشخیص می‌دهد کجا حرف ناگفته‌ای هست و درباره‌اش می‌پرسد<small class=\"reference\"><span>تشخیص می‌دهد چه موقع چیزی بیشتر از آنچه مراجع منتقل می‌کند وجود دارد و درباره‌ی آن پرس‌وجو می‌کند.</span><span lang=\"en\" dir=\"ltr\">Recognizes and inquires when there is more to what the client is communicating.</span></small>", "<strong>۶٫۴ نشانه‌های غیرکلامی:</strong> به احساسات، تغییر انرژی و زبان بدن توجه می‌کند و آن را می‌کاود<small class=\"reference\"><span>به عواطف، تغییرات انرژی، نشانه‌های غیرکلامی و سایر رفتارهای مراجع توجه می‌کند، تصدیق می‌کند و درباره‌ی آن‌ها کاوشگری می‌کند.</span><span lang=\"en\" dir=\"ltr\">Notices, acknowledges and explores the client's emotions, energy shifts, non-verbal cues or other behaviors.</span></small>", "<strong>۷٫۳ پرسش درباره‌ی خودِ مراجع:</strong> طرز فکر، ارزش‌ها، نیازها، خواسته‌ها و باورهایش<small class=\"reference\"><span>در مورد مراجع سؤال می‌پرسد، مانند طرز تفکر، ارزش‌ها، نیازها، خواسته‌ها و باورهای او.</span><span lang=\"en\" dir=\"ltr\">Asks questions about the client, such as their way of thinking, values, needs, wants and beliefs.</span></small>"], "pages": [["<strong>۴٫۱ درک در بستر:</strong> هویت، محیط، تجربه‌ها، ارزش‌ها و باورهای مراجع را کاوش می‌کند تا درک بهتری داشته باشد.<small class=\"reference\"><span>به دنبال درک مراجع در بستر اوست که شامل مواردی مانند هویت، محیط، تجربیات، ارزش‌ها و باورهای اوست.</span><span lang=\"en\" dir=\"ltr\">Seeks to understand the client within their context which may include their identity, environment, experiences, values and beliefs.</span></small>"], ["<strong>۶٫۳ چیزی بیش از گفته‌ها:</strong> تشخیص می‌دهد کجا حرف ناگفته‌ای هست و درباره‌اش می‌پرسد<small class=\"reference\"><span>تشخیص می‌دهد چه موقع چیزی بیشتر از آنچه مراجع منتقل می‌کند وجود دارد و درباره‌ی آن پرس‌وجو می‌کند.</span><span lang=\"en\" dir=\"ltr\">Recognizes and inquires when there is more to what the client is communicating.</span></small>"], ["<strong>۶٫۴ نشانه‌های غیرکلامی:</strong> به احساسات، تغییر انرژی و زبان بدن توجه می‌کند و
