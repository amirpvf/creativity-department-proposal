<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آنچه واقعاً برایم مهم است — کتاب کار کشف ارزش‌های شخصی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f5f2; --surface:#ffffff; --ink:#1d2a29; --muted:#5d6b68; --line:#dcd5c3; --border:#e3dfd4;
  --teal:#13595b; --teal-tint:#e6eeed; --brass:#98692c; --brass-tint:#f7f0e3;
  --rose:#99392f; --rose-tint:#f8ebe8; --note:#66706d; --note-tint:#f0efea;
  --green:#2e6a4e; --red:#99392f; --gold:#8a6a2f; --on-teal:#ffffff; --row-alt:#f8f7f3;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111716; --surface:#172020; --ink:#e4ebe9; --muted:#9aaaa6; --line:#35433f; --border:#293533;
    --teal:#62b3ae; --teal-tint:#18302f; --brass:#d3a35d; --brass-tint:#2a2418;
    --rose:#e3857a; --rose-tint:#2e1c1a; --note:#a6b0ad; --note-tint:#1c2322;
    --green:#6dbb94; --red:#e3857a; --gold:#d3a35d; --on-teal:#0f1615; --row-alt:#1a2423;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111716; --surface:#172020; --ink:#e4ebe9; --muted:#9aaaa6; --line:#35433f; --border:#293533;
  --teal:#62b3ae; --teal-tint:#18302f; --brass:#d3a35d; --brass-tint:#2a2418;
  --rose:#e3857a; --rose-tint:#2e1c1a; --note:#a6b0ad; --note-tint:#1c2322;
  --green:#6dbb94; --red:#e3857a; --gold:#d3a35d; --on-teal:#0f1615; --row-alt:#1a2423;
  color-scheme: dark;
}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.95;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--teal)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--border);min-height:58px}
.brand{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.brand b{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12.5px;color:var(--muted)}
.spacer{flex:1}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status[data-s="synced"] i{background:var(--green)}
.status[data-s="local"] i{background:var(--brass)}
.status[data-s="saving"] i{background:var(--teal);animation:pulse 1s infinite}
.status[data-s="error"] i{background:var(--rose)}
@keyframes pulse{50%{opacity:.3}}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 13px;cursor:pointer;font-size:14px;line-height:1.6}
.btn:hover{border-color:var(--teal)}
.btn:focus-visible,.toc a:focus-visible,.navbtn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.menu-btn{display:none}
.dropdown{position:relative}
.dropdown-panel{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:240px;box-shadow:0 12px 30px rgba(0,0,0,.12);display:none;z-index:40}
.dropdown.open .dropdown-panel{display:block}
.dropdown-panel button{display:block;width:100%;text-align:right;background:none;border:0;padding:9px 12px;border-radius:7px;cursor:pointer;font-size:14.5px}
.dropdown-panel button:hover,.dropdown-panel button:focus-visible{background:var(--teal-tint);outline:none}
.dropdown-panel small{display:block;color:var(--muted);font-size:12.5px;padding:4px 12px 6px;line-height:1.7}

/* shell */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1260px;margin:0 auto}
.toc{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100dvh - 58px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:22px 16px 48px;border-inline-end:1px solid var(--border)}
.overall{padding:4px 10px 10px}
.overall .lbl{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.overall .bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:6px}
.overall .bar i{display:block;height:100%;background:var(--teal);transition:width .3s}
.stage-title{font-size:13px;color:var(--brass);font-weight:700;margin:20px 10px 4px;line-height:1.6}
.toc a{display:flex;gap:9px;align-items:center;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.6}
.toc a:hover{background:var(--note-tint)}
.toc a.active{background:var(--teal-tint);color:var(--teal);font-weight:700}
.toc .n{width:22px;flex:none;color:var(--muted);font-weight:700;text-align:center;font-size:13.5px}
.toc a.active .n{color:var(--teal)}
.toc .pg{margin-inline-start:auto;flex:none;width:26px;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.toc .pg i{display:block;height:100%;background:var(--teal)}
.toc .pg.done{background:var(--teal)}
main{padding:40px 28px 120px;min-width:0}
.page{max-width:740px;margin:0 auto}
.scrim{display:none}
@media (max-width:920px){
  .shell{grid-template-columns:1fr}
  .menu-btn{display:inline-flex}
  .toc{position:fixed;top:0;bottom:0;right:0;width:min(330px,88vw);max-height:none;background:var(--surface);z-index:60;transform:translateX(105%);transition:transform .25s ease;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));border:0;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
  body.nav-open .toc{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  main{padding:28px 18px 110px}
  .brand span{display:none}
}
@media (max-width:520px){ .status .txt{display:none} .topbar{padding:10px 12px;gap:8px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* chapter head */
.stage-label{font-size:14px;color:var(--brass);font-weight:700;margin-bottom:10px}
.chap-head{display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--teal);padding-bottom:18px;margin-bottom:26px}
.chap-num{background:var(--teal);color:var(--on-teal);min-width:52px;height:52px;padding:0 10px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:21px;flex:none}
h1{font-size:30px;line-height:1.5;margin:0;font-weight:800;letter-spacing:-.2px}
h2.sub{font-size:20px;font-weight:800;color:var(--teal);margin:38px 0 6px;line-height:1.6}
.lead{font-weight:600;font-size:18px;line-height:2;margin:0 0 16px}
.page p{margin:0 0 14px}
.page ol,.page ul{padding-inline-start:26px;margin:8px 0 16px}
.page li{margin:4px 0}
.page ul li::marker{color:var(--brass)}
.page ol{list-style-type:persian}
.page ol li::marker{color:var(--teal);font-weight:800}

/* boxes */
.box{border-radius:10px;padding:16px 20px;margin:24px 0;border-inline-start:4px solid var(--note);background:var(--note-tint);line-height:2}
.box .bt{font-size:13.5px;font-weight:800;margin-bottom:4px;color:var(--note)}
.box.example{background:var(--teal-tint);border-color:var(--teal)}
.box.example .bt{color:var(--teal)}
.box.example b{color:var(--teal)}
.box.pause{background:var(--brass-tint);border-color:var(--brass)}
.box.pause .bt{color:var(--brass)}
.box.trap{background:var(--rose-tint);border-color:var(--rose)}
.box.trap .bt{color:var(--rose)}
.box em{font-style:normal;font-weight:700;color:var(--teal)}

/* fields */
.field{margin:26px 0}
.qlabel{display:block;font-weight:700;line-height:1.8;margin-bottom:2px}
.hint{display:block;color:var(--muted);font-size:14.5px;line-height:1.85;margin-bottom:4px}
textarea.ruled{display:block;width:100%;border:0;background-color:transparent;background-image:linear-gradient(to bottom,transparent 33px,var(--line) 33px,var(--line) 34px);background-size:100% 34px;background-attachment:local;line-height:34px;font-size:17px;resize:none;padding:0 4px;outline:none;overflow:hidden;border-radius:4px;field-sizing:content}
textarea.ruled:focus{background-image:linear-gradient(to bottom,transparent 33px,var(--teal) 33px,var(--teal) 34px)}
textarea.ruled:focus-visible{outline:2px solid color-mix(in srgb,var(--teal) 35%,transparent);outline-offset:6px}
input.line{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;height:40px;padding:0 4px;font-size:17px;outline:none}
input.line:focus{border-bottom-color:var(--teal);border-bottom-width:2px}
::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.take{background:var(--teal-tint);border-inline-start:4px solid var(--teal);border-radius:10px;padding:16px 20px 18px;margin:30px 0}
.take .bt{font-size:13.5px;font-weight:800;color:var(--teal)}
.free .bt{font-size:14px;font-weight:800;color:var(--brass);margin-bottom:2px}
.free{border-top:1px solid var(--line);padding-top:16px;margin-top:34px}

/* tables */
.tbl{overflow-x:auto;margin:20px 0;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px}
th{background:var(--teal);color:var(--on-teal);font-weight:700;font-size:14.5px;text-align:right;padding:11px 14px;line-height:1.7}
td{border-top:1px solid var(--border);padding:0;vertical-align:top;font-size:15.5px;line-height:1.9}
td + td, th + th{border-inline-start:1px solid var(--border)}
tr:nth-child(even) td{background:var(--row-alt)}
td.txt{padding:11px 14px}
td.lbl{padding:11px 14px;font-weight:700;color:var(--teal);white-space:nowrap}
td.lbl small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
textarea.cell{display:block;width:100%;min-height:50px;border:0;background:transparent;resize:none;padding:11px 14px;line-height:1.8;font-size:15.5px;outline:none;overflow:hidden;field-sizing:content}
textarea.cell:focus,input.cellin:focus{background:var(--teal-tint)}
input.cellin{display:block;width:100%;height:50px;border:0;background:transparent;padding:0 14px;font-size:15.5px;outline:none}
td.chk{text-align:center;vertical-align:middle;width:80px}
td.chk input{width:22px;height:22px;accent-color:var(--teal);cursor:pointer;margin:13px 0}

/* numbered list */
.numlist .row{display:flex;align-items:flex-end;gap:12px}
.numlist .row b{color:var(--teal);width:22px;flex:none;text-align:center;line-height:40px}

/* three */
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.three .c{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px 6px}
.three .c b{color:var(--brass);font-size:14px}
@media (max-width:560px){.three{grid-template-columns:1fr}}

/* recall */
.recall{border:1px dashed var(--teal);border-radius:10px;padding:12px 16px;margin:20px 0;font-size:15px}
.recall .bt{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{background:var(--teal);color:var(--on-teal);border-radius:20px;padding:3px 14px;font-weight:700;font-size:14.5px}
.linkbtn{background:none;border:0;color:var(--teal);text-decoration:underline;cursor:pointer;padding:0;font-size:inherit}
.quote{font-size:17px;font-weight:600;margin-top:4px;white-space:pre-wrap}

/* scale */
.scale{margin:10px 0 0}
.scale .sl{font-size:14px;color:var(--muted);margin-bottom:6px}
.scale .opts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.scale .end{font-size:13.5px;color:var(--muted);padding:0 4px}
.scale label{position:relative}
.scale input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.scale span{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;font-size:15px;cursor:pointer}
.scale input:checked + span{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.scale input:focus-visible + span{outline:2px solid var(--teal);outline-offset:2px}
.scale .clear{margin-inline-start:6px}

/* value checks */
.vgroup{margin:28px 0 8px}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:9px;padding:9px 16px;color:#fff;font-weight:700}
.vhead small{font-weight:500;opacity:.85;font-size:12.5px;direction:ltr}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:600px){.vgrid{grid-template-columns:1fr}}
.vcard{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;line-height:1.8}
.vcard input{width:20px;height:20px;accent-color:var(--teal);margin-top:4px;flex:none;cursor:pointer}
.vcard .en{font-size:12px;color:var(--muted);direction:ltr;text-align:right}
.vcard .fa{font-weight:800;color:var(--teal)}
.vcard .df{font-size:14.5px}
.vcard:has(input:checked){border-color:var(--teal);background:var(--teal-tint)}

/* wheel */
.wheel-wrap{display:flex;justify-content:center;margin:12px 0}
.wheel{width:100%;max-width:420px;height:auto}
.wheel .seg{cursor:pointer}
.wheel .seg path{stroke-width:1.2;transition:fill .15s}
.wheel .seg text{font-family:Vazirmatn,Tahoma,sans-serif;font-weight:800;font-size:15px;pointer-events:none}
.wheel .seg:focus{outline:none}
.wheel .seg:focus-visible path{stroke-width:3.5}
.wheel .ctr{font-family:Vazirmatn,Tahoma,sans-serif;fill:var(--muted);font-size:12px}
.wheel .ctr.b{font-weight:800;font-size:13px}
.legend{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(10,auto);grid-auto-flow:column;gap:4px 22px;font-size:14.5px;margin:10px 0 18px}
.legend div{display:flex;gap:9px;align-items:center}
.legend b{display:grid;place-items:center;min-width:24px;height:22px;border-radius:5px;color:#fff;font-size:12.5px}
.legend .on{font-weight:800}
.wcount{text-align:center;color:var(--muted);font-size:14px}

/* conflict line */
.conflict{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 10px;font-weight:700}
.conflict input.line{width:auto;flex:1 1 140px}

/* cover */
.cover{padding-top:10px}
.cover .org{color:var(--brass);font-weight:800;font-size:15px}
.cover h1{font-size:44px;line-height:1.35;margin:10px 0 6px}
.cover .subt{font-size:20px;font-weight:600;color:var(--teal);margin:0 0 18px}
.cover .tag{font-size:17px;color:var(--muted);max-width:560px;border-inline-start:3px solid var(--brass);padding-inline-start:14px;margin:0 0 30px}
.cover .meta{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;margin-bottom:28px}
@media (max-width:560px){.cover .meta{grid-template-columns:1fr}.cover h1{font-size:34px}}
.startbtn{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:11px 26px;font-weight:700;cursor:pointer;font-size:16px}
.startbtn:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.saveinfo{font-size:14px;color:var(--muted);margin-top:12px}

/* bottom nav */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:60px;border-top:1px solid var(--border);padding-top:22px}
.navbtn{flex:1;max-width:48%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;cursor:pointer;text-align:right;line-height:1.6}
.navbtn small{display:block;color:var(--muted);font-size:12.5px}
.navbtn b{font-size:15px}
.navbtn.next{text-align:left;margin-inline-start:auto}
.navbtn:hover{border-color:var(--teal)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:9px;font-size:14px;z-index:80;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<header class="topbar">
  <button class="btn menu-btn" id="menuBtn" aria-label="فهرست فصل‌ها" aria-controls="toc">فهرست</button>
  <div class="brand"><b>آنچه واقعاً برایم مهم است</b><span>کتاب کار کشف ارزش‌های شخصی — آکادمی تایم کوچ</span></div>
  <div class="spacer"></div>
  <div class="status" id="status" data-s="loading" title=""><i></i><span class="txt">در حال آماده‌سازی…</span></div>
  <div class="dropdown" id="exportDd">
    <button class="btn" id="exportBtn" aria-haspopup="true" aria-expanded="false">خروجی</button>
    <div class="dropdown-panel" role="menu">
      <button role="menuitem" data-act="md">دانلود پاسخ‌ها (Markdown)</button>
      <button role="menuitem" data-act="json">دانلود نسخهٔ پشتیبان</button>
      <button role="menuitem" data-act="import">بازگردانی از نسخهٔ پشتیبان</button>
      <small>نسخهٔ پشتیبان یک فایل JSON است که همهٔ پاسخ‌هایت را نگه می‌دارد.</small>
    </div>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</header>
<div class="shell">
  <nav class="toc" id="toc" aria-label="فصل‌ها"></nav>
  <main id="main"><div class="page" id="page"></div></main>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const FA='۰۱۲۳۴۵۶۷۸۹';
const fa=n=>String(n).replace(/\d/g,d=>FA[d]);
const P=x=>({t:'p',x}), LEAD=x=>({t:'lead',x}), H=x=>({t:'h',x});
const BOX=(k,x,title)=>({t:'box',k,x,title});
const Q=(x,o={})=>({t:'q',x,rows:2,...o});
const L=(x,o={})=>({t:'line',x,...o});
const TAKE=(x,o={})=>({t:'take',x,...o});
const FREE=(rows=8)=>({t:'free',rows});
const LIST=(items,ordered=false)=>({t:'list',items,ordered});
const STATIC=(cols,rows)=>({t:'static',cols,rows});
const TABLE=(cols,n,o={})=>({t:'table',cols,n,...o});
const NUM=(n,o={})=>({t:'num',n,...o});
const SCALE=()=>({t:'scale'});
const THREE=(labels,o={})=>({t:'three',labels,...o});
const RECALL3=()=>({t:'recall3'});
const RECALL1=(key,label)=>({t:'recall1',key,label});
const BOXTITLE={example:'نمونه',pause:'مکث',trap:'دام رایج',note:'یادداشت'};

/* ---------- the 19 values ---------- */
const GROUPS={
  open:{t:'گشودگی به تغییر',s:'آزادی، تازگی و پیروی از انگیزه خود',en:'Openness to Change',c:'--teal'},
  enh:{t:'خودارتقایی',s:'کامیابی، منزلت و توان اثرگذاری',en:'Self-Enhancement',c:'--red'},
  sec:{t:'امنیت',s:'ایمنی و پیش‌بینی‌پذیری',en:'Security',c:'--gold'},
  cons:{t:'پایداری',s:'نظم، پایبندی و پاسداشت آنچه هست',en:'Conservation',c:'--gold'},
  trans:{t:'خودفراروی',s:'بهروزی دیگران، فراتر از منفعت خود',en:'Self-Transcendence',c:'--green'}
};
const VALUES=[
 [1,'خودراهبری ـ اندیشه','Self-Direction — Thought','آزادی برای پروراندن ایده‌ها و توانایی‌های خود.','open'],

/* ---------- assign keys & units ---------- */
const UNITS={}; // sec -> array of arrays of keys
const SECBY={}; S.forEach((s,i)=>{SECBY[s.id]=s;s.idx=i;});
S.forEach(s=>{
  let n=0; const units=[];
  s.blocks.forEach(b=>{
    const base=s.id+'.'+(b.id||('f'+(++n)));
    switch(b.t){
      case 'q': case 'line': case 'take': case 'free': case 'scale':
        b.key=base; units.push([base]); break;
      case 'table': b.key=base; for(let r=0;r<b.n;r++){const u=[];b.cols.forEach((c,j)=>{if(c.type!=='fixed')u.push(base+'.r'+r+'.c'+j)});units.push(u);} break;
      case 'num': b.key=base; for(let i=0;i<b.n;i++) units.push([base+'.'+i]); break;
      case 'three': b.key=base; b.labels.forEach((_,i)=>units.push([base+'.'+i])); break;
      case 'checks': b.key=s.id+'.chk'; units.push(VALUES.map(v=>b.key+'.'+v[0])); break;
      case 'wheel': b.key=s.id+'.wheel'; units.push([b.key]); break;
      case 'conflict': b.key=s.id+'.conf'; units.push([b.key+'.0',b.key+'.1',b.key+'.2']); break;
      case 'cover': units.push(['cover.name'],['cover.date']); break;
    }
  });
  UNITS[s.id]=units;
});

/* ---------- storage ---------- */
const LS_KEY='tc-values-workbook-v1', LS_POS='tc-values-workbook-pos';
let store={v:{},t:{}};
try{const s=localStorage.getItem(LS_KEY);if(s){const o=JSON.parse(s);if(o&&o.v)store={v:o.v||{},t:o.t||{}};}}catch(e){}
let lsTimer;
function saveLocalSoon(){clearTimeout(lsTimer);lsTimer=setTimeout(()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}},250);}
const get=k=>store.v[k]||'';

let cloud=null, colPath='', cloudMode='pending';
const dirty=new Set(), inflight={};
let cloudTimer;
function setVal(key,val){
  if(val) store.v[key]=val; else delete store.v[key];
  const sec=key.split('.')[0];
  store.t[sec]=Date.now();
  saveLocalSoon();
  dirty.add(sec);
  if(cloud){setStatus('saving');clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloud,1200);}
  else if(cloudMode!=='pending'){setStatus('local');}
  refreshProgress();
}
function secEntries(sec){const p=sec+'.',e=[];for(const k in store.v)if(k.startsWith(p))e.push([k.slice(p.length),store.v[k]]);return e;}
async function writeSec(sec){
  if(inflight[sec]){inflight[sec].again=true;return inflight[sec].p;}
  const st={again:false};inflight[sec]=st;
  st.p=(async()=>{try{do{st.again=false;await cloud.col.doc(sec).set({e:secEntries(sec),t:store.t[sec]||Date.now()});}while(st.again);}finally{delete inflight[sec];}})();
  return st.p;
}
async function flushCloud(){
  if(!cloud)return;
  const secs=[...dirty];dirty.clear();
  try{for(const s of secs){await writeSec(s);} if(!dirty.size)setStatus('synced');}
  catch(e){
    secs.forEach(s=>dirty.add(s));
    const c=e&&e.code;
    if(c==='unavailable'||c==='resource_exhausted'){setStatus('saving');clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloud,4000+Math.random()*2000);}
    else if(c==='quota_exceeded'){setStatus('error','فضای ذخیره در حساب پر است؛ پاسخ‌ها روی همین دستگاه نگه داشته می‌شوند.');}
    else{cloud=null;cloudMode='local';setStatus('local');}
  }
}
function applyRemote(docs){
  let changed=false;
  for(const d of docs){
    const b=d.data();if(!b)continue;const sec=d.id;const rt=+b.t||0;
    if(rt>(store.t[sec]||0)&&!dirty.has(sec)&&!inflight[sec]){
      const p=sec+'.';for(const k of Object.keys(store.v))if(k.startsWith(p))delete store.v[k];
      for(const pair of (b.e||[])){if(Array.isArray(pair)&&pair[1])store.v[p+pair[0]]=pair[1];}
      store.t[sec]=rt;changed=true;
    }
  }
  if(changed){saveLocalSoon();syncDom();refreshProgress();}
}
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){cloudMode='local';return setStatus('local');}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){cloudMode='local';return setStatus('local');}
    const uid=await user.id();
    if(!uid){cloudMode='local';return setStatus('local');}
    colPath='data/users/'+uid;
    const col=db.collection(colPath);
    const snap=await col.limit(200).get();
    const remoteT={};snap.docs.forEach(d=>{const b=d.data();remoteT[d.id]=b&&+b.t||0;});
    applyRemote(snap.docs);
    cloud={col};cloudMode='cloud';
    for(const sec in store.t){if((store.t[sec]||0)>(remoteT[sec]||0))dirty.add(sec);}
    if(dirty.size){setStatus('saving');await flushCloud();}else setStatus('synced');
    col.limit(200).onSnapshot(qs=>applyRemote(qs.docs),()=>{});
  }catch(e){cloud=null;cloudMode='local';setStatus('local');}
}

/* wheel */
function segPath(i,r0,r1){
  const w=2*Math.PI/19,a0=i*w+0.012,a1=(i+1)*w-0.012,cx=200,cy=200;
  const p=(r,a)=>[(cx+r*Math.sin(a)).toFixed(2),(cy-r*Math.cos(a)).toFixed(2)];
  const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
  return `M${x0},${y0} A${r1},${r1} 0 0 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 0 0 ${x3},${y3} Z`;
}
function wheelSVG(){
  const w=2*Math.PI/19;let h=`<svg class="wheel" viewBox="0 0 400 400" role="group" aria-label="نقشه دایره‌ای ۱۹ ارزش">`;
  h+=`<line x1="200" y1="112" x2="200" y2="288" stroke="var(--line)" stroke-dasharray="3 4"/><line x1="112" y1="200" x2="288" y2="200" stroke="var(--line)" stroke-dasharray="3 4"/>`;
  VALUES.forEach((v,i)=>{
    const c=GROUPS[v[4]].c, a=(i+.5)*w, tx=(200+142*Math.sin(a)).toFixed(1), ty=(200-142*Math.cos(a)).toFixed(1);
    h+=`<g class="seg" data-v="${v[0]}" role="checkbox" aria-checked="false" tabindex="0" aria-label="${v[1]}" style="--c:var(${c})"><path d="${segPath(i,96,186)}" stroke="var(${c})"/><text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central">${fa(v[0])}</text></g>`;
  });
  h+=`<text class="ctr b" x="200" y="148" text-anchor="middle" style="fill:var(--teal)">رشد و گشودگی</text><text class="ctr b" x="200" y="258" text-anchor="middle" style="fill:var(--gold)">خودحفاظتی</text><text class="ctr" x="248" y="190" text-anchor="middle">تمرکز بر خود</text><text class="ctr" x="152" y="190" text-anchor="middle">تمرکز بر دیگران</text>`;
  return h+'</svg>';
}
function paintWheel(){

  document.querySelectorAll('.wheel .seg').forEach(g=>{

    const p=g.querySelector('path'),t=g.querySelector('text');
    p.style.fill=on?'var(--c)':'color-mix(in srgb, var(--c) 13%, var(--surface))';
    p.style.strokeWidth=on?'2.5':'1.2';

  if(lg) lg.innerHTML=VALUES.map(v=>`<div class="${sel.has(v[0])?'on':''}"><b style="background:var(${GROUPS[v[4]].c})">${fa(v[0])}</b>${v[1]}${sel.has(v[0])?' ✓':''}</div>`).join('');
  const wc=document.getElementById('wcount');

}
function toggleWheel(n){

const LH=34;
function fit(el){
  if(el.tagName!=='TEXTAREA')return;
  el.style.height='auto';
  if(el.classList.contains('ruled')){const min=(+el.getAttribute('rows')||2)*LH;el.style.height=Math.max(min,Math.ceil(el.scrollHeight/LH)*LH)+'px';}
  else el.style.height=Math.max(50,el.scrollHeight)+'px';
}
function fillEl(el){
  const k=el.dataset.key,v=get(k);
  if(el.type==='checkbox') el.checked=!!v;
  else if(el.type==='radio') el.checked=(v===el.value);
  else if(el.value!==v) el.value=v;
  if(el.dataset.ph) el.placeholder=el.dataset.ph;
  fit(el);
}
function syncDom(){
  pageEl.querySelectorAll('[data-key]').forEach(el=>{if(el!==document.activeElement)fillEl(el);});
  if(current==='apA')paintWheel();
}

    h+=`<div class="chap-head">${s.num!=null?`<div class="chap-num">${typeof s.num==='number'?fa(s.num):s.num}</div>`:''}<h1>${s.title}</h1></div>`;
  }
  h+=s.blocks.map(b=>blockHTML(b,s)).join('');
  const prev=S[s.idx-1],next=S[s.idx+1];
  h+=`<div class="pager">${prev?`<button class="navbtn" data-go="${prev.id}"><small>قبلی</small><b>${prev.title}</b></button>`:'<span></span>'}${next?`<button class="navbtn next" data-go="${next.id}"><small>بعدی</small><b>${next.title}</b></button>`:''}</div>`;
  if(s.blocks.some(b=>b.t==='table'&&b.cols.some(c=>c.type==='value'))) h+=`<datalist id="vals">${VALUES.map(v=>`<option value="${v[1]}">`).join('')}</datalist>`;
  pageEl.innerHTML=h;
  pageEl.querySelectorAll('[data-key]').forEach(fillEl);
  if(s.id==='apA')paintWheel();
  renderToc();
  if(scroll)window.scrollTo(0,0);
  document.body.classList.remove('nav-open');
  requestAnimationFrame(()=>pageEl.querySelectorAll('textarea').forEach(fit));
}

/* progress & toc */
function secProgress(id){const u=UNITS[id]||[];if(!u.length)return null;let f=0;u.forEach(keys=>{if(keys.some(k=>store.v[k]))f++;});return [f,u.length];}
function renderToc(){
  let total=0,filled=0;S.forEach(s=>{const p=secProgress(s.id);if(p){filled+=p[0];total+=p[1];}});
  const pct=total?Math.round(filled/total*100):0;
  let h=`<div class="overall"><div class="lbl"><span>پیشرفت کل</span><b>${fa(pct)}٪</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  let stage=null;
  S.forEach(s=>{
    if(s.stage!==stage){stage=s.stage;h+=`<div class="stage-title">${stage}</div>`;}
    const p=secProgress(s.id);
    const pg=p?(p[0]>=p[1]?`<span class="pg done" title="کامل"></span>`:`<span class="pg" title="${fa(p[0])} از ${fa(p[1])}"><i style="width:${Math.round(p[0]/p[1]*100)}%"></i></span>`):'';
    const n=s.num==null?'':(typeof s.num==='number'?fa(s.num):s.num);
    h+=`<a href="#${s.id}" data-go="${s.id}" class="${s.id===current?'active':''}" ${s.id===current?'aria-current="page"':''}><span class="n">${n}</span><span>${s.title}</span>${pg}</a>`;
  });
  tocEl.innerHTML=h;
}
let progTimer;function refreshProgress(){clearTimeout(progTimer);progTimer=setTimeout(renderToc,400);}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){e.preventDefault();render(go.dataset.go);return;}
  const cl=e.target.closest('[data-clear]');
  if(cl){setVal(cl.dataset.clear,'');pageEl.querySelectorAll(`input[name="${cl.dataset.clear}"]`).forEach(r=>r.checked=false);return;}
  const seg=e.target.closest('.wheel .seg');
  if(seg){toggleWheel(+seg.dataset.v);return;}
  const dd=document.getElementById('exportDd');
  if(e.target.closest('#exportBtn')){const o=dd.classList.toggle('open');document.getElementById('exportBtn').setAttribute('aria-expanded',o);return;}
  const act=e.target.closest('[data-act]');
  if(act){dd.classList.remove('open');doAction(act.dataset.act);return;}
  if(!e.target.closest('#exportDd'))dd.classList.remove('open');
});
document.addEventListener('keydown',e=>{
  const seg=e.target.closest&&e.target.closest('.wheel .seg');
  if(seg&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggleWheel(+seg.dataset.v);}
  if(e.key==='Escape'){document.getElementById('exportDd').classList.remove('open');document.body.classList.remove('nav-open');}
});
pageEl.addEventListener('input',e=>{
  const el=e.target;const k=el.dataset&&el.dataset.key;if(!k)return;
  if(el.type==='checkbox')setVal(k,el.checked?'1':'');
  else if(el.type==='radio'){if(el.checked)setVal(k,el.value);}
  else{setVal(k,el.value.trim()?el.value:'');fit(el);}
});
pageEl.addEventListener('change',e=>{const el=e.target;if(el.type==='radio'&&el.checked&&el.dataset.key)setVal(el.dataset.key,el.value);});
document.getElementById('menuBtn').addEventListener('click',()=>document.body.classList.toggle('nav-open'));
document.getElementById('scrim').addEventListener('click',()=>document.body.classList.remove('nav-open'));
window.addEventListener('resize',()=>{clearTimeout(window.__rt);window.__rt=setTimeout(()=>pageEl.querySelectorAll('textarea').forEach(fit),150);});

/* ---------- export / import ---------- */
const toastEl=document.getElementById('toast');
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),3200);}
const strip=s=>String(s).replace(/<br\s*\/?>/g,' ').replace(/<[^>]+>/g,'').trim();
function toMarkdown(){
  const out=['# آنچه واقعاً برایم مهم است','کتاب کار کشف ارزش‌های شخصی — آکادمی تایم کوچ',''];
  if(get('cover.name'))out.push('**این کتاب متعلق به:** '+get('cover.name'));
  if(get('cover.date'))out.push('**تاریخ شروع:** '+get('cover.date'));
  S.forEach(s=>{
    const lines=[];let lastH='';
    const ans=(label,v)=>{if(v){if(lastH){lines.push('### '+lastH);lastH='';}lines.push((label?`**${strip(label)}**\n\n`:'')+v.trim(),'');}};
    s.blocks.forEach(b=>{
      switch(b.t){
        case 'h': lastH=strip(b.x);break;
        case 'q': case 'line': case 'take': ans(b.x||'',get(b.key));break;
        case 'free': ans('فضای نوشتن',get(b.key));break;
        case 'scale': ans('هم‌خوانی با تجربه من',get(b.key)?fa(get(b.key))+' از ۱۰':'');break;
        case 'num': case 'three': {const n=b.t==='num'?b.n:b.labels.length;const it=[];for(let i=0;i<n;i++){const v=get(b.key+'.'+i);if(v)it.push(`${fa(i+1)}. ${v}`);}ans('',it.join('\n'));break;}
        case 'conflict': {const a=[0,1,2].map(i=>get(b.key+'.'+i));if(a.some(Boolean))ans('',`میان ${a[0]||'…'} و ${a[1]||'…'} — و معمولاً برنده: ${a[2]||'…'}`);break;}
        case 'checks': {const it=VALUES.filter(v=>get(b.key+'.'+v[0])).map(v=>'- '+v[1]);ans('ارزش‌های علامت‌خورده',it.join('\n'));break;}
        case 'wheel': {const sel=get(b.key).split(',').filter(Boolean).map(Number);ans('ارزش‌های علامت‌خورده روی دایره',VALUES.filter(v=>sel.includes(v[0])).map(v=>'- '+v[1]).join('\n'));break;}
        case 'table': {
          const rows=[];
          for(let r=0;r<b.n;r++){const cells=b.cols.map((c,j)=>c.type==='fixed'?b.fixed[r]:c.type==='check'?(get(b.key+'.r'+r+'.c'+j)?'✓':''):(get(b.key+'.r'+r+'.c'+j)||'').replace(/\n/g,' ').replace(/\|/g,'/'));
            const has=b.cols.some((c,j)=>c.type!=='fixed'&&get(b.key+'.r'+r+'.c'+j));if(has)rows.push('| '+cells.join(' | ')+' |');}
          if(rows.length)ans('',['| '+b.cols.map(c=>strip(c.h)).join(' | ')+' |','|'+b.cols.map(()=>'---').join('|')+'|',...rows].join('\n'));
          break;}
      }
    });
    if(lines.length){out.push('',`## ${s.num!=null&&typeof s.num==='number'?fa(s.num)+'. ':''}${s.title}`,'',...lines);}
  });
  return out.join('\n');
}
let downloads=null;
async function doAction(a){
  if(a==='import'){document.getElementById('importFile').click();return;}
  const data=a==='md'?toMarkdown():JSON.stringify({app:'tc-values-workbook',version:1,saved:new Date().toISOString(),v:store.v,t:store.t},null,1);
  const filename=a==='md'?'values-workbook-answers.md':'values-workbook-backup.json';
  if(!downloads&&window.claude&&window.claude.use){try{downloads=await window.claude.use('downloads');}catch(e){}}
  if(downloads){
    try{await downloads.save({filename,data});toast('فایل ذخیره شد.');}
    catch(e){if(e&&e.code==='declined')return;toast('ذخیرهٔ فایل در این صفحه ممکن نشد.');}
  }else toast('دانلود فایل در این نمای صفحه در دسترس نیست.');
}
document.getElementById('importFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{
    const o=JSON.parse(await f.text());
    if(!o||o.app!=='tc-values-workbook'||typeof o.v!=='object')throw 0;
    if(!confirm('پاسخ‌های فعلی با محتوای این فایل جایگزین می‌شوند. ادامه می‌دهی؟'))return;
    store.v={};for(const k in o.v)if(typeof o.v[k]==='string'&&o.v[k])store.v[k]=o.v[k];
    const now=Date.now();store.t={};S.forEach(s=>{store.t[s.id]=now;dirty.add(s.id);});
    saveLocalSoon();render(current,false);
    if(cloud){setStatus('saving');flushCloud();}
    toast('پاسخ‌ها از نسخهٔ پشتیبان بازگردانی شدند.');
  }catch(err){toast('این فایل نسخهٔ پشتیبانِ این کتاب کار نیست.');}
});

/* ---------- start ---------- */
let start='cover';try{const p=localStorage.getItem(LS_POS);if(p&&SECBY[p])start=p;}catch(e){}
const hs=location.hash.slice(1);if(SECBY[hs])start=hs;
render(start,false);
setStatus('loading');
initCloud();
setTimeout(()=>{if(cloudMode==='pending'){/* still waiting on viewer; answers are safe locally */statusEl.title=STIP.local;}},4000);
})();
</script>
