<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pinkbake — پنل سفارش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --icing:#FFF6FA;
  --sugar:#FFFFFF;
  --blush:#FFE1EC;
  --blush-deep:#FFC7DC;
  --raspberry:#D81B60;
  --raspberry-soft:#F06292;
  --plum:#3F1B2B;
  --cocoa:#8C6B79;
  --line:#F4D7E2;
  --pistachio:#6FA84B;
  --caramel:#E09B3D;
  --lav:#C3B0DA;
  --box:#E3BE95;
  --shadow:0 10px 30px rgba(216,27,96,.10);
  --shadow-sm:0 4px 14px rgba(216,27,96,.08);
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;
  background:
    radial-gradient(900px 400px at 100% -5%, #FFEAF2 0%, rgba(255,234,242,0) 60%),
    radial-gradient(700px 380px at 0% 0%, #FFF1D9 0%, rgba(255,241,217,0) 55%),
    var(--icing);
  color:var(--plum);
  font-size:15px;
  line-height:1.75;
  min-height:100vh;
  padding:0 0 104px;
}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2.5px solid var(--raspberry);outline-offset:2px;border-radius:8px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 4px 16px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:44px;height:44px;filter:drop-shadow(0 6px 10px rgba(216,27,96,.22))}
.brand{font-weight:800;font-size:26px;letter-spacing:-.5px;line-height:1}
.brand{color:var(--raspberry)}
.brand span{color:#fff;-webkit-text-stroke:1.1px var(--raspberry);text-shadow:0 2px 6px rgba(216,27,96,.28)}
.brand small{display:block;font-size:11.5px;font-weight:500;color:var(--cocoa);letter-spacing:2px;margin-top:3px}
.today{margin-inline-start:auto;text-align:left;font-size:12.5px;color:var(--cocoa);line-height:1.6}
.today b{display:block;color:var(--plum);font-size:14.5px;font-weight:700}
.saved{display:inline-flex;align-items:center;gap:6px;background:#EAF6E2;color:#41682A;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--sugar);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-sm);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--cocoa);transition:.18s}
.tab:hover{background:var(--icing);color:var(--raspberry)}
.tab.on{background:var(--raspberry);color:#fff;box-shadow:0 6px 14px rgba(216,27,96,.28)}

/* cards */
.card{background:var(--sugar);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);margin-top:16px}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800}
.card p.hint{margin:0 0 14px;color:var(--cocoa);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--cocoa);margin-bottom:5px}
input[type=text],input[type=tel],input[type=number],input[type=time],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#FFFBFD;transition:.15s
}
input:focus,select:focus,textarea:focus{border-color:var(--raspberry-soft);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(240,98,146,.15)}
textarea{resize:vertical;min-height:64px}
.fldhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--cocoa);margin-bottom:5px}
.steps{display:flex;gap:8px;margin-top:16px}
.step{flex:1;display:flex;align-items:center;gap:9px;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--sugar);font-weight:700;font-size:13.5px;color:var(--cocoa);transition:.16s;text-align:start}
.step:hover{border-color:var(--blush-deep)}
.step.on{border-color:var(--raspberry);background:#fff;color:var(--plum);box-shadow:0 6px 16px rgba(216,27,96,.13)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--blush);color:var(--raspberry);display:grid;place-items:center;font-size:12.5px;flex:none}
.step.on .n{background:var(--raspberry);color:#fff}
.step.done .n{background:#EAF6E2;color:#41682A}
.step small{display:block;font-weight:500;font-size:11px;opacity:.75;margin-top:1px}
@media(max-width:720px){.steps{flex-direction:column;gap:6px}.step small{display:none}}
.mini-summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:#FFF1F6;border:1.5px dashed var(--blush-deep);margin-top:14px;font-size:13px}
.mini-summary b{color:var(--raspberry)}
.optbox{margin-top:14px;border:1.5px dashed var(--line);border-radius:14px;padding:12px}
.optbox.on{border-style:solid;border-color:var(--blush-deep);background:#FFFBFD}
.ihelp{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
 background:var(--blush);color:var(--raspberry);font-size:11px;font-weight:800;margin-inline-start:6px;
 cursor:help;position:relative;flex:none;font-family:inherit;border:none;vertical-align:middle}
.ihelp:hover,.ihelp:focus-visible{background:var(--raspberry);color:#fff}
.ihelp .tip{display:none;position:absolute;z-index:70;bottom:calc(100% + 8px);inset-inline-start:50%;
 transform:translateX(50%);width:250px;max-width:70vw;background:var(--plum);color:#fff;font-weight:500;
 font-size:12.5px;line-height:1.75;padding:9px 12px;border-radius:12px;box-shadow:0 10px 28px rgba(63,27,43,.3);
 text-align:start;cursor:default;pointer-events:none}
.ihelp .tip:after{content:'';position:absolute;top:100%;inset-inline-start:50%;transform:translateX(50%);
 border:6px solid transparent;border-top-color:var(--plum)}
.ihelp:hover .tip,.ihelp:focus-visible .tip{display:block}
h2 .ihelp{vertical-align:2px}
.faq{border:1.5px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden;background:#FFFCFD}
.faq>summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.faq>summary::-webkit-details-marker{display:none}
.faq>summary:before{content:'▾';color:var(--raspberry);font-size:12px;transition:.15s}
.faq[open]>summary:before{transform:rotate(180deg)}
.faq>summary:hover{background:var(--icing)}
.faq .inner{padding:0 16px 14px;font-size:13.5px;line-height:1.95;color:var(--plum)}
.faq .inner p{margin:0 0 8px}
.faq .inner ol,.faq .inner ul{margin:0 0 8px;padding-inline-start:20px}
.faq .inner li{margin-bottom:5px}
.faq .inner b{color:var(--raspberry)}
.kbd{display:inline-block;background:var(--blush);color:var(--raspberry);border-radius:7px;padding:1px 7px;font-size:12px;font-weight:700}
.navrow{display:flex;gap:10px;margin-top:16px}
.locked{border:2px solid var(--blush-deep);background:linear-gradient(180deg,#FFF9FC,#FFF4F8)}
.locked h2{color:var(--raspberry)}
.lineno{width:24px;height:24px;border-radius:50%;background:var(--raspberry);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.tstar{margin-inline-start:7px;font-size:12px;opacity:.7;cursor:pointer}
.tstar.on{color:var(--caramel);opacity:1}
.tab.on .tstar{color:#fff}
.tab.on .tstar.on{color:#FFE08A}
.dd{position:relative}
.dd-btn{width:100%;text-align:start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#FFFBFD;font-weight:600;display:flex;align-items:center;gap:8px}
.dd-btn i{margin-inline-start:auto;font-style:normal;color:var(--cocoa);font-size:11px}
.dd.open .dd-btn{border-color:var(--raspberry-soft);box-shadow:0 0 0 3px rgba(240,98,146,.15)}
.dd-list{display:none;position:absolute;z-index:60;top:calc(100% + 4px);inset-inline:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:280px;overflow:auto;padding:6px}
.dd.open .dd-list{display:block}
.dd-row{display:flex;align-items:center;border-radius:10px}
.dd-row:hover{background:var(--icing)}
.dd-row.on{background:var(--blush)}
.dd-opt{flex:1;text-align:start;padding:8px;font-size:14px}
.dd-star{width:30px;padding:7px 0;font-size:15px;color:#D6BDC8;line-height:1}
.dd-star.on{color:var(--caramel)}
.dd-star.ph{display:inline-block}
.starbtn{background:none;border:none;color:var(--raspberry);font-size:16px;line-height:1;padding:0 4px;cursor:pointer}
.starbtn.off{color:#D6BDC8}
.starbtn:hover{transform:scale(1.15)}
.mini-sw{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--raspberry);white-space:nowrap}
.mini-sw input{width:15px;height:15px;accent-color:var(--raspberry);cursor:pointer}
.mini-sw.off{color:var(--cocoa)}
.fld.offbox input{opacity:.5}
.sw{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:#FFFBFD;cursor:pointer;font-weight:600;font-size:13.5px}
.sw input{width:18px;height:18px;accent-color:var(--raspberry);cursor:pointer}
.sw.off{color:var(--cocoa);background:#FFF7FA}
.dayhead{display:flex;align-items:center;gap:10px;margin:16px 0 8px;font-weight:800;font-size:13.5px;color:var(--raspberry)}
.dayhead:after{content:'';flex:1;height:1px;background:var(--line)}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.stat{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:#FFFCFD}
.stat b{display:block;font-size:16px;color:var(--raspberry)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.moneyin{direction:ltr;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.btn{background:var(--raspberry);color:#fff;padding:11px 20px;border-radius:12px;font-weight:700;box-shadow:0 6px 16px rgba(216,27,96,.25);transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(216,27,96,.3)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--blush);color:var(--raspberry);box-shadow:none}
.btn.ghost:hover{background:var(--blush-deep)}
.btn.mini{padding:6px 12px;font-size:12.5px;border-radius:10px;box-shadow:none}
.btn.danger{background:#fff;color:#B3245C;border:1.5px solid var(--line);box-shadow:none}
.btn.danger:hover{background:#FFF0F5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{margin-inline-start:auto}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.chip.new{background:var(--blush);color:var(--raspberry)}
.chip.baking{background:#FDF0DC;color:#9A6516}
.chip.done{background:#EAF6E2;color:#41682A}
.divider{height:1px;background:var(--line);margin:14px 0}

/* cake-layer cost bar (signature) */
.slice{margin-top:12px}
.slice-bar{display:flex;height:26px;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);background:#fff}
.slice-bar i{display:block;height:100%}
.slice-key{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:12px;color:var(--cocoa)}
.slice-key span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* lists */
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#FFFCFD}
.item.hi{border-color:var(--blush-deep);background:#FFF6FA}
.item b.name{font-size:15px}
.muted{color:var(--cocoa);font-size:12.5px}
.price{font-weight:800;color:var(--raspberry);font-size:15px}
.empty{text-align:center;color:var(--cocoa);padding:26px 10px;font-size:13.5px}
.empty .cake{font-size:30px;display:block;margin-bottom:6px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px}
.cal-title{font-weight:800;font-size:16px;min-width:170px;text-align:center}
.nav{width:34px;height:34px;border-radius:50%;background:var(--blush);color:var(--raspberry);font-weight:800;display:grid;place-items:center}
.nav:hover{background:var(--blush-deep)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:11.5px;font-weight:700;color:var(--cocoa);padding-bottom:4px}
.day{position:relative;aspect-ratio:1;border-radius:12px;border:1.5px solid transparent;background:#FFFAFC;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;transition:.15s;min-height:42px}
.day:hover{border-color:var(--blush-deep)}
.day.off{color:#D9C4CC;background:transparent}
.day.fri{color:var(--raspberry-soft)}
.day.today{border-color:var(--raspberry);color:var(--raspberry);font-weight:800}
.day.sel{background:var(--raspberry);color:#fff;border-color:var(--raspberry)}
.day .g{font-size:9px;font-weight:500;opacity:.6;line-height:1}
.day .pips{position:absolute;bottom:5px;display:flex;gap:2px}
.day .pips i{width:5px;height:5px;border-radius:50%;background:var(--raspberry-soft)}
.day.sel .pips i{background:#fff}

/* picker popover */
.pick{position:relative}
.pop{position:absolute;z-index:40;top:calc(100% + 6px);inset-inline-start:0;background:var(--sugar);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;width:320px;max-width:92vw;display:none}
.pop.on{display:block}
.date-btn{width:100%;text-align:start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#FFFBFD;font-weight:600}
.date-btn .g2{color:var(--cocoa);font-weight:500;font-size:12px}

/* toast */
#toast{position:fixed;bottom:96px;inset-inline-start:50%;transform:translateX(50%) translateY(20px);background:var(--plum);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90}
#toast.on{opacity:1;transform:translateX(50%) translateY(0)}
.savebar{position:fixed;bottom:0;inset-inline:0;z-index:80;display:flex;justify-content:center;
 padding:16px 12px 20px;pointer-events:none;
 background:linear-gradient(to top,rgba(255,246,250,.97) 45%,rgba(255,246,250,0))}
.saveall{pointer-events:auto;display:inline-flex;align-items:center;gap:9px;padding:13px 30px;border-radius:999px;
 font-weight:800;font-size:15px;background:#fff;color:var(--cocoa);border:1.5px solid var(--line);
 box-shadow:var(--shadow);transition:.18s}
.saveall.dirty{background:var(--raspberry);color:#fff;border-color:var(--raspberry);box-shadow:0 10px 26px rgba(216,27,96,.35)}
.saveall.dirty:hover{transform:translateY(-2px)}
.saveall .ic{font-size:17px;line-height:1}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg .fl{position:absolute;bottom:-16vh;opacity:.10;color:var(--raspberry);animation:drift linear infinite}
.bg .fl svg{width:100%;height:100%;display:block}
@keyframes drift{
 0%{transform:translateY(0) rotate(-8deg)}
 50%{transform:translateY(-60vh) translateX(3vw) rotate(6deg)}
 100%{transform:translateY(-125vh) translateX(-2vw) rotate(-10deg)}
}
.bg .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.30;animation:breathe 18s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.bg .sp{position:absolute;width:7px;height:3px;border-radius:2px;background:var(--raspberry-soft);opacity:.22;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(110vh) rotate(320deg)}}
.wrap{position:relative;z-index:1}
.savebar{z-index:80}
@media (prefers-reduced-motion:reduce){.bg{display:none}}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--cocoa);text-align:start;padding:6px 4px;font-weight:600}
td{padding:5px 4px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* ---------- تبدیل تاریخ شمسی/میلادی ---------- */
function div(a,b){return Math.trunc(a/b)}
function mod(a,b){return a-b*Math.floor(a/b)}
var BR=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy,wl){var bl=BR.length,gy=jy+621,leapJ=-14,jp=BR[0],jm,jump,leap,leapG,march,n,i;
 for(i=1;i<bl;i++){jm=BR[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
 n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);
 if(mod(jump,33)===4&&jump-n===4)leapJ++;
 leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
 if(!wl){if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4}
 return{leap:leap,gy:gy,march:march}}
function g2d(gy,gm,gd){var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
 return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2g(jdn){var j,i,gd,gm,gy;j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
 i=div(mod(j,1461),4)*5+308;gd=div(mod(i,153),5)+1;gm=mod(div(i,153),12)+1;gy=div(j,1461)-100100+div(8-gm,6);
 return{gy:gy,gm:gm,gd:gd}}
function j2d(jy,jm,jd){var r=jalCal(jy,true);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy,false),f=g2d(gy,3,r.march),k=jdn-f,jm,jd;
 if(k>=0){if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy:jy,jm:jm,jd:jd}}k-=186}
 else{jy--;k+=179;if(r.leap===1)k++}
 jm=7+div(k,30);jd=mod(k,30)+1;return{jy:jy,jm:jm,jd:jd}}
function toJ(gy,gm,gd){return d2j(g2d(gy,gm,gd))}
function toG(jy,jm,jd){return d2g(j2d(jy,jm,jd))}
var JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var GM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
function jLen(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;return jalCal(jy,false).leap===1?30:29}
function jKey(d){return d.jy+'-'+String(d.jm).padStart(2,'0')+'-'+String(d.jd).padStart(2,'0')}
function keyToJ(k){var p=k.split('-');return{jy:+p[0],jm:+p[1],jd:+p[2]}}
function jToDate(j){var g=toG(j.jy,j.jm,j.jd);return new Date(g.gy,g.gm-1,g.gd)}
function jWeekday(j){return (jToDate(j).getDay()+1)%7} /* 0 = شنبه */
function nowParts(){
 var n=new Date(), tz=(typeof S!=='undefined'&&S&&S.settings)?S.settings.tz:'';
 if(tz){try{
  var o={};
  new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',
   hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(n).forEach(function(x){o[x.type]=x.value});
  var hh=+o.hour;if(hh===24)hh=0;
  return {y:+o.year,m:+o.month,d:+o.day,hh:hh,mm:+o.minute}
 }catch(e){}}
 return {y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate(),hh:n.getHours(),mm:n.getMinutes()}
}
function today(){var p=nowParts();return toJ(p.y,p.m,p.d)}
function faDateLong(j){return fa(j.jd)+' '+JM[j.jm-1]+' '+fa(j.jy)}
function grDate(j){var g=toG(j.jy,j.jm,j.jd);return g.gd+' '+GM[g.gm-1]+' '+g.gy}
function grHTML(j){return '<span class="ltr">'+grDate(j)+'</span>'}
function grLong(j){var g=toG(j.jy,j.jm,j.jd);
 try{return new Date(g.gy,g.gm-1,g.gd).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
 catch(e){return grDate(j)}}

/* ---------- ابزار ---------- */
var FD='۰۱۲۳۴۵۶۷۸۹';
function fmtTime(t){
 if(!t)return '';
 var p=String(t).split(':'),h=+p[0]||0,m=(p[1]||'00');
 if(S.settings.time24!==false)return fa((h<10?'0':'')+h+':'+m);
 var suf=h<12?'قبل‌ازظهر':'بعدازظهر',h12=h%12;if(h12===0)h12=12;
 return fa(h12+':'+m)+' '+suf;
}
function fa(n){return String(n).replace(/[0-9]/g,function(d){return FD[+d]}).replace(/\.(?=[۰-۹])/g,'٫')}
function money(n){return fa(Math.round(n||0).toLocaleString('en-US'))}
function toLatin(x){return String(x==null?'':x).replace(/[۰-۹٠-٩]/g,function(c){
 var a='۰۱۲۳۴۵۶۷۸۹'.indexOf(c);if(a>-1)return a;return '٠١٢٣٤٥٦٧٨٩'.indexOf(c)})}
function phoneKey(x){return toLatin(x).replace(/[^0-9]/g,'')}
function waLink(phone,text){
 var dg=phoneKey(phone);if(!dg)return '';
 if(dg.charAt(0)==='0')dg='98'+dg.slice(1);else if(dg.slice(0,2)!=='98'&&dg.length===10)dg='98'+dg;
 return 'https://wa.me/'+dg+(text?'?text='+encodeURIComponent(text):'')}

    '<button type="button" class="dd-opt muted" data-ddpick="'+key+'|">— '+esc(ph||'انتخاب نشده')+' —</button></div>'+
   items.map(function(it){
    return '<div class="dd-row'+(String(it.v)===String(cur)?' on':'')+'">'+
     (it.nostar?'<span class="dd-star ph"></span>'

function ddPick(key,val){

 else if(key==='CSORT')UI.custSort=val||'total';
 else if(key.slice(0,2)==='U~'){var g=S.ingredients.find(function(x){return x.id===key.slice(2)});
  if(g){g.unit=val;touch();render();return}}
 act();render()
}
function ddStar(key,val){
 var st=S.settings,was;
 if(key==='P'){was=st.defProduct===val;st.defProduct=was?'':val}
 else if(key==='S'){if(!UI.selP)return toast('اول محصول را انتخاب کنید');
  st.defSize=st.defSize||{};was=st.defSize[UI.selP]===val;
  if(was)delete st.defSize[UI.selP];else st.defSize[UI.selP]=val}
 else if(key==='I'){was=st.defDecIng===val;st.defDecIng=was?'':val}
 else if(key==='M'){was=+st.defMult===+val;st.defMult=was?0:+val}
 else if(key==='SORT'){was=st.defSort===val;st.defSort=was?'':val}
 else if(key==='CSORT'){was=st.defCustSort===val;st.defCustSort=was?'':val}
 else if(key.slice(0,2)==='U~'){was=st.defUnit===val;st.defUnit=was?'':val}
 touch();render();
 toast(was?'پیش‌فرض برداشته شد':'پیش‌فرض شد ★')
}

function grp(n){return (Math.round(+n)||0).toLocaleString('en-US')}
function unnum(v){return +String(v).replace(/[^0-9.]/g,'')||0}
function reformatMoney(el){
 var pos=el.selectionStart==null?el.value.length:el.selectionStart;
 var dig=(el.value.slice(0,pos).match(/[0-9]/g)||[]).length;
 var raw=el.value.replace(/[^0-9]/g,'');
 var out=raw?(+raw).toLocaleString('en-US'):'';
 el.value=out;
 var c=0,i=0;for(;i<out.length&&c<dig;i++){if(out[i]>='0'&&out[i]<='9')c++}
 try{el.setSelectionRange(i,i)}catch(e){}
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on')},2000)}
function savedFlash(){var c=document.getElementById('savedChip');c.classList.add('on');clearTimeout(c._h);c._h=setTimeout(function(){c.classList.remove('on')},1800)}

function calc(p,size){
 var mat=0;(p.recipe||[]).forEach(function(r){mat+=ingPrice(r.i)*r.q});
 var f=size?size.f:1, box=size?(size.box||0):0;
 mat=mat*f;
 var st=S.settings;
 var k=st.prodLaborBySize===false?0:(st.prodLaborScale==null?1:+st.prodLaborScale);
 var lf=1+(f-1)*k;
 var labor=st.prodUseLabor===false?0:(p.labor||0)/60*st.laborRate*lf;
 var over=st.prodUseOver?(mat+labor)*(st.prodOver||0)/100:0;
 var cost=mat+labor+box+over;
 var profit=st.prodUseProfit?cost*(st.prodProfit||0)/100:0;
 var raw=cost+profit;
 var step=S.settings.round||1;
 var final=Math.ceil(raw/step)*step;
 return{mat:mat,labor:labor,box:box,over:over,profit:profit,cost:cost,final:final}
}

 var cost=mat+labor+over, profit=st.decUseProfit?cost*(st.decProfit||0)/100:0;
 var step=S.settings.round||1;

 if(dd.mode==='manual'&&+dd.priceOverride>0)fin=+dd.priceOverride;

function bindNew(){
 var d=UI.draft;
 var g=function(id){return document.getElementById(id)};
 ['cName:name','cPhone:phone','cNote:note'].forEach(function(p){
  var a=p.split(':'),el=g(a[0]);if(el){
   el.addEventListener('input',function(){d[a[1]]=el.value});
   el.addEventListener('change',function(){d[a[1]]=el.value;act()})}});
 var readTime=function(){
  var H=g('tH'),M=g('tM'),AP=g('tAP');
  if(!H)return;
  if(H.value===''){d.time='';render();return}
  var h=+H.value,m=(M&&M.value)||'00';
  if(AP){if(AP.value==='pm'&&h<12)h+=12;if(AP.value==='am'&&h===12)h=0}
  d.time=(h<10?'0':'')+h+':'+m;render()};
 ['tH','tM','tAP'].forEach(function(id){var el=g(id);if(el)el.addEventListener('change',readTime)});
 var tc=g('tClr');
 if(tc)tc.addEventListener('click',function(){d.time='';render()});
 ['cDisc:discount','cDep:deposit'].forEach(function(p){
  var a=p.split(':'),el=g(a[0]);if(el)el.addEventListener('change',function(){
   d[a[1]]=unnum(el.value);
   if(a[1]==='deposit')d.depMode='manual';
   var tot=d.items.reduce(function(s,it){return s+lineTotal(it)},0);
   var st=g('sumTotal'),sd=g('sumDue');
   if(st)st.textContent=money(tot);
   if(sd)sd.textContent=money(tot-(+d.discount||0)-currentDep(d,tot));
   V.querySelectorAll('[data-dep]').forEach(function(b){
    b.classList.toggle('ghost',b.dataset.dep!==(d.depMode||'manual'))})})});
 V.querySelectorAll('[data-depmstar]').forEach(function(b){b.addEventListener('click',function(e){
  e.stopPropagation();var k=b.dataset.depmstar;

 V.querySelectorAll('[data-dep]').forEach(function(b){b.addEventListener('click',function(e){
  if(e.target.closest('[data-depmstar]'))return;
  d.depMode=b.dataset.dep;

   d.deposit=currentDep(d,tot)}

 V.querySelectorAll('[data-decmode]').forEach(function(b){b.addEventListener('click',function(){

 ['decName:name','decMat:matCost','decFix:priceOverride'].forEach(function(x){
  var a=x.split(':'),el=g(a[0]);

 var decAdd=g('decAdd');
 if(decAdd)decAdd.addEventListener('click',function(){

 itemPreview();

  act();render();window.scrollTo({top:0,behavior:'smooth'})})});
 var ci2=g('cancelItem');
 if(ci2)ci2.addEventListener('click',function(){cancelItemEdit();render()});
 var ci=g('clearItems');

function refreshProduct(pid){

 var hd=el('hd-'+pid);if(hd)hd.textContent=fa(p.sizes.length)+' اندازه'+(S.settings.prodUseLabor!==false?' • دستمزد '+fa(p.labor)+' دقیقه':'');
 var ch=el('chips-'+pid);if(ch)ch.innerHTML=p.sizes.map(function(s){return '<span class="chip new">'+esc(s.label)+' — '+money(calc(p,s).final)+'</span>'}).join('');
 var sl=el('slice-'+pid);if(sl&&p.sizes[0])sl.innerHTML=sliceBar(calc(p,p.sizes[0]));
 p.recipe.forEach(function(r,ix){var g=S.ingredients.find(function(y){return y.id===r.i})||{price:0};

}

function bindSet(){
 V.querySelectorAll('[data-st]').forEach(function(x){x.addEventListener('change',function(){S.settings[x.dataset.st]=unnum(x.value);touch();render()})});
 V.querySelectorAll('[data-stb]').forEach(function(x){x.addEventListener('change',function(){
  S.settings[x.dataset.stb]=x.value==='1';touch();render()})});
 V.querySelectorAll('[data-dm]').forEach(function(x){x.addEventListener('change',function(){
  var a=x.dataset.dm.split('|'),m=depMode(a[0]);if(!m)return;
  if(a[1]==='label')m.label=x.value;
  else if(a[1]==='type'){m.type=x.value;touch();render();return}
  else m.value=unnum(x.value);
  touch()})});
 V.querySelectorAll('[data-depstar]').forEach(function(x){x.addEventListener('click',function(){
  var id=x.dataset.depstar;
  S.settings.defDepMode=(S.settings.defDepMode===id)?'':id;
  touch();render()})});
 V.querySelectorAll('[data-depdel]').forEach(function(x){x.addEventListener('click',function(){
  S.settings.depModes=(S.settings.depModes||[]).filter(function(m){return m.id!==x.dataset.depdel});
  if(S.settings.defDepMode===x.dataset.depdel)S.settings.defDepMode='';
  touch();render()})});
 var ad=document.getElementById('addDep');
 if(ad)ad.addEventListener('click',function(){
  S.settings.depModes.push({id:uid(),label:'حالت جدید',type:'pct',value:20});touch();render()});
 V.querySelectorAll('[data-stx]').forEach(function(x){x.addEventListener('change',function(){
  var k=x.dataset.stx;S.settings[k]=(k==='currency'?(x.value||'تومان'):x.value);touch();render()})});
 V.querySelectorAll('[data-sw]').forEach(function(x){x.addEventListener('change',function(){S.settings[x.dataset.sw]=x.checked;touch();render()})});
}
function bindBackup(){
 V.querySelectorAll('[data-stb]').forEach(function(x){x.addEventListener('change',function(){
  S.settings[x.dataset.stb]=x.value==='1';touch();render()})});
 var sn=document.getElementById('saveNow');
 if(sn)sn.addEventListener('click',async function(){await save();render()});
 var e=document.getElementById('exp');
 if(e)e.addEventListener('click',function(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='pinkbake-backup-'+jKey(today())+'.json';a.click();toast('فایل پشتیبان ساخته شد')});
 var i=document.getElementById('imp');
 if(i)i.addEventListener('change',function(){
  var f=i.files[0];if(!f)return;var r=new FileReader();
  r.onload=async function(){try{var d=JSON.parse(r.result);
    S={ingredients:d.ingredients||[],products:d.products||[],orders:d.orders||[],settings:Object.assign(seed().settings,d.settings||{})};
    pushHist();await save(true);render();toast('اطلاعات بازیابی شد')}catch(err){toast('فایل معتبر نیست')}};
  r.readAsText(f)});
 var w=document.getElementById('wipe');
 if(w)w.addEventListener('click',async function(){if(!confirm('همه سفارش‌ها پاک شوند؟ محصولات و مواد باقی می‌مانند.'))return;
  S.orders=[];touch();render()});
}
